<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ruthie Open Font Library — Batch 01</title><style>:root{--bg:#071122;--panel:#0c1930;--ink:#f1f5ff;--muted:#93a5c5;--line:#243959;--cream:#fff2c8;--blue:#b9d5ff;--size:34px}*{box-sizing:border-box}html{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif}body{margin:0;padding-bottom:105px}header{position:sticky;top:0;z-index:20;padding:13px 15px;background:rgba(7,17,34,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.k{font-size:10px;letter-spacing:.17em;color:var(--blue);font-weight:800}h1{font-size:19px;margin:2px 0}.sub{font-size:11px;color:var(--muted)}nav{display:flex;gap:6px;overflow:auto;padding-top:8px}nav a{white-space:nowrap;color:var(--blue);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 8px;font-size:10px}.global,main{max-width:980px;margin:auto;padding:14px}.global{padding-bottom:0}.box,.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}.box input[type=text]{width:100%;margin-top:7px;background:#061222;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px}.range{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:10px;color:var(--muted)}.range input{flex:1}.card{margin-bottom:18px;scroll-margin-top:110px}.head{display:flex;gap:10px}.num{font:700 12px ui-monospace;color:var(--muted);padding-top:5px}h2{font-size:29px;line-height:1;margin:0}.artist{font-size:11px;color:var(--blue);margin-top:5px}.why{font-size:13px;line-height:1.45;color:#d5deed}.lic{font-size:9px;letter-spacing:.12em;color:var(--muted)}.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.pill{display:inline-flex;align-items:center;justify-content:center;min-height:32px;padding:7px 10px;border:1px solid #304b70;border-radius:999px;background:#10223d;color:var(--ink);font-size:10px;cursor:pointer}.pill.active{background:var(--cream);border-color:var(--cream);color:#182130;font-weight:850}.votes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}.votes .pill{font-weight:800;letter-spacing:.08em}.ctl{border-block:1px solid var(--line);margin:13px 0;padding:11px 0}.lab{font-size:9px;letter-spacing:.12em;color:var(--muted);font-weight:700;margin-top:10px}.samples{display:grid;gap:8px}.sample{background:#081528;border:1px solid #1c3150;border-radius:12px;padding:10px;overflow:hidden}.sl{font:700 9px system-ui;color:var(--muted);letter-spacing:.14em;margin-bottom:6px}.st{font-size:var(--size);line-height:1.08;overflow-wrap:anywhere;outline:none}.body .st{font-size:clamp(15px,4vw,19px);line-height:1.45}textarea{width:100%;min-height:62px;margin-top:11px;border:1px solid var(--line);border-radius:11px;background:#061222;color:var(--ink);padding:10px;font:12px system-ui}.footer{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 12px max(10px,env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(7,17,34,.98) 32%)}.fi{max-width:980px;margin:auto;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}#status{font-size:12px;color:var(--blue);font-weight:800;min-height:18px}#copy{background:var(--cream);color:#162234;border:0;border-radius:999px;padding:10px 14px;font-weight:850}pre{white-space:pre-wrap;background:#020914;border:1px solid var(--line);border-radius:12px;padding:11px;font:11px ui-monospace}@media(min-width:720px){.card{padding:22px}.samples{grid-template-columns:1fr 1fr}.body{grid-column:1/-1}}</style></head><body><header><div class="k">RUTHIE OPEN FONT LIBRARY · BATCH 01</div><h1>Ten things worth owning</h1><div class="sub">Live type · autosaved decisions · editable specimens</div><nav id="nav"></nav></header><div class="global"><div class="box"><div class="lab">THROW THE SAME TEXT AT ALL TEN</div><input id="global" type="text" placeholder="Type anything here…"><div class="range"><span>Display size</span><input id="size" type="range" min="22" max="76" value="34"><span id="sizev">34</span></div></div></div><main id="app"></main><div class="footer"><div class="fi"><div id="status" aria-live="polite"></div><button id="copy">COPY PICKS</button></div></div><script>const F=[{id:'adaxi',n:'ADAXI',a:'La Scuola Open Source / Bari Città Aperta workshop',w:'Public-space lettering turned into a collaborative modular display face.',l:'SIL OFL 1.1',f:[['Regular','Adaxi','https://raw.githubusercontent.com/lascuolaopensource/bca-font-Adaxi/main/fonts/web/ADAXI.woff2','woff2']]},{id:'frames',n:'Frames Part One',a:'Nathan Laurent',w:'A geometric monospace with alternate behavior: useful infrastructure without office-font vibes.',l:'SIL OFL 1.1',f:[['Thin','FramesThin','https://raw.githubusercontent.com/NathanLaurent/nathanlaurent.github.io/main/framespartone-thin.woff','woff'],['Light','FramesLight','https://raw.githubusercontent.com/NathanLaurent/nathanlaurent.github.io/main/framespartone-light.woff','woff'],['Regular','FramesRegular','https://raw.githubusercontent.com/NathanLaurent/nathanlaurent.github.io/main/framespartone-regular.woff','woff'],['Medium','FramesMedium','https://raw.githubusercontent.com/NathanLaurent/nathanlaurent.github.io/main/framespartone-medium.woff','woff'],['Bold','FramesBold','https://raw.githubusercontent.com/NathanLaurent/nathanlaurent.github.io/main/framespartone-bold.woff','woff']],x:['ss01','ss02','ss03','ss04','salt','dlig']},{id:'sprat',n:'Sprat',a:'Ethan Nakache',w:'High-contrast serif with enough width and weight variation to function as a display system.',l:'SIL OFL 1.1',f:[['Condensed Light','SpratCL','https://raw.githubusercontent.com/EthanNakache/Sprat-type/master/Sprat-CondensedLight.otf','opentype'],['Condensed Bold','SpratCB','https://raw.githubusercontent.com/EthanNakache/Sprat-type/master/Sprat-CondensedBold.otf','opentype'],['Extended Light','SpratEL','https://raw.githubusercontent.com/EthanNakache/Sprat-type/master/Sprat-ExtendedLight.otf','opentype'],['Extended Bold','SpratEB','https://raw.githubusercontent.com/EthanNakache/Sprat-type/master/Sprat-ExtendedBold.otf','opentype']]},{id:'bagnard',n:'Bagnard',a:'Sébastien Sanfilippo',w:'A serif inspired by graffiti carved by an anonymous Napoleonic-war prisoner: strange provenance, usable result.',l:'SIL OFL 1.1',f:[['Regular','Bagnard','https://raw.githubusercontent.com/sebsan/Bagnard/master/Bagnard.otf','opentype']]},{id:'cotham',n:'Cotham Sans',a:'Sébastien Sanfilippo',w:'A calm baseline sans that still looks drawn rather than corporate.',l:'SIL OFL 1.1',f:[['Regular','Cotham','https://raw.githubusercontent.com/sebsan/Cotham/master/CothamSans.otf','opentype']]},{id:'dauphine',n:'Dauphine',a:'Alexandre Leray, Stéphanie Vilayphiou, Charles Mazé & Coline Sunier',w:'Geometric art-school identity typography with cartographic and industrial-drawing DNA.',l:'SIL OFL 1.1',f:[['Regular','Dauphine','https://raw.githubusercontent.com/no-feature/dauphine/gh-pages/Dauphine%20Regular.otf','opentype']]},{id:'dof',n:'DOF',a:'Paul Bernhard',w:'A METAFONT system conceived as adjustable typographic genes: procedural typography rather than one frozen drawing.',l:'SIL OFL 1.1',f:[['1 Regular','Dof1Reg','https://raw.githubusercontent.com/paulbernhard/dof/master/fonts/dof-1-reg.woff','woff'],['1 Extended','Dof1Ext','https://raw.githubusercontent.com/paulbernhard/dof/master/fonts/dof-1-ext.woff','woff'],['1 Italic','Dof1It','https://raw.githubusercontent.com/paulbernhard/dof/master/fonts/dof-1-it.woff','woff'],['2 Regular','Dof2Reg','https://raw.githubusercontent.com/paulbernhard/dof/master/fonts/dof-2-reg.woff','woff'],['Afield','DofAfield','https://raw.githubusercontent.com/paulbernhard/dof/master/fonts/DOF-Afield-Regular.woff','woff'],['Afield Italic','DofAfieldIt','https://raw.githubusercontent.com/paulbernhard/dof/master/fonts/DOF-Afield-Italic.woff','woff']]},{id:'version',n:'Version',a:'Christoph Haag & Xavier Klein',w:'A deliberately versioned experiment that becomes progressively more complex — type as an evolving process.',l:'SIL OFL 1.1',f:[['0.4 / 10','Version10','https://raw.githubusercontent.com/xavierKlein/versionFont/master/0.4/Version_0.4_10_skeletor_avec.ttf','truetype'],['0.4 / 40','Version40','https://raw.githubusercontent.com/xavierKlein/versionFont/master/0.4/Version_0.4_40_skeletor_avec.ttf','truetype'],['0.4 / 80','Version80','https://raw.githubusercontent.com/xavierKlein/versionFont/master/0.4/Version_0.4_80_skeletor_avec.ttf','truetype'],['0.4 / 100','Version100','https://raw.githubusercontent.com/xavierKlein/versionFont/master/0.4/Version_0.4_100_skeletor_avec.ttf','truetype']]},{id:'half',n:'Half',a:'Bryce Wilner',w:'Four related geometric cuts whose differences feel mechanical rather than merely heavier or lighter.',l:'SIL OFL 1.1',f:[['21','Half21','https://raw.githubusercontent.com/brycewilner/Half/master/Half-21.otf','opentype'],['39','Half39','https://raw.githubusercontent.com/brycewilner/Half/master/Half-39.otf','opentype'],['51','Half51','https://raw.githubusercontent.com/brycewilner/Half/master/Half-51.otf','opentype'],['75','Half75','https://raw.githubusercontent.com/brycewilner/Half/master/Half-75.otf','opentype']]},{id:'avara',n:'Avara',a:'Raphaël Bastide + collaborators',w:'A transitional serif forced onto a rough square grid: familiar at distance, construction-system strange up close.',l:'SIL OFL 1.1',f:[['Bold','AvaraBold','https://gitlab.com/velvetyne/Avara/-/raw/master/fonts/Avara-Bold.otf','opentype'],['Black','AvaraBlack','https://gitlab.com/velvetyne/Avara/-/raw/master/fonts/Avara-Black.otf','opentype'],['Bold Italic','AvaraBI','https://gitlab.com/velvetyne/Avara/-/raw/master/fonts/Avara-BoldItalic.otf','opentype']]}];const S=[['NAME','RUTHFUL JOSEF ROTSCHOPF'],['SPATIAL','Spatial Press — The sky. The vantage. The view.'],['DATA','N  E  S  W · 34.1722° N · 103.3470° W · 05:57 PM'],['HOSTILE NAME','Alexandria-Marguerite O’Shaughnessy'],['PLACE','St. John’s, Newfoundland & Labrador'],['GLYPHS','ABCDEFGHIJKLM NOPQRSTUVWXYZ · abcdefghijklm nopqrstuvwxyz · 0123456789'],['BODY','A useful type library should hold both infrastructure and trouble. Some faces need to disappear into the work; others should make the material itself visible.']];const st=document.createElement('style');st.textContent=F.flatMap(o=>o.f.map(q=>`@font-face{font-family:'${q[1]}';src:url('${q[2]}') format('${q[3]}');font-display:swap}`)).join('');document.head.append(st);const KEY='ruthie-font-b01-web',state=JSON.parse(localStorage.getItem(KEY)||'{}');const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const app=document.getElementById('app'),nav=document.getElementById('nav');function render(){app.innerHTML='';nav.innerHTML='';F.forEach((o,i)=>{state[o.id]??={vote:'',face:o.f[0][0],features:[],notes:''};nav.insertAdjacentHTML('beforeend',`<a href="#${o.id}">${String(i+1).padStart(2,'0')} ${o.n}</a>`);const c=document.createElement('section');c.className='card';c.id=o.id;c.innerHTML=`<div class="head"><div class="num">${String(i+1).padStart(2,'0')}</div><div><h2>${o.n}</h2><div class="artist">${o.a}</div></div></div><div class="votes"></div><p class="why">${o.w}</p><div class="lic">${o.l}</div><div class="ctl"><div class="lab">SUPPLIED CUTS / STATES</div><div class="row faces"></div>${o.x?'<div class="lab">OPENTYPE</div><div class="row feats"></div>':''}</div><div class="samples"></div><textarea placeholder="Optional note…">${state[o.id].notes||''}</textarea>`;const samples=c.querySelector('.samples');const setFace=()=>{const q=o.f.find(x=>x[0]===state[o.id].face)||o.f[0];samples.style.fontFamily=`'${q[1]}'`;samples.style.fontFeatureSettings=(state[o.id].features||[]).map(x=>`"${x}" 1`).join(',')};['YES','MAYBE','NO'].forEach(v=>{const b=document.createElement('button');b.className='pill'+(state[o.id].vote===v?' active':'');b.textContent=v;b.onclick=()=>{state[o.id].vote=v;save();render()};c.querySelector('.votes').append(b)});o.f.forEach(q=>{const b=document.createElement('button');b.className='pill'+(state[o.id].face===q[0]?' active':'');b.textContent=q[0];b.onclick=()=>{state[o.id].face=q[0];save();render()};c.querySelector('.faces').append(b)});(o.x||[]).forEach(x=>{const b=document.createElement('button');b.className='pill'+((state[o.id].features||[]).includes(x)?' active':'');b.textContent=x;b.onclick=()=>{const a=state[o.id].features||[];state[o.id].features=a.includes(x)?a.filter(y=>y!==x):[...a,x];save();render()};c.querySelector('.feats').append(b)});S.forEach(([a,b])=>samples.insertAdjacentHTML('beforeend',`<div class="sample ${a==='BODY'?'body':''}"><div class="sl">${a}</div><div class="st" contenteditable spellcheck="false">${b}</div></div>`));c.querySelector('textarea').oninput=e=>{state[o.id].notes=e.target.value;save()};setFace();app.append(c)})}render();document.getElementById('global').oninput=e=>{if(e.target.value)document.querySelectorAll('.sample:not(.body) .st').forEach(x=>x.textContent=e.target.value)};document.getElementById('size').oninput=e=>{document.documentElement.style.setProperty('--size',e.target.value+'px');document.getElementById('sizev').textContent=e.target.value};document.getElementById('copy').onclick=async()=>{const text=JSON.stringify({batch:1,picks:F.map((o,i)=>({number:i+1,name:o.n,...state[o.id]}))},null,2),s=document.getElementById('status');try{await navigator.clipboard.writeText(text);s.textContent='Copied ✓';setTimeout(()=>{if(s.textContent==='Copied ✓')s.textContent=''},3000)}catch(e){s.textContent='Copy blocked — long-press this text';const p=document.createElement('pre');p.textContent=text;app.append(p);p.scrollIntoView({behavior:'smooth'})}};</script></body></html>
