<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ruthie Open Font Library — Batch 02</title><style>:root{--bg:#071122;--panel:#0c1930;--ink:#f1f5ff;--muted:#93a5c5;--line:#243959;--cream:#fff2c8;--blue:#b9d5ff;--size:34px}*{box-sizing:border-box}html{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif}body{margin:0;padding-bottom:112px}header{position:sticky;top:0;z-index:20;padding:13px 15px;background:rgba(7,17,34,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.k{font-size:10px;letter-spacing:.17em;color:var(--blue);font-weight:800}h1{font-size:19px;margin:2px 0}.sub{font-size:11px;color:var(--muted);line-height:1.35}nav{display:flex;gap:6px;overflow:auto;padding-top:8px}nav a{white-space:nowrap;color:var(--blue);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 8px;font-size:10px}.global,main{max-width:980px;margin:auto;padding:14px}.global{padding-bottom:0}.box,.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}.box input[type=text]{width:100%;margin-top:7px;background:#061222;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px}.range{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:10px;color:var(--muted)}.range input{flex:1}.card{margin-bottom:18px;scroll-margin-top:110px}.head{display:flex;gap:10px}.num{font:700 12px ui-monospace;color:var(--muted);padding-top:5px}h2{font-size:29px;line-height:1;margin:0}.artist{font-size:11px;color:var(--blue);margin-top:5px;line-height:1.3}.why{font-size:13px;line-height:1.45;color:#d5deed}.lic{font-size:9px;letter-spacing:.12em;color:var(--muted)}.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.pill{display:inline-flex;align-items:center;justify-content:center;min-height:32px;padding:7px 10px;border:1px solid #304b70;border-radius:999px;background:#10223d;color:var(--ink);font-size:10px;cursor:pointer}.pill.active{background:var(--cream);border-color:var(--cream);color:#182130;font-weight:850}.votes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}.votes .pill{font-weight:800;letter-spacing:.08em}.ctl{border-block:1px solid var(--line);margin:13px 0;padding:11px 0}.lab{font-size:9px;letter-spacing:.12em;color:var(--muted);font-weight:700;margin-top:10px}.samples{display:grid;gap:8px}.sample{background:#081528;border:1px solid #1c3150;border-radius:12px;padding:10px;overflow:hidden}.sl{font:700 9px system-ui;color:var(--muted);letter-spacing:.14em;margin-bottom:6px}.st{font-size:var(--size);line-height:1.08;overflow-wrap:anywhere;outline:none}.body .st{font-size:clamp(15px,4vw,19px);line-height:1.45}textarea{width:100%;min-height:62px;margin-top:11px;border:1px solid var(--line);border-radius:11px;background:#061222;color:var(--ink);padding:10px;font:12px system-ui}.footer{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 12px max(10px,env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(7,17,34,.98) 32%)}.fi{max-width:980px;margin:auto;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}#status{font-size:12px;color:var(--blue);font-weight:850;min-height:18px}#copy{background:var(--cream);color:#162234;border:0;border-radius:999px;padding:10px 14px;font-weight:850}pre{white-space:pre-wrap;background:#020914;border:1px solid var(--line);border-radius:12px;padding:11px;font:11px ui-monospace}@media(min-width:720px){.card{padding:22px}.samples{grid-template-columns:1fr 1fr}.body{grid-column:1/-1}}</style></head><body><header><div class="k">RUTHIE OPEN FONT LIBRARY · BATCH 02</div><h1>Ten more things worth owning</h1><div class="sub">Live type · real supplied cuts · autosaved decisions · editable specimens</div><nav id="nav"></nav></header><div class="global"><div class="box"><div class="lab">THROW THE SAME TEXT AT ALL TEN</div><input id="global" type="text" placeholder="Type anything here…"><div class="range"><span>Display size</span><input id="size" type="range" min="22" max="76" value="34"><span id="sizev">34</span></div></div></div><main id="app"></main><div class="footer"><div class="fi"><div id="status" aria-live="polite"></div><button id="copy">COPY PICKS</button></div></div><script>const F=[{id:'optician',n:'Optician Sans',a:'ANTI Hamar + Fábio Duarte Martins',w:'Historical eye-chart logic expanded into a complete display typeface: designed around equal legibility, but not sterile.',l:'SIL OFL 1.1',f:[['Regular','Optician','https://raw.githubusercontent.com/anewtypeofinterference/Optician-Sans/master/Web-PS/Optician-Sans.woff2','woff2']]},{id:'hyde',n:'Hyde',a:'Andrew Berry',w:'A Reading MA type-design serif from 2008: restrained enough to become infrastructure, but with a definite hand and a real italic.',l:'SIL OFL 1.1',f:[['Regular','HydeRegular','https://raw.githubusercontent.com/andrewb/hyde/main/OTFs/Hyde-Regular.otf','opentype'],['Italic','HydeItalic','https://raw.githubusercontent.com/andrewb/hyde/main/OTFs/Hyde-Italic.otf','opentype'],['Bold','HydeBold','https://raw.githubusercontent.com/andrewb/hyde/main/OTFs/Hyde-Bold.otf','opentype']]},{id:'aldone',n:'Aldone',a:'Pietro Gregorini',w:'A non-conventional geometric sans inspired by Aldo Novarese: low contrast, clean structure, little flashes of wrongness.',l:'SIL OFL 1.1',f:[['Light','AldoneLight','https://raw.githubusercontent.com/pietrogregorini/aldone/master/fonts/otf/Aldone-Light.otf','opentype'],['Regular','AldoneRegular','https://raw.githubusercontent.com/pietrogregorini/aldone/master/fonts/otf/Aldone-Regular.otf','opentype'],['Medium','AldoneMedium','https://raw.githubusercontent.com/pietrogregorini/aldone/master/fonts/otf/Aldone-Medium.otf','opentype'],['SemiBold','AldoneSemi','https://raw.githubusercontent.com/pietrogregorini/aldone/master/fonts/otf/Aldone-SemiBold.otf','opentype'],['Bold','AldoneBold','https://raw.githubusercontent.com/pietrogregorini/aldone/master/fonts/otf/Aldone-Bold.otf','opentype']]},{id:'stmartin',n:'St. Martin',a:'Carl J. Kurtz',w:'A 2024 experimental revival built around a recurring artifact in 19th-century Jean-Alexis Rouchon posters — a historical oddity turned into a usable sans.',l:'SIL OFL 1.1',f:[['Thin','StMartinThin','https://raw.githubusercontent.com/CarlJKurtz/st.martin/main/fonts/webfonts/StMartin-Thin.woff2','woff2'],['Light','StMartinLight','https://raw.githubusercontent.com/CarlJKurtz/st.martin/main/fonts/webfonts/StMartin-Light.woff2','woff2'],['Regular','StMartinRegular','https://raw.githubusercontent.com/CarlJKurtz/st.martin/main/fonts/webfonts/StMartin-Regular.woff2','woff2'],['Medium','StMartinMedium','https://raw.githubusercontent.com/CarlJKurtz/st.martin/main/fonts/webfonts/StMartin-Medium.woff2','woff2'],['Bold','StMartinBold','https://raw.githubusercontent.com/CarlJKurtz/st.martin/main/fonts/webfonts/StMartin-Bold.woff2','woff2']]},{id:'amarna',n:'Amarna',a:'IJ van Laar',w:'A semi-glyphic humanist sans: readable at text size, increasingly carved and naturalistic as it gets large. A useful bridge between baseline and artifact.',l:'SIL OFL 1.1',f:[['Thin','AmarnaThin','https://raw.githubusercontent.com/ijvanl/Amarna/main/fonts/webfonts/Amarna-Thin.woff2','woff2'],['Light','AmarnaLight','https://raw.githubusercontent.com/ijvanl/Amarna/main/fonts/webfonts/Amarna-Light.woff2','woff2'],['Regular','AmarnaRegular','https://raw.githubusercontent.com/ijvanl/Amarna/main/fonts/webfonts/Amarna-Regular.woff2','woff2'],['Medium','AmarnaMedium','https://raw.githubusercontent.com/ijvanl/Amarna/main/fonts/webfonts/Amarna-Medium.woff2','woff2'],['Bold','AmarnaBold','https://raw.githubusercontent.com/ijvanl/Amarna/main/fonts/webfonts/Amarna-Bold.woff2','woff2'],['Italic','AmarnaItalic','https://raw.githubusercontent.com/ijvanl/Amarna/main/fonts/webfonts/Amarna-Italic.woff2','woff2']]},{id:'yuyu',n:'Yuyu',a:'Julia García López',w:'A personal-identity typeface refined by a visual artist over years: slender, hand-made, friendly, and deliberately more legible in its main cut than its display-short sibling.',l:'SIL OFL 1.1',f:[['Regular','YuyuRegular','https://raw.githubusercontent.com/JuliaGarciaLopez/Yuyu-Font/main/fonts/Yuyu/webfonts/Yuyu-Regular.woff2','woff2'],['Short','YuyuShort','https://raw.githubusercontent.com/JuliaGarciaLopez/Yuyu-Font/main/fonts/Yuyu-Short/webfonts/YuyuShort-Regular.woff2','woff2']]},{id:'isenheim',n:'Isenheim',a:'Benoît Ferran / Tunera Type Foundry',w:'A medieval-influenced serif that wandered far from its revival source: alternate-rich, lombardic-adjacent, and somehow still usable as actual typography.',l:'SIL OFL 1.1',f:[['Régulier','IsenheimRegular','https://gitlab.com/benoitsansterre/isenheim/-/raw/main/fonts/OpenType-PS/Isenheim_Regulier.otf','opentype'],['Fin','IsenheimFin','https://gitlab.com/benoitsansterre/isenheim/-/raw/main/fonts/OpenType-PS/Isenheim_Fin.otf','opentype']]},{id:'ft88',n:'FT88',a:'Ange Degheest · revival by EESAB Rennes atelier',w:'A family originally commissioned for the Minitel under an extreme 10×8-pixel grid. Historical forms colliding with a telecommunications interface that never got to ship them.',l:'SIL OFL 1.1',f:[['Regular','FT88Regular','https://gitlab.com/Eugenie-B/degheest-types/-/raw/master/fonts/webfonts/FT88-Regular.woff2','woff2'],['Italic','FT88Italic','https://gitlab.com/Eugenie-B/degheest-types/-/raw/master/fonts/webfonts/FT88-Italic.woff2','woff2'],['Bold','FT88Bold','https://gitlab.com/Eugenie-B/degheest-types/-/raw/master/fonts/webfonts/FT88-Bold.woff2','woff2'],['Expanded','FT88Expanded','https://gitlab.com/Eugenie-B/degheest-types/-/raw/master/fonts/webfonts/FT88-Expanded.woff2','woff2'],['Serif','FT88Serif','https://gitlab.com/Eugenie-B/degheest-types/-/raw/master/fonts/webfonts/FT88-Serif.woff2','woff2'],['Gothique','FT88Gothique','https://gitlab.com/Eugenie-B/degheest-types/-/raw/master/fonts/webfonts/FT88-Gothique.woff2','woff2'],['School','FT88School','https://gitlab.com/Eugenie-B/degheest-types/-/raw/master/fonts/webfonts/FT88-School.woff2','woff2']]},{id:'serreria',n:'Serrería Extravagante',a:'Medialab Prado workshop / Manufactura Independente',w:'Lettering liberated from the old Belgian Sawmill façade in Madrid by a thirty-person libre-tools workshop — the deliberately decorative branch of the resulting family.',l:'SIL OFL 1.1',f:[['Medium','Serreria','https://manufacturaindependente.org/media/fonts/MFI-Serreria-Extravagante.otf','opentype']]},{id:'cerne',n:'Cerne',a:'Peter S. Baker',w:'A color-font reconstruction of the ninth-century Book of Cerne script, with modern and historical behavior and pigment-based color logic. This is typeface-as-research-instrument territory.',l:'SIL OFL 1.1',f:[['Regular','Cerne','https://raw.githubusercontent.com/psb1558/Cerne-font/master/webfiles/Cerne.woff2','woff2']],x:['hist','dlig','ss06']}];const S=[['NAME','RUTHFUL JOSEF ROTSCHOPF'],['SPATIAL','Spatial Press — The sky. The vantage. The view.'],['DATA','N  E  S  W · 34.1722° N · 103.3470° W · 05:57 PM'],['HOSTILE NAME','Alexandria-Marguerite O’Shaughnessy'],['PLACE','St. John’s, Newfoundland & Labrador'],['GLYPHS','ABCDEFGHIJKLM NOPQRSTUVWXYZ · abcdefghijklm nopqrstuvwxyz · 0123456789'],['PUNCTUATION','() [] {} ‹› «» / \\ — – · • : ; , . ! ? @ # $ % & * + ='],['BODY','A useful type library should hold both infrastructure and trouble. Some faces need to disappear into the work; others should make the material itself visible.']];const st=document.createElement('style');st.textContent=F.flatMap(o=>o.f.map(q=>`@font-face{font-family:'${q[1]}';src:url('${q[2]}') format('${q[3]}');font-display:swap}`)).join('');document.head.append(st);const KEY='ruthie-font-b02-web',state=JSON.parse(localStorage.getItem(KEY)||'{}');const save=()=>localStorage.setItem(KEY,JSON.stringify(state)),app=document.getElementById('app'),nav=document.getElementById('nav');function render(){app.innerHTML='';nav.innerHTML='';F.forEach((o,i)=>{state[o.id]??={vote:'',face:o.f[0][0],features:[],notes:''};nav.insertAdjacentHTML('beforeend',`<a href="#${o.id}">${String(i+1).padStart(2,'0')} ${o.n}</a>`);const c=document.createElement('section');c.className='card';c.id=o.id;c.innerHTML=`<div class="head"><div class="num">${String(i+1).padStart(2,'0')}</div><div><h2>${o.n}</h2><div class="artist">${o.a}</div></div></div><div class="votes"></div><p class="why">${o.w}</p><div class="lic">${o.l}</div><div class="ctl"><div class="lab">SUPPLIED CUTS / STATES</div><div class="row faces"></div>${o.x?'<div class="lab">OPENTYPE</div><div class="row feats"></div>':''}</div><div class="samples"></div><textarea placeholder="Optional note…">${state[o.id].notes||''}</textarea>`;const samples=c.querySelector('.samples');const apply=()=>{const q=o.f.find(x=>x[0]===state[o.id].face)||o.f[0];samples.style.fontFamily=`'${q[1]}'`;samples.style.fontFeatureSettings=(state[o.id].features||[]).map(x=>`"${x}" 1`).join(',')};['YES','MAYBE','NO'].forEach(v=>{const b=document.createElement('button');b.className='pill'+(state[o.id].vote===v?' active':'');b.textContent=v;b.onclick=()=>{state[o.id].vote=v;save();render()};c.querySelector('.votes').append(b)});o.f.forEach(q=>{const b=document.createElement('button');b.className='pill'+(state[o.id].face===q[0]?' active':'');b.textContent=q[0];b.onclick=()=>{state[o.id].face=q[0];save();render()};c.querySelector('.faces').append(b)});(o.x||[]).forEach(x=>{const b=document.createElement('button');b.className='pill'+((state[o.id].features||[]).includes(x)?' active':'');b.textContent=x;b.onclick=()=>{const a=state[o.id].features||[];state[o.id].features=a.includes(x)?a.filter(y=>y!==x):[...a,x];save();render()};c.querySelector('.feats').append(b)});S.forEach(([a,b])=>samples.insertAdjacentHTML('beforeend',`<div class="sample ${a==='BODY'?'body':''}"><div class="sl">${a}</div><div class="st" contenteditable spellcheck="false">${b}</div></div>`));c.querySelector('textarea').oninput=e=>{state[o.id].notes=e.target.value;save()};apply();app.append(c)})}render();document.getElementById('global').oninput=e=>{if(e.target.value)document.querySelectorAll('.sample:not(.body) .st').forEach(x=>x.textContent=e.target.value)};document.getElementById('size').oninput=e=>{document.documentElement.style.setProperty('--size',e.target.value+'px');document.getElementById('sizev').textContent=e.target.value};document.getElementById('copy').onclick=async()=>{const text=JSON.stringify({batch:2,picks:F.map((o,i)=>({number:i+1,name:o.n,...state[o.id]}))},null,2),status=document.getElementById('status');try{await navigator.clipboard.writeText(text);status.textContent='Copied ✓';setTimeout(()=>status.textContent='Selections still autosaved ✓',2400)}catch(err){let p=document.getElementById('payload');if(!p){p=document.createElement('pre');p.id='payload';app.append(p)}p.textContent=text;status.textContent='Clipboard blocked — payload shown below';p.scrollIntoView({behavior:'smooth'})}};</script></body></html>
