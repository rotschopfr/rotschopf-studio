<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title id="title">Ruthie Open Font Library — Batch 03</title><link rel="stylesheet" href="../app.css"></head><body><header><div class="kicker" id="kicker"></div><h1>Ten more things worth owning</h1><div class="sub" id="sub"></div><nav class="nav" id="nav"></nav></header><div class="global"><div class="globalbox"><div class="control-label">THROW THE SAME TEXT AT ALL TEN</div><input id="global" type="text" placeholder="Type anything here…"><div class="range"><span>Display size</span><input id="size" type="range" min="22" max="76" value="34"><span id="sizeVal">34</span></div></div></div><main id="app"></main><pre id="exportBox" hidden></pre><div class="footer"><div class="footer-inner"><div class="status" id="status" aria-live="polite"></div><button class="copy" id="copy" type="button">COPY PICKS</button></div></div><script>window.FONT_BATCH={batch:3,approvedBefore:17,subtitle:'Live type · art/history/research provenance · autosaved YES / NO decisions · decisions are additive, not replacements',candidates:[
{id:'mfek',name:'MFEK Sans',artist:'Owen Earl · indestructible type* · Modular Font Editor K Foundation',story:'A variable sans built from a survey of mid-to-late-1800s wooden type. Instead of reviving one specimen, it treats historical wood-type behavior as a broad design system: expressive, utility-minded, and intentionally able to roam across weights and widths.',license:'SIL Open Font License 1.1',faces:[{label:'Variable',family:'MFEKSans',url:'https://raw.githubusercontent.com/indestructible-type/MFEK-Sans/main/fonts/webfonts/MFEK-Sans%5BTRMA%2Cwght%2Cwdth%5D.woff2'}]},
{id:'baskervville',name:'Baskervville',artist:'ANRT Nancy · Rosalie Wagner + 2017–18 workshop team',story:'A revival of a revival: the ANRT team reconstructed Jacob’s 1815 “Baskerwille,” itself an interpretation of Baskerville. The historical source has a roman close to Baskerville but an italic drifting toward Didot, including an odd doubled-v “w” the revival deliberately preserves.',license:'SIL Open Font License 1.1',faces:[{label:'Regular',family:'BaskervvilleRegular',url:'https://raw.githubusercontent.com/anrt-type/ANRT-Baskervville/master/fonts/webfonts/Baskervville-Regular.woff2'},{label:'Medium',family:'BaskervvilleMedium',url:'https://raw.githubusercontent.com/anrt-type/ANRT-Baskervville/master/fonts/webfonts/Baskervville-Medium.woff2'},{label:'SemiBold',family:'BaskervvilleSemiBold',url:'https://raw.githubusercontent.com/anrt-type/ANRT-Baskervville/master/fonts/webfonts/Baskervville-SemiBold.woff2'},{label:'Bold',family:'BaskervvilleBold',url:'https://raw.githubusercontent.com/anrt-type/ANRT-Baskervville/master/fonts/webfonts/Baskervville-Bold.woff2'},{label:'Italic',family:'BaskervvilleItalic',url:'https://raw.githubusercontent.com/anrt-type/ANRT-Baskervville/master/fonts/webfonts/Baskervville-Italic.woff2'}]},
{id:'durandus',name:'Durandus 118G',artist:'ANRT · Gotico-Antiqua / Proto-Roman / Hybrid research project',story:'A digital reconstruction from the strange hinge moment after Gutenberg but before roman type settled down. This design traces Fust & Schöffer’s 1459 Durandus type — neither comfortably gothic nor comfortably roman — from a wider research program on experimental printing between 1459 and 1482.',license:'SIL Open Font License 1.1',faces:[{label:'118G',family:'Durandus118G',url:'https://raw.githubusercontent.com/anrt-type/GoticoAntiqua/master/fonts/Fust%26Schoeffer-Durandus-GoticoAntiqua118G.otf',format:'opentype'}]},
{id:'cakra',name:'Cakra',artist:'Lucia Kollert + Vojtech Kollert · OoM Type',story:'An artist-led identity typeface that became a typographic system rather than a polite family. Its design work grew around visual identity, clothing and screen-print contexts, with an unusually large ligature vocabulary that lets text behave more like constructed graphic material.',license:'SIL Open Font License 1.1',faces:[{label:'Normal',family:'Cakra',url:'https://raw.githubusercontent.com/OoM-Type/Cakra-Typeface/main/Web%20Fonts/Cakra-Normal.woff2'}]},
{id:'typefesse',name:'Typefesse',artist:'Océane Juvin · Velvetyne Type Foundry',story:'A butt-shaped alphabet built around the collision between bodies and letterforms. The characters contort, hide, expose themselves and fight their own readability; the Claire/Obscure file changes the bodily logic between lowercase and capitals, while Pleine exposes the more readable heart of the forms.',license:'SIL Open Font License 1.1',faces:[{label:'Claire / Obscure',family:'TypefesseCO',url:'https://gitlab.com/lfurter/by-womxn/-/raw/master/fonts/Typefesse_Claire-Obscure.woff2'},{label:'Pleine',family:'TypefessePleine',url:'https://gitlab.com/lfurter/by-womxn/-/raw/master/fonts/Typefesse_Pleine.woff2'}]},
{id:'junicode',name:'Junicode 2',artist:'Peter S. Baker',story:'A medievalist’s working font rebuilt as research infrastructure: huge specialist character coverage, Medieval Unicode Font Initiative compliance, and OpenType programming designed specifically to preserve accessibility and searchability instead of turning historical forms into unsearchable visual tricks.',license:'SIL Open Font License 1.1',faces:[{label:'Roman',family:'JunicodeRoman',url:'https://raw.githubusercontent.com/psb1558/Junicode-font/master/webfiles/JunicodeVFsubset.woff2'},{label:'Italic',family:'JunicodeItalic',url:'https://raw.githubusercontent.com/psb1558/Junicode-font/master/webfiles/JunicodeVF-Italic.woff2'}]},
{id:'railway',name:'Railway Sans',artist:'Justin Howes + Greg Fleming',story:'A digital afterlife of Edward Johnston’s early London Underground lettering. Justin Howes began the digitization in 1994 using scanned historical artwork and early vector tooling; the project was later recovered and revised rather than letting that first digital interpretation disappear.',license:'SIL Open Font License 1.1',faces:[{label:'Regular',family:'RailwaySans',url:'https://raw.githubusercontent.com/googlefonts/railway-sans/master/fonts/WebFonts/railway-webfont.woff',format:'woff'}]},
{id:'elstob',name:'Elstob',artist:'Peter S. Baker',story:'Named for eighteenth-century Anglo-Saxonist Elizabeth Elstob and based on the seventeenth-century Double Pica commissioned by Bishop John Fell. It is a serious historical-text tool that also behaves like a modern variable type system, including optical-size and grade logic.',license:'SIL Open Font License 1.1',faces:[{label:'Roman',family:'ElstobRoman',url:'https://raw.githubusercontent.com/psb1558/Elstob-font/master/webfiles/Elstob.woff2'},{label:'Italic',family:'ElstobItalic',url:'https://raw.githubusercontent.com/psb1558/Elstob-font/master/webfiles/Elstob-Italic.woff2'}]},
{id:'servermono',name:'Server Mono',artist:'Tim Vanhille + Matthieu Salvaggio · Internet Development Studio Company',story:'A 2024 monospace shaped by typewriters, ASCII art, command-line interfaces and programming tools. It is intentionally orderly enough for code while still feeling like a designed object rather than a default terminal font.',license:'SIL Open Font License 1.1',faces:[{label:'Regular',family:'ServerMono',url:'https://cdn.jsdelivr.net/gh/internet-development/www-server-mono@latest/public/fonts/ServerMono-Regular.woff2'},{label:'Oblique',family:'ServerMonoOblique',url:'https://cdn.jsdelivr.net/gh/internet-development/www-server-mono@latest/public/fonts/ServerMono-RegularOblique.woff2'}]},
{id:'cooperstar',name:'Cooper*',artist:'Owen Earl · indestructible type* · after Oswald Cooper',story:'A research-heavy revival of the full Cooper series, not just the ubiquitous Cooper Black. The point is almost archival correction: the lighter organic, Art-Nouveau-ish Cooper existed too, with bowed stems and plant-like curves that were largely eclipsed by the famous black weight.',license:'SIL Open Font License 1.1',faces:[{label:'Regular',family:'CooperRegular',url:'https://raw.githubusercontent.com/indestructible-type/Cooper/main/fonts/webfonts/Cooper-Regular.woff2'},{label:'Medium',family:'CooperMedium',url:'https://raw.githubusercontent.com/indestructible-type/Cooper/main/fonts/webfonts/Cooper-Medium.woff2'},{label:'Bold',family:'CooperBold',url:'https://raw.githubusercontent.com/indestructible-type/Cooper/main/fonts/webfonts/Cooper-Bold.woff2'},{label:'Black',family:'CooperBlack',url:'https://raw.githubusercontent.com/indestructible-type/Cooper/main/fonts/webfonts/Cooper-Black.woff2'}]}
]};</script><script src="../app.js"></script></body></html>
