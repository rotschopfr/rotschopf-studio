<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title id="title">Ruthie Open Font Library — Batch 04</title><link rel="stylesheet" href="../app.css"></head><body><header><div class="kicker" id="kicker"></div><h1>Ten new lanes</h1><div class="sub" id="sub"></div><nav class="nav" id="nav"></nav></header><div class="global"><div class="globalbox"><div class="control-label">THROW THE SAME TEXT AT ALL TEN</div><input id="global" type="text" placeholder="Type anything here…"><div class="range"><span>Display size</span><input id="size" type="range" min="22" max="76" value="34"><span id="sizeVal">34</span></div></div></div><main id="app"></main><pre id="exportBox" hidden></pre><div class="footer"><div class="footer-inner"><div class="status" id="status" aria-live="polite"></div><button class="copy" id="copy" type="button">COPY PICKS</button></div></div><script>window.FONT_BATCH={batch:4,approvedBefore:25,subtitle:'New lanes, not a weirdness contest · live type · provenance-first · autosaved YES / NO decisions · additive library',candidates:[
{id:'cooperhewitt',name:'Cooper Hewitt',artist:'Chester Jenkins · Cooper Hewitt, Smithsonian Design Museum · Pentagram commission',story:'Museum identity as public design infrastructure. Chester Jenkins drew the family for the transformed Cooper Hewitt rather than merely selecting an institutional house font, and the museum released it for public use. This is the lane where a serious identity system becomes part of the collection it serves.',license:'SIL Open Font License 1.1',faces:[{label:'Book',family:'CooperHewittBook',url:'https://cdn.jsdelivr.net/fontsource/fonts/cooper-hewitt@5.2.5/latin-400-normal.woff2'},{label:'Light',family:'CooperHewittLight',url:'https://cdn.jsdelivr.net/fontsource/fonts/cooper-hewitt@5.2.5/latin-300-normal.woff2'},{label:'Semibold',family:'CooperHewittSemibold',url:'https://cdn.jsdelivr.net/fontsource/fonts/cooper-hewitt@5.2.5/latin-600-normal.woff2'},{label:'Heavy',family:'CooperHewittHeavy',url:'https://cdn.jsdelivr.net/fontsource/fonts/cooper-hewitt@5.2.5/latin-800-normal.woff2'}]},
{id:'publicsans',name:'Public Sans',artist:'U.S. Web Design System · General Services Administration',story:'Civic typography rather than branding theatre: an open family developed for government interfaces and public information. I want this lane in the library because the constraints are unusually concrete — neutral voice, long-form reading, labels, forms, dense UI, and information that has to work for everybody.',license:'SIL Open Font License 1.1',faces:[{label:'Regular',family:'PublicSansRegular',url:'https://raw.githubusercontent.com/uswds/public-sans/develop/fonts/webfonts/PublicSans-Regular.woff2'},{label:'Thin',family:'PublicSansThin',url:'https://raw.githubusercontent.com/uswds/public-sans/develop/fonts/webfonts/PublicSans-Thin.woff2'},{label:'Bold',family:'PublicSansBold',url:'https://raw.githubusercontent.com/uswds/public-sans/develop/fonts/webfonts/PublicSans-Bold.woff2'},{label:'Black',family:'PublicSansBlack',url:'https://raw.githubusercontent.com/uswds/public-sans/develop/fonts/webfonts/PublicSans-Black.woff2'}]},
{id:'redaction',name:'Redaction',artist:'Titus Kaphar + Reginald Dwayne Betts · type by Jeremy Mickel · The Redaction',story:'Typeface as legal and political material. Created around an art project confronting redacted legal records, the family includes progressively degraded states: the same textual skeleton can move from readable typography toward obstruction. It is useful precisely because the visual damage is part of the argument.',license:'SIL Open Font License 1.1',faces:[{label:'Clear',family:'RedactionClear',url:'https://cdn.jsdelivr.net/fontsource/fonts/redaction@5.2.5/latin-400-normal.woff2'},{label:'50% degraded',family:'Redaction50',url:'https://cdn.jsdelivr.net/fontsource/fonts/redaction-50@5.2.5/latin-400-normal.woff2'},{label:'100% degraded',family:'Redaction100',url:'https://cdn.jsdelivr.net/fontsource/fonts/redaction-100@5.2.5/latin-400-normal.woff2'}]},
{id:'stix',name:'STIX Two',artist:'Scientific and Technical Information Exchange · Tiro Typeworks',story:'Scientific publishing as a type-design problem. STIX exists because equations, symbols, technical prose and specialist notation need a coherent typographic system instead of a pile of substitutions. This is the library lane for serious research documents that still deserve designed text.',license:'SIL Open Font License 1.1',faces:[{label:'Text Regular',family:'STIXTwoText',url:'https://cdn.jsdelivr.net/fontsource/fonts/stix-two-text@latest/latin-400-normal.woff2'},{label:'Text Bold',family:'STIXTwoTextBold',url:'https://cdn.jsdelivr.net/fontsource/fonts/stix-two-text@latest/latin-700-normal.woff2'},{label:'Math',family:'STIXTwoMath',url:'https://cdn.jsdelivr.net/fontsource/fonts/stix-two-math@latest/latin-400-normal.woff2'}]},
{id:'monaspace',name:'Monaspace',artist:'GitHub Next + Lettermatic',story:'A coding family treated as a coordinated ensemble instead of one monospace voice. Five metrics-compatible designs can swap without wrecking layout, while features such as code ligatures and texture healing treat the programming environment itself as typographic space.',license:'SIL Open Font License 1.1',faces:[{label:'Neon',family:'MonaspaceNeon',url:'https://raw.githubusercontent.com/githubnext/monaspace/main/fonts/Web%20Fonts/Variable%20Web%20Fonts/Monaspace%20Neon/Monaspace%20Neon%20Var.woff2'},{label:'Argon',family:'MonaspaceArgon',url:'https://raw.githubusercontent.com/githubnext/monaspace/main/fonts/Web%20Fonts/Variable%20Web%20Fonts/Monaspace%20Argon/Monaspace%20Argon%20Var.woff2'},{label:'Krypton',family:'MonaspaceKrypton',url:'https://raw.githubusercontent.com/githubnext/monaspace/main/fonts/Web%20Fonts/Variable%20Web%20Fonts/Monaspace%20Krypton/Monaspace%20Krypton%20Var.woff2'},{label:'Radon',family:'MonaspaceRadon',url:'https://raw.githubusercontent.com/githubnext/monaspace/main/fonts/Web%20Fonts/Variable%20Web%20Fonts/Monaspace%20Radon/Monaspace%20Radon%20Var.woff2'},{label:'Xenon',family:'MonaspaceXenon',url:'https://raw.githubusercontent.com/githubnext/monaspace/main/fonts/Web%20Fonts/Variable%20Web%20Fonts/Monaspace%20Xenon/Monaspace%20Xenon%20Var.woff2'}],features:['liga','calt']},
{id:'tt2020',name:'TT2020',artist:'Fredrick R. Brennan',story:'Document realism as a font system. TT2020 is interested in the physical behavior of typewriters: repeated letters do not have to look mechanically cloned, and different style builds evoke different machines and wear. This is less “retro font” than a tool for making digital text behave like an imperfect process.',license:'SIL Open Font License 1.1',faces:[{label:'Base',family:'TT2020Base',url:'https://raw.githubusercontent.com/ctrlcctrlv/TT2020/master/dist/TT2020Base-Regular.woff2'},{label:'Style B',family:'TT2020B',url:'https://raw.githubusercontent.com/ctrlcctrlv/TT2020/master/dist/TT2020StyleB-Regular.woff2'},{label:'Style D',family:'TT2020D',url:'https://raw.githubusercontent.com/ctrlcctrlv/TT2020/master/dist/TT2020StyleD-Regular.woff2'}]},
{id:'fanwoodtext',name:'Fanwood Text',artist:'Barry Schwartz · League of Moveable Type · after Rudolph Ruzicka',story:'The quiet book-text lane. Fanwood grows from Rudolph Ruzicka’s Fairfield forms, while the Text cut is deliberately darker and less contrasty for sustained reading. It is exactly the kind of competent historical body face that earns a place without needing to perform weirdness.',license:'SIL Open Font License 1.1',faces:[{label:'Text',family:'FanwoodText',url:'https://raw.githubusercontent.com/theleagueof/fanwood/master/Fanwood%20Text.otf',format:'opentype'},{label:'Text Italic',family:'FanwoodTextItalic',url:'https://raw.githubusercontent.com/theleagueof/fanwood/master/Fanwood%20Text%20Italic.otf',format:'opentype'}]},
{id:'atkinsonnext',name:'Atkinson Hyperlegible Next',artist:'Braille Institute · after J. Robert Atkinson',story:'Accessibility as form-making rather than a compliance afterthought. The family exaggerates differences between easily confused characters for low-vision readers, and the expanded Next release turns that idea into a broader variable system. A font can be beautiful because it solves recognition problems well.',license:'SIL Open Font License 1.1',faces:[{label:'Variable',family:'AtkinsonNext',url:'https://cdn.jsdelivr.net/fontsource/fonts/atkinson-hyperlegible-next:vf@5.3.0/latin-wght-normal.woff2'},{label:'Variable Italic',family:'AtkinsonNextItalic',url:'https://cdn.jsdelivr.net/fontsource/fonts/atkinson-hyperlegible-next:vf@5.3.0/latin-wght-italic.woff2'}]},
{id:'b612',name:'B612',artist:'Airbus + ENAC + Université Toulouse III · Intactile DESIGN',story:'A cockpit typeface born from human-factors research. B612 was designed and tested for aircraft display readability, then opened for wider use; even the name points back to Saint-Exupéry’s asteroid. This is the lane where typography is part of an instrument panel rather than a page.',license:'SIL Open Font License 1.1',faces:[{label:'Regular',family:'B612Regular',url:'https://raw.githubusercontent.com/polarsys/b612/master/fonts/ttf/B612-Regular.ttf',format:'truetype'},{label:'Bold',family:'B612Bold',url:'https://raw.githubusercontent.com/polarsys/b612/master/fonts/ttf/B612-Bold.ttf',format:'truetype'},{label:'Mono',family:'B612Mono',url:'https://raw.githubusercontent.com/polarsys/b612/master/fonts/ttf/B612Mono-Regular.ttf',format:'truetype'}]},
{id:'chomsky',name:'Chomsky',artist:'Fredrick R. Brennan',story:'Editorial identity expanded into an alphabet. Brennan started from the visual language of the New York Times masthead but drew the missing characters into a usable blackletter font rather than making a one-word logo imitation. It gives us a newspaper/masthead lane with an unusually explicit reconstruction story.',license:'SIL Open Font License 1.1',faces:[{label:'Regular',family:'Chomsky',url:'https://raw.githubusercontent.com/ctrlcctrlv/chomsky/master/dist/Chomsky.woff2'}]}
]};</script><script src="../app.js"></script></body></html>
