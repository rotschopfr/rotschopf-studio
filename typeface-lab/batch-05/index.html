{id:'bravura',name:'Bravura',artist:'Steinberg · reference font for SMuFL',story:'Music notation as an actual writing system. Bravura was built for Dorico and became the reference font for Standard Music Font Layout, which standardizes thousands of musical symbols so notation software can exchange them sanely. This lane is not “display type”; it is specialist symbolic infrastructure.',license:'SIL Open Font License 1.1',faces:[{label:'Notation',family:'Bravura',url:'https://raw.githubusercontent.com/steinbergmedia/bravura/master/redist/woff/Bravura.woff2'}],samples:[['CLEFS','\uE050  \uE05C  \uE062'],['NOTES','\uE0A2  \uE0A3  \uE0A4  \uE1D2  \uE1D3  \uE1D5'],['ACCIDENTALS','\uE260  \uE261  \uE262'],['RESTS','\uE4E3  \uE4E4  \uE4E5'],['DYNAMICS','\uE520  \uE521  \uE522  \uE524']]},
{id:'weathericons',name:'Weather Icons',artist:'Lukas Bischoff + Erik Flowers',story:'A meteorological pictogram font rather than an alphabet: sun, cloud, fog, rain, lightning, wind, lunar phases and weather-service mappings. It belongs in the lane where a font is a compact environmental vocabulary and data-interface component.',license:'SIL Open Font License 1.1',faces:[{label:'222-icon set',family:'WeatherIcons',url:'https://raw.githubusercontent.com/erikflowers/weather-icons/master/font/weathericons-regular-webfont.woff2'}],samples:[['DAY','\uf00d  \uf002  \uf003  \uf005  \uf008'],['NIGHT','\uf02e  \uf086  \uf083  \uf070  \uf071'],['ATMOSPHERE','\uf014  \uf021  \uf050  \uf056  \uf076'],['CELESTIAL / WEATHER','\uf0c9  \uf0ca  \uf0cb  \uf0cc  \uf0cd']]},
{id:'flow',name:'Flow Circular',artist:'Dan Ross · HYPD / Flow project',story:'Typography designed to make language disappear while preserving its shape. Flow replaces readable content with abstract text-mass for wireframes, prototypes and presentations, including deliberate subpixel artifacts and imperfections. A font whose job is to hide copy is a genuinely different tool.',license:'SIL Open Font License 1.1',faces:[{label:'Circular',family:'FlowCircular',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/flowcircular/FlowCircular-Regular.ttf',format:'truetype'}],samples:[['WIREFRAME','Spatial Press — The sky. The vantage. The view.'],['FORM','Birth place · date · exact local time · email address'],['CARD','Your reconstructed sky is ready to inspect.'],['BODY','This should look like content architecture without exposing the actual words.']]},
{id:'wavefont',name:'Wavefont',artist:'Dmitry Ivanov',story:'A font that turns characters into numeric bars for waveforms, spectra, diagrams and data strips. Digits, letters and extended characters encode heights from coarse steps to 0–127 values. This is typography functioning as a tiny plotting engine.',license:'SIL Open Font License 1.1',faces:[{label:'Rounded',family:'Wavefont',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/wavefont/Wavefont%5BROND%2CYELA%2Cwght%5D.ttf',format:'truetype',variation:"'ROND' 100, 'YELA' -100, 'wght' 400"},{label:'Square',family:'Wavefont',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/wavefont/Wavefont%5BROND%2CYELA%2Cwght%5D.ttf',format:'truetype',variation:"'ROND' 0, 'YELA' -100, 'wght' 400"},{label:'Heavy',family:'Wavefont',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/wavefont/Wavefont%5BROND%2CYELA%2Cwght%5D.ttf',format:'truetype',variation:"'ROND' 100, 'YELA' -100, 'wght' 900"}],samples:[['0–9','01234567899876543210'],['PULSE','111198765432111987654432111'],['2-STEP RANGE','abcdefghijklmnopqrstuvwxyzZYXWVUTSRQPONMLKJIHGFEDCBA'],['DATA STRIP','01234999987654321000123456789876543210']]},
{id:'barcode',name:'Libre Barcode 39 Extended Text',artist:'Lasse Fister · Libre Barcode project',story:'Machine-readable typography. This family exists to typeset actual Code 39 barcodes while retaining human-readable text beneath the bars. It moves the library into logistics, packaging, inventory, provenance labels and other places where letters are also data carriers.',license:'SIL Open Font License 1.1',faces:[{label:'Code 39 + text',family:'LibreBarcode39',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/librebarcode39extendedtext/LibreBarcode39ExtendedText-Regular.ttf',format:'truetype'}],samples:[['OBJECT','*SPATIAL-PRESS*'],['PASSPORT','*ARTIFACT-01992*'],['COORDINATE ID','*341722-1033470*'],['ORDER','*SP-2026-000417*']]},
{id:'egyptian',name:'Noto Sans Egyptian Hieroglyphs',artist:'Google Noto · Unicode Egyptian Hieroglyphs',story:'Not a Latin novelty face: a font for an encoded ancient writing system. It gives the library a lane for historical scripts where the glyph repertoire itself is the archive and the Unicode mapping is part of the preservation problem.',license:'SIL Open Font License 1.1',faces:[{label:'Hieroglyphs',family:'NotoEgyptian',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/notosansegyptianhieroglyphs/NotoSansEgyptianHieroglyphs-Regular.ttf',format:'truetype'}],samples:[['FIGURES','𓀀  𓁹  𓂀  𓃠  𓅓'],['SIGNS','𓆣  𓇳  𓉐  𓊖  𓋹'],['LINE','𓂀 𓇳 𓋹 𓆣 𓉐 𓅓 𓃠'],['DENSE','𓀀𓁹𓂀𓃠𓅓𓆣𓇳𓉐𓊖𓋹']]},
{id:'signwriting',name:'Noto Sans SignWriting',artist:'Google Noto · Sutton SignWriting Unicode support',story:'A two-dimensional notation system for signed languages, encoded as characters instead of treating signed communication as something that must be transliterated into spoken-language alphabets. This is a fundamentally different relationship between gesture, space and typography.',license:'SIL Open Font License 1.1',faces:[{label:'SignWriting',family:'NotoSignWriting',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssignwriting/NotoSansSignWriting-Regular.ttf',format:'truetype'}],samples:[['HANDSHAPES','\u{1D800}  \u{1D801}  \u{1D802}  \u{1D803}  \u{1D804}'],['MOVEMENT','\u{1D900}  \u{1D901}  \u{1D902}  \u{1D903}  \u{1D904}'],['HEAD / BODY','\u{1DA00}  \u{1DA01}  \u{1DA02}  \u{1DA03}  \u{1DA04}'],['FIELD','\u{1D810} \u{1D824} \u{1D8C0} \u{1D948} \u{1DA10}']]},
{id:'nastaliq',name:'Noto Nastaliq Urdu',artist:'Google Noto · Nastaliq Urdu type system',story:'A right-to-left calligraphic text system whose baseline, joins and cascading word shapes behave nothing like Latin typography. This lane forces the library to think about shaping engines, directionality and composition rather than assuming every font is rows of left-to-right boxes.',license:'SIL Open Font License 1.1',direction:'rtl',faces:[{label:'Variable',family:'NotoNastaliqUrdu',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/notonastaliqurdu/NotoNastaliqUrdu%5Bwght%5D.ttf',format:'truetype'}],samples:[['SKY','آسمان · مقام · منظر'],['LINE','رات کے آسمان میں ستارے روشن ہیں'],['PLACE','وینس، لاس اینجلس'],['NUMBERS','۲۰۲۶ · ۱۹۹۲ · ۰۵:۵۷']]},
{id:'vt323',name:'VT323',artist:'Peter Hull · reconstructed from DEC VT320 terminal glyphs',story:'CRT archaeology. VT323 began from the DEC VT320 terminal character set, then deliberately models the way a real electron beam smeared non-square pixels across phosphor rather than merely drawing tidy square “retro pixels.” It is a screen-technology reconstruction, not generic coding mono.',license:'SIL Open Font License 1.1',faces:[{label:'CRT',family:'VT323',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/vt323/VT323-Regular.ttf',format:'truetype'}],samples:[['TERMINAL','SPATIAL_PRESS> reconstruct --place 34.1722,-103.3470'],['STATUS','[ OK ] ephemeris   [ OK ] provenance   [ WAIT ] render'],['DATA','1992-01-19 17:57:00 MST  |  N34°10′20″ W103°20′49″'],['ASCII','+--------------------+  *  .  *  .  *  +--------------------+']]},
{id:'comicneue',name:'Comic Neue',artist:'Craig Rozynski',story:'A deliberate repair job on one of the most culturally loaded everyday fonts. Comic Neue keeps the candid casualness of Comic Sans while redrawing its famously squashed and wonky forms into a more controlled family. The lane here is informal human voice without pretending handwriting must be precious.',license:'SIL Open Font License 1.1',faces:[{label:'Regular',family:'ComicNeue',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/comicneue/ComicNeue-Regular.ttf',format:'truetype'},{label:'Light',family:'ComicNeueLight',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/comicneue/ComicNeue-Light.ttf',format:'truetype'},{label:'Bold',family:'ComicNeueBold',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/comicneue/ComicNeue-Bold.ttf',format:'truetype'}],samples:[['NOTE','I saw something weird in the sky and wrote it down.'],['LABEL','made here · looked at twice · kept on purpose'],['NAME','Ruthful Josef Rotschopf'],['BODY','Casual typography can be useful without being childish, corporate, or faux-calligraphic.']]}
