{id:'portsmouth',name:'Portsmouth Press',artist:'Gleb Redko',story:'A digital face that begins with physical wood type, oil paint and a press. Redko manually printed vintage wooden blocks and digitized the impressions instead of simulating distress afterward. The irregularity is evidence of an actual making process.',license:'SIL Open Font License 1.1',faces:[{label:'Letterpress',family:'PortsmouthPress',url:'https://raw.githubusercontent.com/GlenRed/portsmouth-press/main/fonts/ttf/PortsmouthPress-Regular.ttf',format:'truetype'}],samples:[['PRESS','SPATIAL PRESS'],['POSTER','THE SKY / THE VANTAGE / THE VIEW'],['PLACE','PORTALES · NEW MEXICO'],['DATE','19 JANUARY 1992 · 5:57 PM']]},
{id:'phudu',name:'Phudu',artist:'Dương Trần · Behalf Studio',story:'A Vietnamese display family rooted in the hand-painted lettering of old public billboards and signage. It turns a living vernacular lettering tradition into a variable digital family without sanding away the personality that made the source material interesting.',license:'SIL Open Font License 1.1',faces:[{label:'Light',family:'Phudu',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/phudu/Phudu%5Bwght%5D.ttf',format:'truetype',variation:"'wght' 300"},{label:'Regular',family:'Phudu',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/phudu/Phudu%5Bwght%5D.ttf',format:'truetype',variation:"'wght' 500"},{label:'Heavy',family:'Phudu',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/phudu/Phudu%5Bwght%5D.ttf',format:'truetype',variation:"'wght' 800"}]},
{id:'staatliches',name:'Staatliches',artist:'Brian LaRossa + Erica Carras · after Herbert Bayer',story:'A revival lane with a very specific artifact behind it: Herbert Bayer’s title lettering for the catalogue of the first Bauhaus exhibition in 1923. Tall, compressed and declarative rather than another generic geometric sans.',license:'SIL Open Font License 1.1',faces:[{label:'Regular',family:'Staatliches',url:'https://raw.githubusercontent.com/googlefonts/staatliches/main/fonts/Staatliches-Regular.ttf',format:'truetype'}],samples:[['EXHIBITION','SPATIAL PRESS'],['TITLE','A RECONSTRUCTED ATLAS OF ONE MOMENT'],['CARDINAL','NORTH  EAST  SOUTH  WEST'],['NUMBER','1992  2026  34.1722  103.3470']]},
{id:'badscript',name:'Bad Script',artist:'Roman Shchyukin',story:'Personal handwriting made systematic. Shchyukin built the face from his own tablet handwriting, then regularized just enough to make it useful while preserving the small inconsistencies and movement of an actual person writing.',license:'SIL Open Font License 1.1',faces:[{label:'Handwriting',family:'BadScript',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/badscript/BadScript-Regular.ttf',format:'truetype'}],samples:[['NOTE','I saw something strange in the sky and wrote it down.'],['NAME','Ruthful Josef Rotschopf'],['MARGIN','check the source again → the timing matters'],['POSTCARD','Portales, New Mexico · January 19, 1992']]},
{id:'hinamincho',name:'Hina Mincho',artist:'satsuyako',story:'A Japanese old-style Mincho with unusually expressive stroke beginnings and soft ink pooling. It is here because the drawing itself is lovely — not because a different script automatically earns a slot. The Latin and Japanese forms share the same slightly antique, handwritten tension.',license:'SIL Open Font License 1.1',faces:[{label:'Regular',family:'HinaMincho',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/hinamincho/HinaMincho-Regular.ttf',format:'truetype'}],samples:[['JAPANESE','星空 · 観測 · 時間 · 場所'],['LINE','夜空を見上げて、そこにあったものを記録する。'],['LATIN','Spatial Press · Portales · 1992'],['MIXED','19 January 1992 — 星空の記録']]},
{id:'vollkorn',name:'Vollkorn',artist:'Friedrich Althausen',story:'A deliberately sturdy independent serif whose name means “wholemeal” — conceived as a bread-and-butter face for everyday text, not a precious display object. This is the lane for a baseline that still feels authored and warm.',license:'SIL Open Font License 1.1',faces:[{label:'Book',family:'Vollkorn',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/vollkorn/Vollkorn%5Bwght%5D.ttf',format:'truetype',variation:"'wght' 400"},{label:'Semibold',family:'Vollkorn',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/vollkorn/Vollkorn%5Bwght%5D.ttf',format:'truetype',variation:"'wght' 600"},{label:'Bold',family:'Vollkorn',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/vollkorn/Vollkorn%5Bwght%5D.ttf',format:'truetype',variation:"'wght' 800"}]},
{id:'dinish',name:'DINish',artist:'PlayBeing · based on DIN 1451 lineage',story:'Road-sign and technical-lettering history, but redrawn for actual readers rather than slavishly tracing a standard sheet. It keeps the industrial clarity of DIN while admitting that human perception matters more than a ruler grid.',license:'SIL Open Font License 1.1',faces:[{label:'Condensed',family:'DINishVF',url:'https://raw.githubusercontent.com/playbeing/dinish/main/fonts/woff2/variable/DINish%5Bslnt%2Cwdth%2Cwght%5D.woff2',format:'woff2',variation:"'wdth' 75, 'wght' 400, 'slnt' 0"},{label:'Standard',family:'DINishVF',url:'https://raw.githubusercontent.com/playbeing/dinish/main/fonts/woff2/variable/DINish%5Bslnt%2Cwdth%2Cwght%5D.woff2',format:'woff2',variation:"'wdth' 100, 'wght' 400, 'slnt' 0"},{label:'Expanded',family:'DINishVF',url:'https://raw.githubusercontent.com/playbeing/dinish/main/fonts/woff2/variable/DINish%5Bslnt%2Cwdth%2Cwght%5D.woff2',format:'woff2',variation:"'wdth' 125, 'wght' 400, 'slnt' 0"}],features:['tnum','onum','ss01'],samples:[['SIGN','PORTALES  12 km'],['COORDINATES','34.1722° N  ·  103.3470° W'],['INSTRUMENT','AZ 241.6°   ALT +17.4°   17:57:00'],['BODY','Clear enough for a road sign, a spreadsheet, a caption, or a piece of technical labeling.']]},
{id:'fraunces',name:'Fraunces',artist:'Phaedra Charles + Flavia Zimbardi · Undercase Type',story:'A variable old-style family that treats softness and wonkiness as real design axes, not gimmick presets. Its family tree nods toward Windsor, Souvenir and Cooper while letting you continuously move between restrained text and deliciously swollen display forms.',license:'SIL Open Font License 1.1',faces:[{label:'Sharp / sane',family:'FrauncesVF',url:'https://raw.githubusercontent.com/undercasetype/Fraunces/master/fonts/webfonts/variable/Fraunces%5BSOFT%2CWONK%2Copsz%2Cwght%5D.woff2',format:'woff2',variation:"'SOFT' 0, 'WONK' 0, 'opsz' 72, 'wght' 500"},{label:'Soft',family:'FrauncesVF',url:'https://raw.githubusercontent.com/undercasetype/Fraunces/master/fonts/webfonts/variable/Fraunces%5BSOFT%2CWONK%2Copsz%2Cwght%5D.woff2',format:'woff2',variation:"'SOFT' 100, 'WONK' 0, 'opsz' 100, 'wght' 600"},{label:'Soft + wonky',family:'FrauncesVF',url:'https://raw.githubusercontent.com/undercasetype/Fraunces/master/fonts/webfonts/variable/Fraunces%5BSOFT%2CWONK%2Copsz%2Cwght%5D.woff2',format:'woff2',variation:"'SOFT' 100, 'WONK' 1, 'opsz' 144, 'wght' 700"}]},
{id:'recursive',name:'Recursive',artist:'Stephen Nixon · Arrow Type',story:'One variable family that can slide between proportional sans and mono, between linear and casual construction, and into slant/cursive behavior. The interesting part is not “another coding font”; it is that several normally separate typographic categories occupy one continuous design space.',license:'SIL Open Font License 1.1',faces:[{label:'Linear Sans',family:'RecursiveVF',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/recursive/Recursive%5BCASL%2CCRSV%2CMONO%2Cslnt%2Cwght%5D.ttf',format:'truetype',variation:"'MONO' 0, 'CASL' 0, 'wght' 400, 'slnt' 0, 'CRSV' 0.5"},{label:'Casual Sans',family:'RecursiveVF',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/recursive/Recursive%5BCASL%2CCRSV%2CMONO%2Cslnt%2Cwght%5D.ttf',format:'truetype',variation:"'MONO' 0, 'CASL' 1, 'wght' 500, 'slnt' 0, 'CRSV' 0.5"},{label:'Linear Mono',family:'RecursiveVF',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/recursive/Recursive%5BCASL%2CCRSV%2CMONO%2Cslnt%2Cwght%5D.ttf',format:'truetype',variation:"'MONO' 1, 'CASL' 0, 'wght' 400, 'slnt' 0, 'CRSV' 0.5"},{label:'Casual Mono',family:'RecursiveVF',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/recursive/Recursive%5BCASL%2CCRSV%2CMONO%2Cslnt%2Cwght%5D.ttf',format:'truetype',variation:"'MONO' 1, 'CASL' 1, 'wght' 600, 'slnt' -8, 'CRSV' 1"}]},
{id:'lemurmure',name:'Le Murmure',artist:'Jérémy Landes · for Agence Murmure / Velvetyne',story:'A custom identity face that escaped its original commission and became a libre public font. It is aggressively condensed, editorial and full of alternate letterforms — exactly the small-studio-design-world lane where a bespoke visual voice becomes reusable cultural material.',license:'SIL Open Font License 1.1',faces:[{label:'Regular',family:'LeMurmure',url:'https://humantooth.neocities.org/fonts/LeMurmure-Regular.woff',format:'woff'}],features:['salt','dlig'],samples:[['IDENTITY','SPATIAL PRESS'],['EDITORIAL','WHAT EXACTLY WAS THIS UNIVERSE?'],['TALL','RUTHFUL JOSEF ROTSCHOPF'],['NUMBERS','1992 · 2026 · 05:57 · 34.1722°']]}
