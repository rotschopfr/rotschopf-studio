{id:'daubenton',name:'Daubenton',artist:'Olivier Dolbeau · Velvetyne',story:'A museum façade turned back into movable type. Dolbeau revived the engraved lettering on the Great Evolution Gallery of Paris’s Natural History Museum; the name honors Daubenton, the museum’s first director. It has the gravity of institutional stone lettering without feeling like generic “heritage” typography.',license:'SIL Open Font License 1.1',faces:[{label:'Regular',family:'Daubenton',url:'https://raw.githubusercontent.com/velvetyne/Daubenton/master/fonts/Daubenton.otf',format:'opentype'}],samples:[['MUSEUM','MUSÉUM NATIONAL D’HISTOIRE NATURELLE'],['TITLE','A RECONSTRUCTED ATLAS OF ONE MOMENT'],['PLACE','PORTALES · NEW MEXICO'],['NAME','RUTHFUL JOSEF ROTSCHOPF']]},
{id:'resistance',name:'Résistance Générale',artist:'ENSAD Paris students · La Générale · Velvetyne',story:'A genuinely collective workshop font: students at ENSAD Paris built it at La Générale with Glyphr Studio and Velvetyne. The source remains editable in the same browser-based tool. I like it here because the authorship story is a group making a typeface together, not a studio manufacturing a product line.',license:'SIL Open Font License',faces:[{label:'Regular',family:'ResistanceGenerale',url:'https://raw.githubusercontent.com/velvetyne/resistance-generale/master/fonts/Resistance%20g%C3%A9n%C3%A9rale.otf',format:'opentype'}],samples:[['POSTER','RÉSISTANCE GÉNÉRALE'],['WALL','THE SKY BELONGS TO EVERYONE'],['PLACE','PARIS · PORTALES · VENICE'],['NUMBERS','19 · 01 · 1992 · 17:57']]},
{id:'saintjean',name:'Saint Jean',artist:'Velvetyne workshop project',story:'A font assembled from ampersands contributed during an ampersand workshop. That is ridiculous in exactly the useful way: one punctuation mark becomes a collaborative source archive, then grows into a typeface. Judge the alphabet too, but absolutely abuse the ampersand in this card.',license:'SIL Open Font License 1.1',faces:[{label:'Regular',family:'SaintJean',url:'https://raw.githubusercontent.com/velvetyne/saintjean/master/fonts/saintjean_Desktop_OTF/Saintjean-Regular.otf',format:'opentype'}],samples:[['AMPERSANDS','& & & & & & & &'],['PAIRINGS','sky & place · art & evidence · then & now'],['TITLE','SPATIAL PRESS & THE LOCAL SKY'],['NAME','RUTHFUL & JOSEF & ROTSCHOPF']]},
{id:'commune',name:'Commune Nuit Debout',artist:'Sébastien Marchal · Velvetyne',story:'Its deeper family began with nineteenth-century wood-poster construction and a 240-font postgraduate experiment. In 2016 Marchal chose its narrowest, most upright member for the emerging Nuit Debout occupation of Place de la République, then released that working protest type freely when other groups needed to reproduce the identity.',license:'SIL Open Font License 1.1',faces:[{label:'Regular',family:'CommuneND',url:'https://raw.githubusercontent.com/velvetyne/Commune-Nuit-Debout/master/fonts/Commune%20NuitDebout.otf',format:'opentype'},{label:'Pochoir',family:'CommuneNDPochoir',url:'https://raw.githubusercontent.com/velvetyne/Commune-Nuit-Debout/master/fonts/Commune%20NuitDebout-Pochoir.otf',format:'opentype'}],samples:[['POSTER','NUIT DEBOUT'],['PUBLIC NOTICE','ASSEMBLY · TONIGHT · PLACE DE LA RÉPUBLIQUE'],['WALL','WHAT WE KNOW SHOULD BE PUBLIC'],['SPATIAL','THE SKY · THE VANTAGE · THE VIEW']]},
{id:'apfel',name:'Apfel Grotezk',artist:'Luigi Gorlero · Collletttivo',story:'A round, airy independent-foundry sans with a useful twist: the family includes Brukt, a deliberately interrupted sibling that turns a clean grotesk into a materially different texture. This is my “normal can still be worth owning” candidate for the round — coherent, friendly and supplied as a real family rather than a single novelty cut.',license:'SIL Open Font License 1.1',faces:[{label:'Regular',family:'ApfelRegular',url:'https://raw.githubusercontent.com/collletttivo/apfel-grotezk/main/fonts/ApfelGrotezk-Regular.woff2',format:'woff2'},{label:'Brukt',family:'ApfelBrukt',url:'https://raw.githubusercontent.com/collletttivo/apfel-grotezk/main/fonts/ApfelGrotezk-Brukt.woff2',format:'woff2'},{label:'Mittel',family:'ApfelMittel',url:'https://raw.githubusercontent.com/collletttivo/apfel-grotezk/main/fonts/ApfelGrotezk-Mittel.woff2',format:'woff2'},{label:'Fett',family:'ApfelFett',url:'https://raw.githubusercontent.com/collletttivo/apfel-grotezk/main/fonts/ApfelGrotezk-Fett.woff2',format:'woff2'}]},
{id:'youngserif',name:'Young Serif',artist:'Bastien Sozeau · NoirBlancRouge',story:'An independent old-style serif that has been allowed to mature in public since 2013 instead of being abandoned after a one-off release. Its rounded b and f give it a tender, generous texture; recent work added genuine italics, small caps and variable weight. This is the “lovely book/display serif with an actual life history” lane.',license:'SIL Open Font License 1.1',faces:[{label:'Light',family:'YoungSerif',url:'https://raw.githubusercontent.com/noirblancrouge/YoungSerif/master/fonts/variable/Young-Serif%5Bwght%5D.ttf',format:'truetype',variation:"'wght' 300"},{label:'Regular',family:'YoungSerif',url:'https://raw.githubusercontent.com/noirblancrouge/YoungSerif/master/fonts/variable/Young-Serif%5Bwght%5D.ttf',format:'truetype',variation:"'wght' 500"},{label:'Bold',family:'YoungSerif',url:'https://raw.githubusercontent.com/noirblancrouge/YoungSerif/master/fonts/variable/Young-Serif%5Bwght%5D.ttf',format:'truetype',variation:"'wght' 800"},{label:'Italic',family:'YoungSerifItalic',url:'https://raw.githubusercontent.com/noirblancrouge/YoungSerif/master/fonts/variable/Young-Serif-Italic%5Bwght%5D.ttf',format:'truetype',variation:"'wght' 500"}]},
{id:'routed',name:'Routed Gothic',artist:'Darren Embry',story:'A clean digital implementation of the common monoline lettering found on technical drawings, engraved office signs, computer and typewriter keyboards, some comics and mid-century avionics. Not fake retro-futurism: this is the quiet lettering language of panels, diagrams and machines.',license:'SIL Open Font License 1.1',faces:[{label:'Regular',family:'RoutedGothic',url:'https://raw.githubusercontent.com/dse/routed-gothic/master/dist/ttf/routed-gothic.ttf',format:'truetype'},{label:'Narrow',family:'RoutedGothicNarrow',url:'https://raw.githubusercontent.com/dse/routed-gothic/master/dist/ttf/routed-gothic-narrow.ttf',format:'truetype'},{label:'Wide',family:'RoutedGothicWide',url:'https://raw.githubusercontent.com/dse/routed-gothic/master/dist/ttf/routed-gothic-wide.ttf',format:'truetype'},{label:'Italic',family:'RoutedGothicItalic',url:'https://raw.githubusercontent.com/dse/routed-gothic/master/dist/ttf/routed-gothic-italic.ttf',format:'truetype'}],samples:[['PANEL','PANEL A7 · BUS TIE · 28V DC'],['COORDINATES','N34°10′20″  W103°20′49″'],['STATUS','EPHEMERIS  READY   TRACK  EXACT   RENDER  HOLD'],['KEYBOARD','RETURN  SHIFT  CONTROL  BREAK  RESET']]},
{id:'mazius',name:'Mazius Display',artist:'Alberto Casagrande · Collletttivo',story:'A high-contrast display serif with old-style proportions and a strong calligraphic pulse. The interesting bit is not just “another serif”: it keeps a separate extra-italic voice that veers much harder into chancery movement, so one small family can swing between composed and dramatically handwritten.',license:'SIL Open Font License 1.1',faces:[{label:'Regular',family:'MaziusRegular',url:'https://raw.githubusercontent.com/collletttivo/mazius-display/main/fonts/MaziusDisplay-Regular.woff2',format:'woff2'},{label:'Bold',family:'MaziusBold',url:'https://raw.githubusercontent.com/collletttivo/mazius-display/main/fonts/MaziusDisplay-Bold.woff2',format:'woff2'},{label:'Extra Italic',family:'MaziusExtraItalic',url:'https://raw.githubusercontent.com/collletttivo/mazius-display/main/fonts/MaziusDisplay-Extraitalic.woff2',format:'woff2'},{label:'Extra Italic Bold',family:'MaziusExtraItalicBold',url:'https://raw.githubusercontent.com/collletttivo/mazius-display/main/fonts/MaziusDisplay-ExtraItalicBold.woff2',format:'woff2'}],samples:[['TITLE','An Atlas of the Local Sky'],['NAME','Ruthful Josef Rotschopf'],['POETIC','One moment. One observer. One chart.'],['ITALIC BAIT','Witnessed, reconstructed, remembered, arriving.']]},
{id:'nata',name:'Nata Sans',artist:'Daniel Uzquiano',story:'A humanist-grotesque UI face with a big x-height and broad, slow-reading proportions — but the reason it made this round is the implementation detail: version 2 ships 18 OpenType features plus Markdown-style emoji ligatures. Type :smile: or :cry: and ordinary text becomes a pictographic glyph.',license:'SIL Open Font License',features:['liga'],faces:[{label:'Light',family:'NataSans',url:'https://raw.githubusercontent.com/dnlzqn/nata-sans/main/NataSans%5Bwght%5D.ttf',format:'truetype',variation:"'wght' 300"},{label:'Regular',family:'NataSans',url:'https://raw.githubusercontent.com/dnlzqn/nata-sans/main/NataSans%5Bwght%5D.ttf',format:'truetype',variation:"'wght' 400"},{label:'Bold',family:'NataSans',url:'https://raw.githubusercontent.com/dnlzqn/nata-sans/main/NataSans%5Bwght%5D.ttf',format:'truetype',variation:"'wght' 700"}],samples:[['LIGATURE BAIT',':smile:  :wink:  :sad:  :cry:  :laugh:  :angry:'],['UI','Saved Chart · 2D · 3D · Provenance · Witness'],['TEXT','Choose a moment. See what was in the sky.'],['NUMBERS','1992 · 2026 · 05:57 · 34.1722']]},
{id:'sinistre',name:'Sinistre',artist:'Jules Durand · Collletttivo',story:'A display family built from several old writing traditions colliding: uncial minuscule, Roman proportions, Fraktur hints, Insular-script energy and references to Gaelic stone carving and Celtic calligraphy. It feels historical without pretending to be a facsimile of one specific manuscript.',license:'SIL Open Font License 1.1',faces:[{label:'Regular',family:'SinistreRegular',url:'https://raw.githubusercontent.com/collletttivo/sinistre/main/fonts/Sinistre-Regular.woff2',format:'woff2'},{label:'Bold',family:'SinistreBold',url:'https://raw.githubusercontent.com/collletttivo/sinistre/main/fonts/Sinistre-Bold.woff2',format:'woff2'},{label:'Dark',family:'SinistreDark',url:'https://raw.githubusercontent.com/collletttivo/sinistre/main/fonts/Sinistre-Dark.woff2',format:'woff2'},{label:'Variable',family:'SinistreVF',url:'https://raw.githubusercontent.com/collletttivo/sinistre/main/fonts/SinistreVF.woff2',format:'woff2'}],samples:[['INSCRIPTION','THE WITNESS OF THE LOCAL SKY'],['BOOK','A Catalogue of Arriving Light'],['CAPS','NORTH · EAST · SOUTH · WEST'],['DATE','XIX JANUARY · MCMXCII']]}
