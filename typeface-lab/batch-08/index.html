<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title id="title">Ruthie Open Font Library — Batch 08</title><link rel="stylesheet" href="../app.css"></head><body><header><div class="kicker" id="kicker"></div><h1>Ten completely different origin stories</h1><div class="sub" id="sub"></div><nav class="nav" id="nav"></nav></header><div class="global"><div class="globalbox"><div class="control-label">THROW THE SAME TEXT AT ALL TEN</div><input id="global" type="text" placeholder="Type anything here…"><div class="range"><span>Display size</span><input id="size" type="range" min="22" max="76" value="34"><span id="sizeVal">34</span></div></div></div><main id="app"></main><pre id="exportBox" hidden></pre><div class="footer"><div class="footer-inner"><div class="status" id="status" aria-live="polite"></div><button class="copy" id="copy" type="button">COPY PICKS</button></div></div><script>window.FONT_BATCH={batch:8,approvedBefore:46,subtitle:'School handwriting · CNC toolpaths · router-carved park signs · CERN terminals · climate data · Los Angeles vernacular · inclusive glyph systems · algorithmic construction · trackpad uncial · art-center identity',candidates:[
{id:'borel',name:'Borel',artist:'Rosalie Wagner · ANRT Nancy',story:'A cursive family developed with teachers and speech therapists to question how French primary-school handwriting is taught. Instead of treating school cursive as untouchable tradition, Borel reworks proportions, x-height, openness and differentiation for beginner readers while staying compatible with the gestures children are actually asked to learn. It is named for speech-therapy pioneer Suzanne Borel-Maisonny.',license:'SIL Open Font License 1.1',faces:[{label:'Cursive',family:'Borel',url:'https://raw.githubusercontent.com/RosaWagner/Borel/main/Borel/fonts/webfonts/Borel-Regular.woff2',format:'woff2'},{label:'Display',family:'BorelDisplay',url:'https://raw.githubusercontent.com/RosaWagner/Borel/main/Borel/fonts/webfonts/BorelDisplay-Regular.woff2',format:'woff2'},{label:'Display Rounded',family:'BorelDisplayRnd',url:'https://raw.githubusercontent.com/RosaWagner/Borel/main/Borel/fonts/webfonts/BorelDisplayRnd-Regular.woff2',format:'woff2'},{label:'French Traditional',family:'BorelFRTrad',url:'https://raw.githubusercontent.com/RosaWagner/Borel/main/Borel/fonts/webfonts/BorelFRTrad-Regular.woff2',format:'woff2'},{label:'Ornamental',family:'BorelOrn',url:'https://raw.githubusercontent.com/RosaWagner/Borel/main/Borel/fonts/webfonts/BorelOrn-Regular.woff2',format:'woff2'}],samples:[['SCHOOLBOOK','Bonjour, je m’appelle Ruthie.'],['HAND','le ciel · la lumière · le lieu · le temps'],['LONGER','Apprendre à lire et apprendre à écrire en même temps.'],['NAME','Ruthful Josef Rotschopf']]},
{id:'mistral',name:'Mistral SingleLine',artist:'François Chastanet + isdaT-type students',story:'Roger Excoffon’s 1953 Mistral reinterpreted as a literal path a machine can follow. The project exists both as normal outline typography and as skeletal OpenType-SVG for pens, laser cutters, engravers and milling tools. It is a pedagogical micro-foundry experiment where type design meets CNC fabrication rather than merely pretending to look “technical.”',license:'SIL Open Font License 1.1',faces:[{label:'Outline',family:'MistralSingleLine',url:'https://raw.githubusercontent.com/isdat-type/Mistral-SingleLine/main/fonts/outline_woff/MistralSingleLineOutline-Regular.woff2',format:'woff2'}],samples:[['PLOTTER','a line becomes a letter becomes a toolpath'],['FAB LAB','PEN · LASER · ENGRAVE · MILL'],['SCRIPT','Spatial Press — drawn by a path'],['LIGATURE BAIT','affair · pressure · little · question · station']]},
{id:'nationalpark',name:'National Park',artist:'Ben Hoepner + collaborators',story:'Built from the lettering logic of router-carved wooden signs in Rocky Mountain National Park. Each character begins as a vector skeleton resembling the coordinates a router would follow; the family then adds optical corrections where an actual machine-cut path would make reading worse. This is signage as an explicit manufacturing process.',license:'SIL Open Font License 1.1',faces:[{label:'Extra Light',family:'NationalParkXL',url:'https://raw.githubusercontent.com/benhoepner/National-Park/master/fonts/webfonts/NationalPark-ExtraLight.woff2',format:'woff2'},{label:'Regular',family:'NationalParkReg',url:'https://raw.githubusercontent.com/benhoepner/National-Park/master/fonts/webfonts/NationalPark-Regular.woff2',format:'woff2'},{label:'Medium',family:'NationalParkMed',url:'https://raw.githubusercontent.com/benhoepner/National-Park/master/fonts/webfonts/NationalPark-Medium.woff2',format:'woff2'},{label:'Bold',family:'NationalParkBold',url:'https://raw.githubusercontent.com/benhoepner/National-Park/master/fonts/webfonts/NationalPark-Bold.woff2',format:'woff2'},{label:'Extra Bold',family:'NationalParkXB',url:'https://raw.githubusercontent.com/benhoepner/National-Park/master/fonts/webfonts/NationalPark-ExtraBold.woff2',format:'woff2'}],samples:[['TRAIL','BEAR LAKE  0.6 MI →'],['RANGER','ROCKY MOUNTAIN NATIONAL PARK'],['DIRECTION','NORTH TRAIL · LAKE · OVERLOOK · SUMMIT'],['SPATIAL','PORTALES · NEW MEXICO · 19 JAN 1992']]},
{id:'meyrin',name:'Meyrin',artist:'Brian Suda',story:'A reconstruction from photographs of an old CERN terminal display. The letterforms preserve the horizontal interruptions created by scanlines, so the “damage” is not decoration pasted onto a normal digital font; it records how characters actually appeared through a particular display technology.',license:'SIL Open Font License 1.1',faces:[{label:'Terminal',family:'Meyrin',url:'https://raw.githubusercontent.com/optional-is/Meyrin/master/formats/Meyrin.woff',format:'woff'}],samples:[['TERMINAL','CERN  MEYRIN  STATUS: READY'],['DATA','RUN 1992-019 / UTC 00:57:00'],['COORDINATES','34.172160 N   103.347000 W'],['SYSTEM','TRACK EXACT · EPHEMERIS LOAD · OBSERVER LOCK']]},
{id:'climate',name:'Climate Crisis',artist:'Eino Korkala · Daniel Coull · Eunyou Noh · Joohee Lee',story:'A newspaper typeface whose form is also a data visualization. Designed for Helsingin Sanomat, its YEAR dimension maps Arctic sea-ice levels from 1979 through 2019 and projected conditions toward 2050 using National Snow and Ice Data Center data. The font itself carries a time series.',license:'SIL Open Font License 1.1',faces:[{label:'1990',family:'Climate1990',url:'https://raw.githubusercontent.com/dancoull/ClimateCrisis/main/fonts/webfonts/ClimateCrisis1990-Regular.woff2',format:'woff2'},{label:'2000',family:'Climate2000',url:'https://raw.githubusercontent.com/dancoull/ClimateCrisis/main/fonts/webfonts/ClimateCrisis2000-Regular.woff2',format:'woff2'},{label:'2010',family:'Climate2010',url:'https://raw.githubusercontent.com/dancoull/ClimateCrisis/main/fonts/webfonts/ClimateCrisis2010-Regular.woff2',format:'woff2'},{label:'2019',family:'Climate2019',url:'https://raw.githubusercontent.com/dancoull/ClimateCrisis/main/fonts/webfonts/ClimateCrisis2019-Regular.woff2',format:'woff2'},{label:'2030',family:'Climate2030',url:'https://raw.githubusercontent.com/dancoull/ClimateCrisis/main/fonts/webfonts/ClimateCrisis2030-Regular.woff2',format:'woff2'},{label:'2050',family:'Climate2050',url:'https://raw.githubusercontent.com/dancoull/ClimateCrisis/main/fonts/webfonts/ClimateCrisis2050-Regular.woff2',format:'woff2'}],samples:[['TIME SERIES','1990  2000  2010  2019  2030  2050'],['HEADLINE','THE LETTERS ARE LOSING ICE'],['DATA','ARCTIC SEA ICE · OBSERVED + PROJECTED'],['QUESTION','WHAT SHOULD A FONT BE ALLOWED TO MEASURE?']]},
{id:'alvarado',name:'Alvarado',artist:'Hector Torres · Primary Foundry',story:'A Los Angeles vernacular project built from hand-painted and improvised commercial lettering observed along Alvarado Street through Westlake and Pico-Union. The point is not nostalgia for sign painting; it is treating a living neighborhood’s everyday lettering as serious source material for a contemporary open family.',license:'SIL Open Font License 1.1',faces:[{label:'Light',family:'AlvaradoLight',url:'https://db.onlinewebfonts.com/t/4605a68f6682b25da2e6278142bf3a25.woff2',format:'woff2'},{label:'Regular',family:'AlvaradoRegular',url:'https://db.onlinewebfonts.com/t/7ea0baf3a25295dccf02de1d004bdab6.woff2',format:'woff2'},{label:'Medium',family:'AlvaradoMedium',url:'https://db.onlinewebfonts.com/t/01d842a4698cf4c602b52a89c9d072c1.woff2',format:'woff2'},{label:'Bold',family:'AlvaradoBold',url:'https://db.onlinewebfonts.com/t/3bd847a6cabd7af1c6c6220b9603ed96.woff2',format:'woff2'}],samples:[['STREET','ALVARADO STREET'],['SHOP WINDOW','PANADERÍA · MARKET · REPAIR · CAFÉ'],['LOS ANGELES','WESTLAKE · PICO-UNION · LOS ANGELES'],['DATE','OPEN DAILY  7 AM — 10 PM']]},
{id:'amiamie',name:'Amiamie',artist:'Mirat-Masson · Bye Bye Binary',story:'An open grotesk deliberately expanded with non-binary and inclusive glyphs. Its lineage passes through familiar Swiss grotesque forms, but the actual project asks a much more interesting question: what happens when inclusive writing is treated as a problem for type design itself rather than patched in after the alphabet is already considered finished?',license:'SIL Open Font License 1.1',faces:[{label:'Regular',family:'Amiamie',url:'https://db.onlinewebfonts.com/t/21485cc2c3beaa628bd31e3f159a22f7.woff2',format:'woff2'}],samples:[['FRIENDS','ami·e · auteur·ice · toustes · celleux'],['LETTER','Écrire autrement change aussi la forme des lettres.'],['PAIRING','friend · lover · witness · observer'],['SPATIAL','SPATIAL PRESS — EVERYONE GETS TO BE IN THE ALPHABET']]},
{id:'autopia',name:'Autopia',artist:'Antoine Gelgon · OSP Summer School',story:'A typeface whose drawing process was partly generated rather than manually outlined in the usual way. Begun at Open Source Publishing’s 2013 Summer School, its skeletons came through Autotrace bitmap-to-vector conversion, while calligraphic forms were constructed with Python and FontForge code. A useful early example of code becoming part of the drawing hand.',license:'SIL Open Font License 1.1',faces:[{label:'Regular',family:'AutopiaRegular',url:'https://raw.githubusercontent.com/Antoine-Gelgon/Autopia-TTF-v1.1/master/Autopia-Regular.ttf',format:'truetype'},{label:'Italic',family:'AutopiaItalic',url:'https://raw.githubusercontent.com/Antoine-Gelgon/Autopia-TTF-v1.1/master/Autopia-Italic.ttf',format:'truetype'},{label:'Bold',family:'AutopiaBold',url:'https://raw.githubusercontent.com/Antoine-Gelgon/Autopia-TTF-v1.1/master/Autopia-Bold.ttf',format:'truetype'},{label:'Bold Italic',family:'AutopiaBoldItalic',url:'https://raw.githubusercontent.com/Antoine-Gelgon/Autopia-TTF-v1.1/master/Autopia-Bold-Italic.ttf',format:'truetype'}],samples:[['PROCESS','BITMAP → AUTOTRACE → VECTOR → FONT'],['CODE','python / fontforge / skeleton / calligraphy'],['TITLE','A MACHINE CAN PARTICIPATE IN DRAWING'],['NAME','RUTHFUL JOSEF ROTSCHOPF']]},
{id:'ancial',name:'Ancial',artist:'Anne-Dauphine Borione / Daytona Mess',story:'A contemporary “cyberuncial” drawn with the deliberately ordinary tools of a trackpad and mouse. Rather than reconstructing a manuscript hand faithfully, it lets clumsy digital pointing devices reshape uncial and Roman instincts into something current, with hundreds of glyphs and alternates.',license:'SIL Open Font License 1.1',faces:[{label:'Regular',family:'Ancial',url:'https://db.onlinewebfonts.com/t/e76cc34e2cdad54d170e4726deeea7fe.woff2',format:'woff2'}],samples:[['CYBERUNCIAL','ANCIENT HAND / CHEAP TRACKPAD / NEW LETTER'],['DISPLAY','THE SKY REMEMBERS NOTHING'],['GLYPHS','ABCDEFGH IJKLMN OPQRST UVWXYZ'],['NAME','Ruthful Josef Rotschopf']]},
{id:'syne',name:'Syne',artist:'Bonjour Monde · for Synesthésie art center',story:'A family originally commissioned for an art center in Saint-Denis and intentionally allowed to split into unlike siblings. The core face behaves like identity typography; Tactile pushes toward hand-made/found-object energy; Mono was distorted through computational processes. It is a family designed as an art system rather than a tidy set of matching weights.',license:'SIL Open Font License 1.1',faces:[{label:'Regular',family:'SyneReg',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/syne/Syne%5Bwght%5D.ttf',format:'truetype',variation:"'wght' 400"},{label:'Extra',family:'SyneExtra',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/syne/Syne%5Bwght%5D.ttf',format:'truetype',variation:"'wght' 800"},{label:'Tactile',family:'SyneTactile',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/synetactile/SyneTactile-Regular.ttf',format:'truetype'},{label:'Mono',family:'SyneMono',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/synemono/SyneMono-Regular.ttf',format:'truetype'}],samples:[['ART CENTER','SYNESTHÉSIE · SAINT-DENIS'],['FAMILY','REGULAR / EXTRA / TACTILE / MONO'],['EXHIBITION','THE SYSTEM DOES NOT HAVE TO MATCH ITSELF'],['SPATIAL','SPATIAL PRESS · ONE MOMENT IN THE UNIVERSE']]}
]};</script><script src="../app.js"></script></body></html>
