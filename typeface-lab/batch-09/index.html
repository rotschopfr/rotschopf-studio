  const fresh=[
    {group:'NEW · Color / machine / generative',id:'nabla',name:'Nabla',artist:'Arthur Reinders Folmer · engineering by Just van Rossum',story:'A typeable isometric color system rather than a flat display face. Nabla uses COLRv1 gradients plus two live design axes: extrusion depth and edge highlight. It was built with the visual logic of vintage isometric computer games, so the letterforms can literally gain or lose dimensional depth without changing fonts.',license:'SIL Open Font License 1.1',faces:[{label:'Flat',family:'NablaVF',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/nabla/Nabla%5BEDPT%2CEHLT%5D.ttf',format:'truetype',variation:"'EDPT' 0, 'EHLT' 0"},{label:'Mid depth',family:'NablaVF',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/nabla/Nabla%5BEDPT%2CEHLT%5D.ttf',format:'truetype',variation:"'EDPT' 100, 'EHLT' 12"},{label:'Deep + bright',family:'NablaVF',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/nabla/Nabla%5BEDPT%2CEHLT%5D.ttf',format:'truetype',variation:"'EDPT' 200, 'EHLT' 24"}],samples:[['COLOR TYPE','SPATIAL PRESS'],['OBJECT LABEL','ORBITER · VEHICLE 07'],['DEPTH','ARRIVING LIGHT'],['DATA','1992 · 17:57 · 34.1722° N']]},
    {group:'NEW · Color / machine / generative',id:'kalniaglaze',name:'Kalnia Glaze',artist:'Frida Medrano',story:'A COLRv1 variable font built around the idea of glazing: Victorian sash windows, layered color, reflected light and shadow. Its gradient construction was developed with code-assisted color-font tooling, so the visual system sits right at the seam between drawing and implementation.',license:'SIL Open Font License 1.1',faces:[{label:'Condensed light',family:'KalniaGlazeVF',url:'https://raw.githubusercontent.com/fridamedrano/Kalnia-Glaze/main/fonts/variable/KalniaGlaze%5Bwdth%2Cwght%5D.ttf',format:'truetype',variation:"'wdth' 75, 'wght' 300"},{label:'Regular',family:'KalniaGlazeVF',url:'https://raw.githubusercontent.com/fridamedrano/Kalnia-Glaze/main/fonts/variable/KalniaGlaze%5Bwdth%2Cwght%5D.ttf',format:'truetype',variation:"'wdth' 100, 'wght' 500"},{label:'Wide heavy',family:'KalniaGlazeVF',url:'https://raw.githubusercontent.com/fridamedrano/Kalnia-Glaze/main/fonts/variable/KalniaGlaze%5Bwdth%2Cwght%5D.ttf',format:'truetype',variation:"'wdth' 125, 'wght' 800"}],samples:[['GLAZED','SPATIAL PRESS'],['MATERIAL','COLOR · LIGHT · GLASS · SHADOW'],['TITLE','A Catalogue of Arriving Light'],['OBJECT','SATELLITE / WITNESS / TRACE']]},
    {group:'NEW · Color / machine / generative',id:'nupuramcolor',name:'Nupuram Color',artist:'Santhosh Thottingal',story:'A Malayalam color type system with an unusually deep procedural life. Nupuram began from expressive early Malayalam movie-title forms; its COLRv1 version uses three-color internal gradients, ships many palettes, and makes weight alter apparent z-depth. The wider project is generated from variable designspaces and build code rather than treated as a pile of static drawings.',license:'SIL Open Font License 1.1',faces:[{label:'Shallow',family:'NupuramColorVF',url:'https://raw.githubusercontent.com/santhoshtr/nupuram/master/fonts/Nupuram-Color/webfonts/Nupuram-Color.colrv1.woff2',format:'woff2',variation:"'wght' 100"},{label:'Regular',family:'NupuramColorVF',url:'https://raw.githubusercontent.com/santhoshtr/nupuram/master/fonts/Nupuram-Color/webfonts/Nupuram-Color.colrv1.woff2',format:'woff2',variation:"'wght' 400"},{label:'Deep',family:'NupuramColorVF',url:'https://raw.githubusercontent.com/santhoshtr/nupuram/master/fonts/Nupuram-Color/webfonts/Nupuram-Color.colrv1.woff2',format:'woff2',variation:"'wght' 900"}],samples:[['MALAYALAM','നുപുരം'],['GLYPHS','അ ആ ഇ ഈ ഉ ഊ എ ഏ ഐ ഒ ഓ ഔ'],['COLOR DEPTH','ക ഖ ഗ ഘ ങ ച ഛ ജ ഝ ഞ'],['NUMBERS','1992 · 2026 · 17:57']]},
    {group:'NEW · Color / machine / generative',id:'kablammo',name:'Kablammo',artist:'Vectro Type Foundry · Travis Kochel, Lizy Gershenzon, Daria Cohen, Ethan Cohen',story:'A variable font whose axis is literally called MORF. Moving it makes decorative pieces migrate through the glyphs while weight and contrast shift; contextual alternates can also keep repeated letters from behaving identically. The source project explicitly treats animation as a native use case.',license:'SIL Open Font License 1.1',features:['calt'],faces:[{label:'MORF 0',family:'KablammoVF',url:'https://raw.githubusercontent.com/Vectro-Type-Foundry/kablammo/main/fonts/variable/Kablammo%5BMORF%5D.ttf',format:'truetype',variation:"'MORF' 0"},{label:'MORF 20',family:'KablammoVF',url:'https://raw.githubusercontent.com/Vectro-Type-Foundry/kablammo/main/fonts/variable/Kablammo%5BMORF%5D.ttf',format:'truetype',variation:"'MORF' 20"},{label:'MORF 40',family:'KablammoVF',url:'https://raw.githubusercontent.com/Vectro-Type-Foundry/kablammo/main/fonts/variable/Kablammo%5BMORF%5D.ttf',format:'truetype',variation:"'MORF' 40"},{label:'MORF 60',family:'KablammoVF',url:'https://raw.githubusercontent.com/Vectro-Type-Foundry/kablammo/main/fonts/variable/Kablammo%5BMORF%5D.ttf',format:'truetype',variation:"'MORF' 60"}],samples:[['MORPH','SPATIAL PRESS'],['REPEAT','STAR STAR STAR STAR'],['OBJECTS','ORBIT · TRACE · WITNESS'],['ANIMATE','1992 → 2026 → 1992']]},
    {group:'NEW · Color / machine / generative',id:'decovar',name:'Decovar',artist:'David Berlow',story:'One variable font with a ridiculous parametric control surface: weight, inline, worm, skeleton, stripes, rounded, flared, slab, sheared, bifurcated and multiple terminal systems are independent axes. It is effectively a little type-construction machine packed into one font file.',license:'SIL Open Font License 1.1',faces:[{label:'Plain weight',family:'DecovarVF',url:'https://raw.githubusercontent.com/googlefonts/decovar/master/fonts/DecovarAlpha-VF.ttf',format:'truetype',variation:"'WMX2' 500"},{label:'Inline skeleton',family:'DecovarVF',url:'https://raw.githubusercontent.com/googlefonts/decovar/master/fonts/DecovarAlpha-VF.ttf',format:'truetype',variation:"'SKLA' 1000, 'TRMG' 750, 'WMX2' 500"},{label:'Worm',family:'DecovarVF',url:'https://raw.githubusercontent.com/googlefonts/decovar/master/fonts/DecovarAlpha-VF.ttf',format:'truetype',variation:"'BLDB' 1000, 'TRML' 1000, 'WMX2' 500"},{label:'Stripes + split',family:'DecovarVF',url:'https://raw.githubusercontent.com/googlefonts/decovar/master/fonts/DecovarAlpha-VF.ttf',format:'truetype',variation:"'SKLD' 1000, 'TRME' 1000, 'WMX2' 700"}],samples:[['PARAMETRIC','SPATIAL PRESS'],['AXES','INLINE · WORM · STRIPES · BIFURCATE'],['LABEL','CELESTIAL OBJECT 0047'],['DATA','AZ 241.6° · ALT +17.4°']]},
    {group:'NEW · Color / machine / generative',id:'dseg',name:'DSEG',artist:'Keshikan',story:'Not “retro digital” styling: this family is built to imitate actual segmented displays. It covers 7-segment, 14-segment and related display systems in dozens of variants, which makes it useful whenever Spatial Press wants something to look like a readout rather than merely hint at one.',license:'SIL Open Font License 1.1',faces:[{label:'7-seg Classic',family:'DSEG7Classic',url:'https://raw.githubusercontent.com/keshikan/DSEG/master/fonts/DSEG7-Classic/DSEG7Classic-Regular.woff2',format:'woff2'},{label:'14-seg Classic',family:'DSEG14Classic',url:'https://raw.githubusercontent.com/keshikan/DSEG/master/fonts/DSEG14-Classic/DSEG14Classic-Regular.woff2',format:'woff2'},{label:'14-seg Modern',family:'DSEG14Modern',url:'https://raw.githubusercontent.com/keshikan/DSEG/master/fonts/DSEG14-Modern/DSEG14Modern-Regular.woff2',format:'woff2'}],samples:[['READOUT','17:57:00'],['INSTRUMENT','241.6  +17.4  028.0'],['STATUS','TRACK READY HOLD TEST'],['DATE','1992-01-19']]},
    {group:'NEW · Color / machine / generative',id:'ibm3270',name:'IBM 3270',artist:'Ricardo Bánffy · after x3270 / Georgia Tech 3270tool / IBM terminal forms',story:'A chain of actual machine memory: the source lineage runs from lettering hand-copied from an IBM 3270 terminal, through Georgia Tech’s 3270tool and x3270, into Bánffy’s modern vector reconstruction. This is what a 1960s–80s mainframe terminal feels like because it is descended from that display system.',license:'Open-source BSD / OFL lineage · commercial-use compatible',faces:[{label:'Terminal',family:'IBM3270',url:'https://raw.githubusercontent.com/braver/programmingfonts/gh-pages/fonts/resources/font3270/font3270.woff2',format:'woff2'}],samples:[['IBM HOST','READY'],['SESSION','TSO/E LOGON · USERID · PASSWORD'],['STATUS','SYSTEM 3270 · SESSION ACTIVE'],['SPATIAL','OBJECT CATALOG / PAGE 01 OF 04']]},
    {group:'NEW · Color / machine / generative',id:'bedstead',name:'Bedstead',artist:'Ben Harris · after Mullard SAA5050 teletext hardware',story:'A hardware-specific resurrection of the character generator behind British Teletext and the BBC Micro’s MODE 7 display. The original chip started from a tiny grid and smoothed diagonals in hardware; Bedstead extends that same algorithm into scalable outlines instead of merely drawing something pixel-ish.',license:'CC0 / public-domain release',faces:[{label:'Teletext',family:'Bedstead',url:'https://raw.githubusercontent.com/braver/programmingfonts/gh-pages/fonts/resources/bedstead/bedstead.woff2',format:'woff2'}],samples:[['TELETEXT','SPATIAL PRESS  100'],['PAGE','CELESTIAL DATA     P142'],['STATUS','LATEST ORBIT DATA  17:57'],['MODE 7','PRESS RED TO RETURN']]},
    {group:'NEW · Color / machine / generative',id:'unscii',name:'UNSCII',artist:'Viznut',story:'A Unicode bitmap family assembled from the visual memory of classic computer system fonts. The project starts from editable bitmap source, then builds vector/web versions; the safe 8- and 16-pixel families are public-domain/CC0. It feels less like “a pixel font” than a compressed archive of old screen dialects.',license:'Public Domain / CC0 for these non-Unifont-derived builds',faces:[{label:'8-pixel',family:'Unscii8',url:'https://raw.githubusercontent.com/viznut/unscii/main/fontfiles/unscii-8.woff',format:'woff'},{label:'16-pixel',family:'Unscii16',url:'https://raw.githubusercontent.com/viznut/unscii/main/fontfiles/unscii-16.woff',format:'woff'}],samples:[['SYSTEM','*** SPATIAL PRESS ***'],['BOOT','MEMORY OK / SKY DATA LOADED'],['COORD','N34 10 20  W103 20 49'],['CATALOG','01 SUN   02 MOON   03 ISS   04 JUPITER']]},
    {group:'NEW · Color / machine / generative',id:'apl2741',name:'APL2741',artist:'Adrian Smith · digitized from an IBM Selectric 2741 APL typeball',story:'This started with a physical IBM Selectric “golf ball” salvaged from hardware. Adrian Smith hand-digitized the character set into a PostScript font, preserving the peculiar alphabet-plus-symbol language used to operate APL systems. It is office machinery, programming language and typographic artifact at once.',license:'Public Domain',faces:[{label:'2741 APL',family:'APL2741',url:'https://raw.githubusercontent.com/braver/programmingfonts/gh-pages/fonts/resources/apl2741/apl2741.woff2',format:'woff2'}],samples:[['TYPEBALL','IBM 2741 · APL'],['APL','⍳ ⍴ ⍵ ⍺ ⌈ ⌊ × ÷ ← → ↑ ↓ ∆ ∇'],['SESSION',')LOAD  SKYDATA'],['MACHINE','SELECTRIC TERMINAL / READY']]},
    {group:'NEW · Color / machine / generative',id:'lcd14',name:'LCD14',artist:'Fredrick Brennan / ∞type',story:'A 14-segment font made by treating the imaginary display hardware as a hard constraint. The author rejects “digital-looking” letters that require impossible segments or multiple cells; every glyph has to make physical sense on the same segmented display. That makes the weirdness engineering-derived rather than decorative.',license:'SIL Open Font License 1.1',faces:[{label:'Regular',family:'LCD14',url:'https://raw.githubusercontent.com/ctrlcctrlv/lcd-font/master/otf/LCD14.otf',format:'opentype'},{label:'Condensed',family:'LCD14Condensed',url:'https://raw.githubusercontent.com/ctrlcctrlv/lcd-font/master/otf/LCD14Condensed.otf',format:'opentype'},{label:'Italic',family:'LCD14Italic',url:'https://raw.githubusercontent.com/ctrlcctrlv/lcd-font/master/otf/LCD14Italic.otf',format:'opentype'}],samples:[['DISPLAY','SPATIAL PRESS'],['PANEL','ALT 17.4  AZ 241.6'],['CLOCK','17:57:00'],['ALERT','TRACK LOST · REACQUIRE']]}
