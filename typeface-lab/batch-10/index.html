{group:'MACHINE MEMORY',id:'sixtyfourconvergence',name:'Sixtyfour Convergence',artist:'Jens Kutilek + Simon Cozens · after Commodore 64 CRT typography',story:'This is unusually literal machine nostalgia. Sixtyfour reworks Commodore 64 screen lettering, then models the ugly-beautiful physics of CRT display: scanline height and phosphor bleed are variable axes. Convergence adds COLRv1 RGB layers whose horizontal and vertical misalignment can also move, reproducing the color-fringing of a badly converged tube instead of merely drawing “pixel type.”',license:'SIL Open Font License 1.1',faces:[{label:'Aligned / clean',family:'SixtyfourConv',url:'https://raw.githubusercontent.com/jenskutilek/homecomputer-fonts/main/Sixtyfour/fonts/variable/SixtyfourConvergence%5BBLED%2CSCAN%2CXELA%2CYELA%5D.ttf',format:'truetype',variation:"'BLED' 0, 'SCAN' 0, 'XELA' 0, 'YELA' 0"},{label:'Soft CRT',family:'SixtyfourConv',url:'https://raw.githubusercontent.com/jenskutilek/homecomputer-fonts/main/Sixtyfour/fonts/variable/SixtyfourConvergence%5BBLED%2CSCAN%2CXELA%2CYELA%5D.ttf',format:'truetype',variation:"'BLED' 55, 'SCAN' -20, 'XELA' 0, 'YELA' 0"},{label:'Bad convergence',family:'SixtyfourConv',url:'https://raw.githubusercontent.com/jenskutilek/homecomputer-fonts/main/Sixtyfour/fonts/variable/SixtyfourConvergence%5BBLED%2CSCAN%2CXELA%2CYELA%5D.ttf',format:'truetype',variation:"'BLED' 45, 'SCAN' -10, 'XELA' 60, 'YELA' -45"}],samples:[['C64 SCREEN','*** SPATIAL PRESS ***'],['STATUS','READY.  SKY CATALOG LOADED.'],['COORD','N34 10 20   W103 20 49'],['OBJECT','SATELLITE 0047 / TRACK EXACT']]},
{group:'MACHINE MEMORY',id:'workbench',name:'Workbench',artist:'Jens Kutilek · after Amiga Workbench interface typography',story:'The sibling to Sixtyfour comes from a different machine culture: the Amiga Workbench graphical interface. Kutilek rebuilt the old screen lettering as a variable font and again preserved CRT behavior as part of the design space. This one could make an interface label look immediately like it belongs to a late-1980s personal computer without borrowing a modern “retro” costume.',license:'SIL Open Font License 1.1',faces:[{label:'Clean Workbench',family:'WorkbenchVF',url:'https://raw.githubusercontent.com/jenskutilek/homecomputer-fonts/main/Workbench/fonts/variable/Workbench%5BBLED%2CSCAN%5D.ttf',format:'truetype',variation:"'BLED' 0, 'SCAN' 0"},{label:'Scanlined',family:'WorkbenchVF',url:'https://raw.githubusercontent.com/jenskutilek/homecomputer-fonts/main/Workbench/fonts/variable/Workbench%5BBLED%2CSCAN%5D.ttf',format:'truetype',variation:"'BLED' 10, 'SCAN' -45"},{label:'Phosphor bleed',family:'WorkbenchVF',url:'https://raw.githubusercontent.com/jenskutilek/homecomputer-fonts/main/Workbench/fonts/variable/Workbench%5BBLED%2CSCAN%5D.ttf',format:'truetype',variation:"'BLED' 85, 'SCAN' -10"}],samples:[['DESKTOP','SPATIAL PRESS WORKBENCH'],['WINDOW','OBJECT CATALOG   17:57:00'],['MENU','Project  Window  Icons  Tools'],['FILE','ISS_TRACK.EXACT   0047 bytes']]},
{group:'MACHINE MEMORY',id:'handjet',name:'Handjet',artist:'David Březina · Rosetta Type',story:'Handjet began as a one-day student exercise constrained by an actual industrial handjet printer: a 32-pixel vertical matrix, one repeated element, and letters assembled on the hardware grid. Březina then pushed the premise wildly further. The live font has axes for element size, element shape and one-versus-four elements per cell; its 23 shapes can interpolate from triangles and squares through circles, flowers, stars and hearts.',license:'SIL Open Font License 1.1',faces:[{label:'Square matrix',family:'HandjetVF',url:'https://raw.githubusercontent.com/rosettatype/handjet/master/fonts/Handjet%5BELGR%2CELSH%2Cwght%5D.woff2',format:'woff2',variation:"'wght' 500, 'ELSH' 2, 'ELGR' 1"},{label:'Round matrix',family:'HandjetVF',url:'https://raw.githubusercontent.com/rosettatype/handjet/master/fonts/Handjet%5BELGR%2CELSH%2Cwght%5D.woff2',format:'woff2',variation:"'wght' 650, 'ELSH' 8, 'ELGR' 1"},{label:'Star matrix',family:'HandjetVF',url:'https://raw.githubusercontent.com/rosettatype/handjet/master/fonts/Handjet%5BELGR%2CELSH%2Cwght%5D.woff2',format:'woff2',variation:"'wght' 700, 'ELSH' 14, 'ELGR' 1"},{label:'Double / flower',family:'HandjetVF',url:'https://raw.githubusercontent.com/rosettatype/handjet/master/fonts/Handjet%5BELGR%2CELSH%2Cwght%5D.woff2',format:'woff2',variation:"'wght' 550, 'ELSH' 13, 'ELGR' 2"}],samples:[['HANDJET','SPATIAL PRESS'],['CASE LABEL','OBJECT 0047 · EXACT TRACK'],['MACHINE','PRINT HEAD 32PX / PASS 03'],['FUN','STAR · FLOWER · HEART · GRID']]},
{group:'MACHINE MEMORY',id:'tiny5',name:'Tiny5',artist:'Gissio',story:'Five pixels tall, but the interesting part is not the pixel aesthetic. Tiny5 treats the failure modes of 1980s–90s gadgets as parameters: width, weight, roundness, bleed and jitter can move independently. One state reads like a calculator LCD, another like a fuzzy CRT, another like a slightly misbehaving dot-matrix print. It is a tiny machine simulator disguised as a font.',license:'SIL Open Font License 1.1',faces:[{label:'Crisp gadget',family:'Tiny5VF',url:'https://raw.githubusercontent.com/Gissio/font_Tiny5/main/fonts/variable/Tiny5%5BBLED%2CJITT%2CROND%2Cwdth%2Cwght%5D.ttf',format:'truetype',variation:"'BLED' 0, 'JITT' 0, 'ROND' 0, 'wdth' 100, 'wght' 500"},{label:'CRT bleed',family:'Tiny5VF',url:'https://raw.githubusercontent.com/Gissio/font_Tiny5/main/fonts/variable/Tiny5%5BBLED%2CJITT%2CROND%2Cwdth%2Cwght%5D.ttf',format:'truetype',variation:"'BLED' 90, 'JITT' 0, 'ROND' 30, 'wdth' 100, 'wght' 650"},{label:'Printer jitter',family:'Tiny5VF',url:'https://raw.githubusercontent.com/Gissio/font_Tiny5/main/fonts/variable/Tiny5%5BBLED%2CJITT%2CROND%2Cwdth%2Cwght%5D.ttf',format:'truetype',variation:"'BLED' 20, 'JITT' 100, 'ROND' 0, 'wdth' 90, 'wght' 500"},{label:'Round pocket toy',family:'Tiny5VF',url:'https://raw.githubusercontent.com/Gissio/font_Tiny5/main/fonts/variable/Tiny5%5BBLED%2CJITT%2CROND%2Cwdth%2Cwght%5D.ttf',format:'truetype',variation:"'BLED' 10, 'JITT' 10, 'ROND' 100, 'wdth' 115, 'wght' 650"}],samples:[['CALCULATOR','17:57  34.1722  -103.3470'],['GADGET','ORBIT / TRACK / SAVE / PRINT'],['STATUS','BATTERY 82%   SIGNAL 04'],['LABEL','SPATIAL PRESS']]},
{group:'GENERATIVE / DATA',id:'datalegreya',name:'Datalegreya',artist:'Figs Lab · based on Alegreya Sans SC Thin',story:'A genuinely strange answer to tiny data displays: put the graph inside the word. Datalegreya uses OpenType substitutions so text can carry its own little data curve. Codes such as b|1i|3n|2g|2o|1 turn numerical values into a line threaded through the letterforms; it was explicitly designed for embedded displays, weather, connected objects and reports where text and graph compete for the same few pixels.',license:'SIL Open Font License 1.1',defaultFeatures:['liga','dlig','calt'],features:['liga','dlig','calt'],faces:[{label:'Gradient',family:'DatalegreyaGradient',url:'https://raw.githubusercontent.com/figs-lab/datalegreya/master/lib/fonts/Datalegreya-Gradient.otf',format:'opentype'},{label:'Dot',family:'DatalegreyaDot',url:'https://raw.githubusercontent.com/figs-lab/datalegreya/master/lib/fonts/Datalegreya-Dot.otf',format:'opentype'},{label:'Thin',family:'DatalegreyaThin',url:'https://raw.githubusercontent.com/figs-lab/datalegreya/master/lib/fonts/Datalegreya-Thin.otf',format:'opentype'}],samples:[['ENCODED GRAPH','s|1k|3y|2d|2a|1t|3a|2'],['WEATHER-ish','t|0e|1m|2p|3e|2r|1a|0t|1u|2r|3e|2'],['PLAIN','SPATIAL PRESS'],['DATA','1992 · 17:57 · ALT +17.4°']]},
{group:'GENERATIVE / DATA',id:'averia',name:'Averia Libre',artist:'Dan Sayers',story:'Averia is literally an average. Sayers generated its outlines and metrics by mathematically averaging hundreds of other fonts — the documented Libre build comes from 725 faces — turning a statistical aggregate into a strangely human-looking family. The name nods at “average” and the Spanish avería, breakdown or mechanical damage. It is one of the best examples here of an algorithm producing a personality rather than just a technical demo.',license:'SIL Open Font License 1.1',faces:[{label:'Light',family:'AveriaLight',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/averialibre/AveriaLibre-Light.ttf',format:'truetype'},{label:'Regular',family:'AveriaRegular',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/averialibre/AveriaLibre-Regular.ttf',format:'truetype'},{label:'Bold',family:'AveriaBold',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/averialibre/AveriaLibre-Bold.ttf',format:'truetype'},{label:'Italic',family:'AveriaItalic',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/averialibre/AveriaLibre-Italic.ttf',format:'truetype'}],samples:[['AVERAGE','725 FONTS BECOME ONE'],['TITLE','A Statistical Ghost of Typography'],['SPATIAL','ONE MOMENT · MANY SOURCES'],['NAME','RUTHFUL JOSEF ROTSCHOPF']]},
{group:'GENERATIVE / DATA',id:'amstelvar',name:'Amstelvar',artist:'David Berlow · Type Network / Google Fonts',story:'A historical serif used as a laboratory for an entirely different idea of variable type. Amstelvar draws on type made in the Netherlands and Belgium from the sixteenth century through the period leading to Times, but it became the first public demonstration of Type Network’s parametric-axis model. Instead of one vague “style” slider, dimensions such as stroke thickness, counter width, grade, ascender height and optical size can be treated as separate engineering variables.',license:'SIL Open Font License 1.1',faces:[{label:'Bookish',family:'AmstelvarRoman',url:'https://raw.githubusercontent.com/googlefonts/amstelvar/main/fonts/Amstelvar-Roman%5BGRAD%2CXOPQ%2CXTRA%2CYOPQ%2CYTAS%2CYTDE%2CYTFI%2CYTLC%2CYTUC%2Cwdth%2Cwght%2Copsz%5D.ttf',format:'truetype',variation:"'wght' 400, 'wdth' 100, 'opsz' 14, 'GRAD' 0"},{label:'Display / narrow',family:'AmstelvarRoman',url:'https://raw.githubusercontent.com/googlefonts/amstelvar/main/fonts/Amstelvar-Roman%5BGRAD%2CXOPQ%2CXTRA%2CYOPQ%2CYTAS%2CYTDE%2CYTFI%2CYTLC%2CYTUC%2Cwdth%2Cwght%2Copsz%5D.ttf',format:'truetype',variation:"'wght' 500, 'wdth' 75, 'opsz' 72, 'GRAD' 0"},{label:'Wide / dark',family:'AmstelvarRoman',url:'https://raw.githubusercontent.com/googlefonts/amstelvar/main/fonts/Amstelvar-Roman%5BGRAD%2CXOPQ%2CXTRA%2CYOPQ%2CYTAS%2CYTDE%2CYTFI%2CYTLC%2CYTUC%2Cwdth%2Cwght%2Copsz%5D.ttf',format:'truetype',variation:"'wght' 700, 'wdth' 125, 'opsz' 36, 'GRAD' 75"},{label:'Italic',family:'AmstelvarItalic',url:'https://raw.githubusercontent.com/googlefonts/amstelvar/main/fonts/Amstelvar-Italic%5BGRAD%2CYOPQ%2CYTAS%2CYTDE%2CYTFI%2CYTLC%2CYTUC%2Cwdth%2Cwght%2Copsz%5D.ttf',format:'truetype',variation:"'wght' 450, 'wdth' 100, 'opsz' 18, 'GRAD' 0"}],samples:[['TITLE','A RECONSTRUCTED ATLAS'],['HISTORY','ANTWERP · AMSTERDAM · SIXTEENTH CENTURY → VARIABLE FONT'],['BOOK','The local sky, printed as evidence.'],['DATA','19 JANUARY 1992 · 17:57 MST']]},
{group:'MATERIAL / HISTORICAL',id:'relief',name:'Relief SingleLine',artist:'Élisa Garzelli + Noëlie Dayma · led by François Chastanet · isdaT',story:'This one exists because normal fonts are wasteful when the “printer” is a moving tool. Relief is a true single-line system for CNC routers, milling, laser cutting and pen plotting: one skeletal path for the machine to follow instead of outlining a filled letter twice. The project even developed an OpenType-SVG route so open paths could survive inside ordinary Adobe text workflows. It is typography designed around tool travel.',license:'SIL Open Font License 1.1',faces:[{label:'Web outline',family:'ReliefOutline',url:'https://raw.githubusercontent.com/isdat-type/Relief-SingleLine/main/fonts/outline_woff2/ReliefSingleLineOutline-Regular.woff2',format:'woff2'},{label:'Ornament outline',family:'ReliefOrnament',url:'https://raw.githubusercontent.com/isdat-type/Relief-SingleLine/main/fonts/outline_woff2/ReliefSingleLineOrnamentOutline-Regular.woff2',format:'woff2'}],samples:[['ENGRAVE','SPATIAL PRESS'],['MACHINE PATH','LASER · PEN · MILL · ROUTER'],['PLATE','OBJECT 0047 / WITNESS / 1992'],['COORD','34.1722 N   103.3470 W']]},
{group:'MATERIAL / HISTORICAL',id:'jacquard',name:'Jacquard / Jacquard Charted',artist:'Sarah Fried / Soft Type · after Heinrich Kuehn c.1880',story:'A Victorian needlepoint alphabet becomes a contemporary font and then, crucially, becomes a chart again. The source is a Berlin needlework design by Heinrich Kuehn from around 1880. Soft Type expands it into 12- and 24-unit families, with “Charted” cuts that expose the grid behind each letter. This is almost suspiciously useful for Spatial Press textiles: the font carries its textile construction logic visibly inside itself.',license:'SIL Open Font License 1.1',faces:[{label:'12',family:'Jacquard12',url:'https://raw.githubusercontent.com/scfried/soft-type-jacquard/main/fonts/webfonts/Jacquard12-Regular.woff2',format:'woff2'},{label:'12 Charted',family:'Jacquard12Charted',url:'https://raw.githubusercontent.com/scfried/soft-type-jacquard/main/fonts/webfonts/Jacquard12Charted-Regular.woff2',format:'woff2'},{label:'24',family:'Jacquard24',url:'https://raw.githubusercontent.com/scfried/soft-type-jacquard/main/fonts/webfonts/Jacquard24-Regular.woff2',format:'woff2'},{label:'24 Charted',family:'Jacquard24Charted',url:'https://raw.githubusercontent.com/scfried/soft-type-jacquard/main/fonts/webfonts/Jacquard24Charted-Regular.woff2',format:'woff2'}],samples:[['NEEDLEPOINT','SPATIAL PRESS'],['TEXTILE','WITNESS THE LOCAL SKY'],['CHART','NORTH · EAST · SOUTH · WEST'],['DATE','19 · 01 · 1992']]},
{group:'MATERIAL / HISTORICAL',id:'oldtimeymono',name:'Old Timey Mono',artist:'Darren Embry · after Reproducing Typewriter, c.1906',story:'This is a reconstruction of a font that was already impersonating another technology. Reproducing Typewriter was metal type sold by the early 1900s to simulate typewritten letters in small printed ads and catalogs, where actual typewriter output reproduced badly. Embry revived that fake-typewriter metal face into a modern mono; the historical source even turns up in the Turbo Pascal 3.0 manual. A copy of a copy of a machine voice.',license:'SIL Open Font License 1.1',faces:[{label:'Regular',family:'OldTimeyMono',url:'https://raw.githubusercontent.com/dse/old-timey-mono-font/master/dist/ttf/OldTimeyMono.ttf',format:'truetype'},{label:'Light',family:'OldTimeyMonoLight',url:'https://raw.githubusercontent.com/dse/old-timey-mono-font/master/dist/ttf/OldTimeyMono-Light.ttf',format:'truetype'},{label:'Condensed',family:'OldTimeyMonoCond',url:'https://raw.githubusercontent.com/dse/old-timey-mono-font/master/dist/ttf/OldTimeyMonoCond.ttf',format:'truetype'},{label:'Code',family:'OldTimeyCode',url:'https://raw.githubusercontent.com/dse/old-timey-mono-font/master/dist/ttf/OldTimeyCode.ttf',format:'truetype'}],samples:[['TYPEWRITTEN?','SPATIAL PRESS / OBSERVATION REPORT'],['CATALOG','ITEM 0047   DATE 19 JAN 1992'],['MANUAL','SYSTEM READY. ENTER COORDINATES.'],['NOTE','This text was printed to look typed.']]}
]};
