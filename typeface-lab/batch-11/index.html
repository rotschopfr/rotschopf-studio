{group:'MACHINE MEMORY',id:'glasstty',name:'GlassTTY VT220',artist:'Viacheslav Slavinsky · after DEC VT220 terminal lettering',story:'A direct reconstruction of the letterforms associated with the DEC VT220 glass terminal rather than a generic terminal font. It gives labels the visual memory of sitting in front of a real early-1980s text terminal.',license:'The Unlicense / public-domain dedication',faces:[{label:'VT220',family:'GlassTTY',url:'https://raw.githubusercontent.com/svofski/glasstty/master/Glass_TTY_VT220.ttf',format:'truetype'}],samples:[['TERMINAL','VT220  ONLINE'],['SESSION','LOGIN: SPATIAL   NODE: SKY01'],['STATUS','TRACK EXACT · BUFFER READY'],['COORD','34.1722 N  103.3470 W']]},
{group:'MACHINE MEMORY',id:'ibmvga',name:'Px437 IBM VGA 8×16',artist:'VileR / Oldschool PC Font Pack · IBM VGA text-mode reconstruction',story:'The familiar IBM-compatible PC text screen preserved as an actual CP437 outline font. Its proportions come from the 8×16 hardware character cell, so it looks like DOS because it descends from the display grid that made DOS look that way.',license:'CC BY-SA 4.0',faces:[{label:'8×16',family:'IBMVGA816',url:'https://raw.githubusercontent.com/retro-vault/font-vault/main/source/fonts/oldschool_ibm_vga_8x16/Px437_IBM_VGA_8x16.ttf',format:'truetype'}],samples:[['PC SCREEN','C:\\SPATIAL\\SKY>'],['CATALOG','01 SUN  02 MOON  03 ISS  04 JUPITER'],['BOX DRAW','╔══════════════════════╗'],['DATA','17:57:00  ALT +17.4  AZ 241.6']]},
{group:'MACHINE MEMORY',id:'robotron',name:'Robotron Dot Matrix',artist:'nzeemin · restored from Robotron 9-pin printer ROMs',story:'Recovered from real character-generator ROMs in Robotron SM6329.01M and K6313 printers. The three faces preserve Pica, Elite and Sperrschrift output, making this less a revival than executable printer archaeology.',license:'Public Domain',faces:[{label:'Pica',family:'RobotronPica',url:'https://raw.githubusercontent.com/nzeemin/robotron-dotmatrix-font/master/robotronfontpica.woff',format:'woff'},{label:'Elite',family:'RobotronElite',url:'https://raw.githubusercontent.com/nzeemin/robotron-dotmatrix-font/master/robotronfontelit.woff',format:'woff'},{label:'Sperrschrift',family:'RobotronSperr',url:'https://raw.githubusercontent.com/nzeemin/robotron-dotmatrix-font/master/robotronfontsper.woff',format:'woff'}],samples:[['PRINTER','ROBOTRON SM6329.01M'],['JOB','CELESTIAL CATALOG / COPY 03'],['LINE','................................'],['DATA','1992-01-19  17:57 MST']]},
{group:'MACHINE MEMORY',id:'dotmatrix',name:'DotMatrix',artist:'Stefan Schmidt · after Epson FX-80 printer modes',story:'Built around the Epson FX-80’s actual printing modes: Pica, Elite, compressed, expanded and emphasized behaviors map into a family. It even models dot strength and spacing, turning the mechanical inaccuracies of a print head into controllable typography.',license:'SIL Open Font License 1.1',faces:[{label:'Pica',family:'DotMatrixReg',url:'https://raw.githubusercontent.com/Gissio/font_DotMatrix/main/fonts/webfonts/DotMatrix-Regular.woff2',format:'woff2'},{label:'Elite',family:'DotMatrixExpanded',url:'https://raw.githubusercontent.com/Gissio/font_DotMatrix/main/fonts/webfonts/DotMatrix-ExpandedRegular.woff2',format:'woff2'},{label:'Compressed',family:'DotMatrixCondensed',url:'https://raw.githubusercontent.com/Gissio/font_DotMatrix/main/fonts/webfonts/DotMatrix-CondensedRegular.woff2',format:'woff2'}],samples:[['FX-80','EPSON FX-80 / FORM FEED'],['PRINT','SPATIAL PRESS — OBSERVER RECORD'],['ASCII','+----------------------------+'],['DATA','N34 10 20  W103 20 49']]},
{group:'MACHINE MEMORY',id:'olivetti8x16',name:'Px437 OlivettiThin 8×16',artist:'VileR / Oldschool PC Font Pack · Olivetti display reconstruction',story:'An 8×16 machine face from the Olivetti branch of PC display history. The narrow drawing is immediately different from IBM VGA while retaining the hard cell geometry of period hardware.',license:'CC BY-SA 4.0',faces:[{label:'Thin 8×16',family:'Olivetti816',url:'https://raw.githubusercontent.com/retro-vault/font-vault/main/source/fonts/oldschool_olivettithin_8x16/Px437_OlivettiThin_8x16.ttf',format:'truetype'}],samples:[['OLIVETTI','SYSTEM READY'],['SCREEN','OBJECT INDEX / PAGE 01'],['FILE','OBS_19920119.DAT'],['COORD','LAT 34.1722  LON -103.3470']]},

{group:'STANDARDS / OPERATING ENVIRONMENTS',id:'dinish',name:'DINish',artist:'Playbeing · open interpretation of DIN 1451',story:'DIN 1451 grew out of German technical, transport and administrative lettering. DINish treats that standardized infrastructure as a living open family, including normal, condensed and expanded widths for actual information systems.',license:'SIL Open Font License 1.1',faces:[{label:'Regular',family:'DINishReg',url:'https://raw.githubusercontent.com/playbeing/dinish/main/fonts/woff2/DINish/DINish-Regular.woff2',format:'woff2'},{label:'Light',family:'DINishLight',url:'https://raw.githubusercontent.com/playbeing/dinish/main/fonts/woff2/DINish/DINish-Light.woff2',format:'woff2'},{label:'Bold',family:'DINishBold',url:'https://raw.githubusercontent.com/playbeing/dinish/main/fonts/woff2/DINish/DINish-Bold.woff2',format:'woff2'}],samples:[['TECHNICAL','BAUTEIL 0047 · PRÜFUNG'],['ROUTE','BERLIN 45 km →'],['DRAWING','M 1:20 · DIN · REV 03'],['SPATIAL','AZIMUTH 241.6°']]},
{group:'STANDARDS / OPERATING ENVIRONMENTS',id:'overpass',name:'Overpass',artist:'Delve Withrington / Red Hat · inspired by Highway Gothic',story:'A contemporary open family explicitly rooted in the U.S. highway-sign lineage. It takes lettering meant to survive speed, distance and weather and translates that visual logic into a broad digital system.',license:'SIL Open Font License 1.1',faces:[{label:'Light',family:'OverpassVF',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/overpass/Overpass%5Bwght%5D.ttf',format:'truetype',variation:"'wght' 300"},{label:'Regular',family:'OverpassVF',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/overpass/Overpass%5Bwght%5D.ttf',format:'truetype',variation:"'wght' 400"},{label:'Bold',family:'OverpassVF',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/overpass/Overpass%5Bwght%5D.ttf',format:'truetype',variation:"'wght' 700"}],samples:[['HIGHWAY','PORTALES  3 MILES →'],['WAYFINDING','OBSERVATORY · TERMINAL · ARCHIVE'],['LABEL','CELESTIAL OBJECT 0047'],['DATA','ALT +17.4° · AZ 241.6°']]},
{group:'STANDARDS / OPERATING ENVIRONMENTS',id:'ocra',name:'OCR-A',artist:'ANSI machine-reading standard · open digital implementation',story:'OCR-A was not drawn to look futuristic; it was standardized so optical character-recognition equipment could reliably read human-printed text. That collision between human legibility and machine certainty produced one of the clearest visual signatures of twentieth-century information processing.',license:'GNU GPL 3.0 · open / commercial-use compatible',faces:[{label:'Standard',family:'OCRA',url:'https://raw.githubusercontent.com/bcssupp0rt/ocrafont/main/ocra.ttf',format:'truetype'},{label:'Size II',family:'OCRAII',url:'https://raw.githubusercontent.com/bcssupp0rt/ocrafont/main/OCRAII.TTF',format:'truetype'},{label:'Size III',family:'OCRAIII',url:'https://raw.githubusercontent.com/bcssupp0rt/ocrafont/main/ocraIII.ttf',format:'truetype'},{label:'Size IV',family:'OCRAIV',url:'https://raw.githubusercontent.com/bcssupp0rt/ocrafont/main/ocraIV.ttf',format:'truetype'}],samples:[['MACHINE READ','0123456789 ABCDEFGHIJK'],['DOCUMENT','ACCOUNT 00471992'],['SCAN','PORTALES NM 88130'],['DATA','19920119 175700 MST']]},
{group:'STANDARDS / OPERATING ENVIRONMENTS',id:'courierprime',name:'Courier Prime',artist:'Alan Dague-Greene · Quote-Unquote Apps / John August',story:'Courier’s typewriter ancestry became a film-industry measuring system: a page of correctly formatted screenplay text roughly corresponds to screen time. Courier Prime was redrawn specifically to make that stubborn production standard more pleasant without breaking its practical geometry.',license:'SIL Open Font License 1.1',faces:[{label:'Regular',family:'CourierPrime',url:'https://raw.githubusercontent.com/quoteunquoteapps/CourierPrime/master/fonts/ttf/CourierPrime-Regular.ttf',format:'truetype'},{label:'Italic',family:'CourierPrimeItalic',url:'https://raw.githubusercontent.com/quoteunquoteapps/CourierPrime/master/fonts/ttf/CourierPrime-Italic.ttf',format:'truetype'},{label:'Bold',family:'CourierPrimeBold',url:'https://raw.githubusercontent.com/quoteunquoteapps/CourierPrime/master/fonts/ttf/CourierPrime-Bold.ttf',format:'truetype'}],samples:[['SCREENPLAY','EXT. OBSERVATORY — NIGHT'],['ACTION','The telescope slews toward the eastern horizon.'],['TIMECODE','SCENE 47 / 01:19:92 / 17:57'],['DIALOGUE','ANGE\nLook up.']]},
{group:'STANDARDS / OPERATING ENVIRONMENTS',id:'barlow',name:'Barlow',artist:'Jeremy Tribby',story:'A California public-space grotesk whose rounded forms draw on the state’s visual environment, including signs and vehicle lettering. It is a useful example of ordinary civic typography becoming a coherent contemporary family rather than a neutral default.',license:'SIL Open Font License 1.1',faces:[{label:'Light',family:'BarlowLight',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/barlow/Barlow-Light.ttf',format:'truetype'},{label:'Regular',family:'BarlowReg',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/barlow/Barlow-Regular.ttf',format:'truetype'},{label:'SemiBold',family:'BarlowSemi',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/barlow/Barlow-SemiBold.ttf',format:'truetype'}],samples:[['CALIFORNIA','LOS ANGELES · VENICE · PACIFIC'],['PUBLIC','TRANSIT / PARKING / ENTRY / EXIT'],['SPATIAL','SPATIAL PRESS'],['DATA','34.0195° N · 118.4912° W']]},

{group:'HISTORICAL RECONSTRUCTIONS',id:'imfellenglish',name:'IM FELL English',artist:'Igino Marini · after the Fell Types at Oxford',story:'A digital revival built from the seventeenth-century Fell Types associated with Oxford University Press. The project’s charm comes from preserving the irregular historical punch-and-print character instead of sanding it into a generic old-style serif.',license:'SIL Open Font License 1.1',faces:[{label:'Roman',family:'IMFellEnglish',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/imfellenglish/IMFeENrm28P.ttf',format:'truetype'},{label:'Italic',family:'IMFellEnglishIt',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/imfellenglish/IMFeENit28P.ttf',format:'truetype'}],samples:[['OXFORD','A Catalogue of the Heavens'],['IMPRINT','Printed at Oxford in the Year MDCLXXX'],['PROVENANCE','OBSERVED · RECORDED · PRESERVED'],['BODY','The surviving impression is not the punch itself, but evidence of its use.']]},
{group:'HISTORICAL RECONSTRUCTIONS',id:'ebgaramond',name:'EB Garamond',artist:'Georg Duffner + contributors · after Claude Garamont and Robert Granjon',story:'An open revival anchored in Renaissance type and the 1592 Egenolff-Berner specimen. It is useful here not because “Garamond is classic,” but because the digital family is an explicit reconstruction project built from surviving historical evidence.',license:'SIL Open Font License 1.1',faces:[{label:'Book',family:'EBGaramond',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/ebgaramond/EBGaramond%5Bwght%5D.ttf',format:'truetype',variation:"'wght' 400"},{label:'Dark',family:'EBGaramond',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/ebgaramond/EBGaramond%5Bwght%5D.ttf',format:'truetype',variation:"'wght' 700"},{label:'Italic',family:'EBGaramondIt',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/ebgaramond/EBGaramond-Italic%5Bwght%5D.ttf',format:'truetype',variation:"'wght' 400"}],samples:[['SPECIMEN','PARIS · ANTWERP · 1592'],['TITLE','The Form of a Printed Sky'],['TEXT','What survives can be measured, compared, and reconstructed.'],['DATE','19 JANUARY 1992']]},
{group:'HISTORICAL RECONSTRUCTIONS',id:'unifraktur',name:'UnifrakturMaguntia',artist:'j. “mach” wust · Fraktur revival',story:'A working digital Fraktur that treats historical German blackletter conventions as a typographic system, including contextual behavior rather than just gothic-looking outlines. It brings the grammar of old printed German into Unicode-era text.',license:'SIL Open Font License 1.1',faces:[{label:'Book',family:'Unifraktur',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/unifrakturmaguntia/UnifrakturMaguntia-Book.ttf',format:'truetype'}],samples:[['BLACKLETTER','Sternkarte und Himmelsbeobachtung'],['ARCHIVE','Beobachtet · Gedruckt · Bewahrt'],['DATE','19. Januar 1992'],['SPATIAL','Spatial Press']]},
{group:'HISTORICAL RECONSTRUCTIONS',id:'oldstandard',name:'Old Standard TT',artist:'Alexey Kryukov',story:'A reconstruction of the “Modern” serif vocabulary common in late-nineteenth and early-twentieth-century scholarly printing. Its particular value is academic texture: the kind of page where astronomy, classics, mathematics or philology once lived.',license:'SIL Open Font License 1.1',faces:[{label:'Regular',family:'OldStandard',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/oldstandardtt/OldStandard-Regular.ttf',format:'truetype'},{label:'Italic',family:'OldStandardIt',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/oldstandardtt/OldStandard-Italic.ttf',format:'truetype'},{label:'Bold',family:'OldStandardBold',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/oldstandardtt/OldStandard-Bold.ttf',format:'truetype'}],samples:[['MONOGRAPH','ASTRONOMICAL EPHEMERIDES'],['PLATE','Plate IV. — Positions at 17h 57m'],['TEXT','The apparent position is corrected for the observer’s locality.'],['FOOTNOTE','§ 47 · Fig. 12 · 1897']]},
{group:'HISTORICAL RECONSTRUCTIONS',id:'goudy1911',name:'Goudy Bookletter 1911',artist:'Barry Schwartz · after Frederic W. Goudy',story:'A digital interpretation of Goudy’s early-twentieth-century book-lettering world, based on the Kennerley lineage. It carries the slightly handmade authority of private-press typography rather than the polished anonymity of a contemporary book face.',license:'SIL Open Font License 1.1',faces:[{label:'1911',family:'Goudy1911',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/goudybookletter1911/GoudyBookletter1911.ttf',format:'truetype'}],samples:[['PRIVATE PRESS','A SMALL BOOK OF STARS'],['IMPRINT','Printed for Spatial Press · 1911 / 2026'],['TEXT','Every chart begins as a record of one place and one time.'],['NAME','Ruthful Josef Rotschopf']]},

{group:'GENERATIVE / PARAMETRIC TYPE ENGINES',id:'recursive',name:'Recursive',artist:'Arrow Type · Stephen Nixon',story:'A variable family deliberately built to move between mono and proportional, linear and casual, upright and slanted without swapping fonts. The design system behaves more like an interface with multiple independent controls than a conventional row of weights.',license:'SIL Open Font License 1.1',faces:[{label:'Linear Sans',family:'RecursiveVF',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/recursive/Recursive%5BCASL%2CCRSV%2CMONO%2Cslnt%2Cwght%5D.ttf',format:'truetype',variation:"'MONO' 0, 'CASL' 0, 'wght' 400, 'slnt' 0, 'CRSV' 0"},{label:'Casual',family:'RecursiveVF',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/recursive/Recursive%5BCASL%2CCRSV%2CMONO%2Cslnt%2Cwght%5D.ttf',format:'truetype',variation:"'MONO' 0, 'CASL' 1, 'wght' 500, 'slnt' 0, 'CRSV' .5"},{label:'Mono',family:'RecursiveVF',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/recursive/Recursive%5BCASL%2CCRSV%2CMONO%2Cslnt%2Cwght%5D.ttf',format:'truetype',variation:"'MONO' 1, 'CASL' 0, 'wght' 450, 'slnt' 0, 'CRSV' 0"},{label:'Casual italic mono',family:'RecursiveVF',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/recursive/Recursive%5BCASL%2CCRSV%2CMONO%2Cslnt%2Cwght%5D.ttf',format:'truetype',variation:"'MONO' 1, 'CASL' 1, 'wght' 650, 'slnt' -12, 'CRSV' 1"}],samples:[['VARIABLE','MONO ↔ SANS · LINEAR ↔ CASUAL'],['INTERFACE','OBJECT / TRACE / WITNESS / SOURCE'],['CODE','observer = {lat:34.1722, lon:-103.3470}'],['TITLE','The same family changes jobs.']]},
{group:'GENERATIVE / PARAMETRIC TYPE ENGINES',id:'sciencegothic',name:'Science Gothic',artist:'Thomas Phinney · Vassil Kateliev · Brandon Buerkle',story:'A revival-and-expansion of the Bank Gothic lineage turned into a multi-axis laboratory. Width, weight, contrast and slant can be adjusted separately, exposing parts of the design that ordinary font menus normally collapse together.',license:'SIL Open Font License 1.1',faces:[{label:'Square',family:'ScienceGothicVF',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/sciencegothic/ScienceGothic%5BCTRS%2Cslnt%2Cwdth%2Cwght%5D.ttf',format:'truetype',variation:"'wght' 500, 'wdth' 100, 'CTRS' 0, 'slnt' 0"},{label:'Condensed',family:'ScienceGothicVF',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/sciencegothic/ScienceGothic%5BCTRS%2Cslnt%2Cwdth%2Cwght%5D.ttf',format:'truetype',variation:"'wght' 600, 'wdth' 60, 'CTRS' 0, 'slnt' 0"},{label:'High contrast',family:'ScienceGothicVF',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/sciencegothic/ScienceGothic%5BCTRS%2Cslnt%2Cwdth%2Cwght%5D.ttf',format:'truetype',variation:"'wght' 500, 'wdth' 100, 'CTRS' 100, 'slnt' 0"},{label:'Slanted wide',family:'ScienceGothicVF',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/sciencegothic/ScienceGothic%5BCTRS%2Cslnt%2Cwdth%2Cwght%5D.ttf',format:'truetype',variation:"'wght' 700, 'wdth' 125, 'CTRS' 50, 'slnt' -12"}],samples:[['CONTROL PANEL','SCIENCE / POWER / RANGE'],['AXES','WIDTH · WEIGHT · CONTRAST · SLANT'],['OBJECT','ORBITER 07 · FLIGHT ARTICLE'],['DATA','RANGE 417.2 km']]},
{group:'GENERATIVE / PARAMETRIC TYPE ENGINES',id:'honk',name:'Honk',artist:'Ek Type / Google Fonts contributors',story:'A COLRv1 display font whose form changes through custom MORF and shadow-length axes. Instead of selecting a static decorative style, the user can continuously reshape the letter body and its dimensional color treatment.',license:'SIL Open Font License 1.1',faces:[{label:'Compact',family:'HonkVF',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/honk/Honk%5BMORF%2CSHLN%5D.ttf',format:'truetype',variation:"'MORF' 0, 'SHLN' 0"},{label:'Morph',family:'HonkVF',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/honk/Honk%5BMORF%2CSHLN%5D.ttf',format:'truetype',variation:"'MORF' 25, 'SHLN' 25"},{label:'Long shadow',family:'HonkVF',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/honk/Honk%5BMORF%2CSHLN%5D.ttf',format:'truetype',variation:"'MORF' 45, 'SHLN' 100"}],samples:[['COLOR','SPATIAL PRESS'],['AXES','MORPH + SHADOW'],['LABEL','CELESTIAL OBJECT 0047'],['FUN','SUN MOON STAR ORBIT']]},
{group:'GENERATIVE / PARAMETRIC TYPE ENGINES',id:'fraunces',name:'Fraunces',artist:'Phaedra Charles + Flavia Zimbardi / Undercase Type',story:'A variable old-style display family with unusually semantic-feeling controls: optical size, softness and a WONK axis alongside weight. It can move from disciplined editorial serif toward bulbous, eccentric display lettering without leaving one design space.',license:'SIL Open Font License 1.1',faces:[{label:'Sharp text',family:'FrauncesVF',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/fraunces/Fraunces%5BSOFT%2CWONK%2Copsz%2Cwght%5D.ttf',format:'truetype',variation:"'SOFT' 0, 'WONK' 0, 'opsz' 9, 'wght' 400"},{label:'Soft display',family:'FrauncesVF',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/fraunces/Fraunces%5BSOFT%2CWONK%2Copsz%2Cwght%5D.ttf',format:'truetype',variation:"'SOFT' 100, 'WONK' 0, 'opsz' 144, 'wght' 650"},{label:'Wonky',family:'FrauncesVF',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/fraunces/Fraunces%5BSOFT%2CWONK%2Copsz%2Cwght%5D.ttf',format:'truetype',variation:"'SOFT' 70, 'WONK' 1, 'opsz' 144, 'wght' 700"}],samples:[['DISPLAY','THE MOON AT 17:57'],['AXES','SOFT · WONK · OPTICAL SIZE'],['PRODUCT','A RECONSTRUCTED SKY'],['NAME','Ruthful Josef Rotschopf']]},
{group:'GENERATIVE / PARAMETRIC TYPE ENGINES',id:'datatype',name:'Datatype',artist:'Frank Tisellano',story:'A 2026 variable OpenType font that turns typed expressions into inline charts using ligature substitution—no JavaScript renderer required. Bar charts, sparklines and pies live inside the font, making typography itself a tiny data-visualization engine.',license:'SIL Open Font License 1.1',features:['liga','calt'],defaultFeatures:['liga','calt'],faces:[{label:'Regular',family:'DatatypeVF',url:'https://raw.githubusercontent.com/franktisellano/datatype/main/fonts/variable/Datatype%5Bwdth%2Cwght%5D.woff2',format:'woff2',variation:"'wdth' 100, 'wght' 400"},{label:'Condensed',family:'DatatypeVF',url:'https://raw.githubusercontent.com/franktisellano/datatype/main/fonts/variable/Datatype%5Bwdth%2Cwght%5D.woff2',format:'woff2',variation:"'wdth' 65, 'wght' 500"},{label:'Wide',family:'DatatypeVF',url:'https://raw.githubusercontent.com/franktisellano/datatype/main/fonts/variable/Datatype%5Bwdth%2Cwght%5D.woff2',format:'woff2',variation:"'wdth' 145, 'wght' 650"}],samples:[['BAR','{b:15,45,80,30,60,90,20}'],['SPARKLINE','{l:10,40,25,70,50,90,35,60}'],['PIE','{p:62}'],['PLAIN','SPATIAL PRESS · DATA INSIDE TYPE']]},

{group:'PHYSICAL LETTERING / COLOR / SIGNAGE',id:'tiltwarp',name:'Tilt Warp',artist:'Andy Clymer',story:'Born from physical sign lettering photographed around New York, then built so the letters can rotate through depth using XROT and YROT axes. The font treats dimensional sign perspective as something typographic software can control instead of a one-off illustration effect.',license:'SIL Open Font License 1.1',faces:[{label:'Front',family:'TiltWarpVF',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/tiltwarp/TiltWarp%5BXROT%2CYROT%5D.ttf',format:'truetype',variation:"'XROT' 0, 'YROT' 0"},{label:'Tilt left',family:'TiltWarpVF',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/tiltwarp/TiltWarp%5BXROT%2CYROT%5D.ttf',format:'truetype',variation:"'XROT' -25, 'YROT' 10"},{label:'Tilt up',family:'TiltWarpVF',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/tiltwarp/TiltWarp%5BXROT%2CYROT%5D.ttf',format:'truetype',variation:"'XROT' 10, 'YROT' 35"}],samples:[['SIGN','SPATIAL PRESS'],['STOREFRONT','CELESTIAL PRINTS · OPEN'],['ANGLE','X ROTATION / Y ROTATION'],['OBJECT','ORBITER 07']]},
{group:'PHYSICAL LETTERING / COLOR / SIGNAGE',id:'sticknobills',name:'Stick No Bills',artist:'Mooniak · for Stick No Bills poster gallery, Sri Lanka',story:'A stencil family tied to Sri Lankan public lettering and poster culture, with a project origin in the Stick No Bills gallery in Galle. Its visual logic belongs naturally to printing, transport and signage rather than to a generic “stencil font” category.',license:'SIL Open Font License 1.1',faces:[{label:'Light',family:'StickNoBillsVF',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/sticknobills/StickNoBills%5Bwght%5D.ttf',format:'truetype',variation:"'wght' 300"},{label:'Regular',family:'StickNoBillsVF',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/sticknobills/StickNoBills%5Bwght%5D.ttf',format:'truetype',variation:"'wght' 400"},{label:'ExtraBold',family:'StickNoBillsVF',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/sticknobills/StickNoBills%5Bwght%5D.ttf',format:'truetype',variation:"'wght' 800"}],samples:[['POSTER','STICK NO BILLS'],['TRANSPORT','COLOMBO · GALLE · MATARA'],['PRINT','PASTE · STENCIL · WALL · WEATHER'],['SPATIAL','SPATIAL PRESS']]},
{group:'PHYSICAL LETTERING / COLOR / SIGNAGE',id:'bungee',name:'Bungee',artist:'David Jonathan Ross',story:'Designed for crowded urban signs where words may need to run horizontally, vertically, inline or in stacked chromatic layers. Bungee treats sign construction as a family architecture, not merely as one loud display face.',license:'SIL Open Font License 1.1',faces:[{label:'Regular',family:'BungeeReg',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/bungee/Bungee-Regular.ttf',format:'truetype'},{label:'Inline',family:'BungeeInline',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/bungeeinline/BungeeInline-Regular.ttf',format:'truetype'}],samples:[['CITY SIGN','SPATIAL PRESS'],['STACK','SKY / SHOP / PRINT / DATA'],['VERTICAL','OBJECT 0047'],['LOCATION','VENICE · LOS ANGELES']]},
{group:'PHYSICAL LETTERING / COLOR / SIGNAGE',id:'bungeespice',name:'Bungee Spice',artist:'David Jonathan Ross + color-font collaborators',story:'Bungee’s sign-painting architecture translated into a COLRv1 color font with layered gradients and shading built into the glyphs. It is useful as a test of whether color can be typographic material rather than a CSS decoration applied afterward.',license:'SIL Open Font License 1.1',faces:[{label:'Color',family:'BungeeSpice',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/bungeespice/BungeeSpice-Regular.ttf',format:'truetype'}],samples:[['COLOR SIGN','SPATIAL PRESS'],['PRODUCT','ARRIVING LIGHT'],['OBJECT','SATURN · JUPITER · ISS'],['DATE','19 JANUARY 1992']]},
{group:'PHYSICAL LETTERING / COLOR / SIGNAGE',id:'avhershey',name:'AVHershey',artist:'Stewart C. Russell · after Dr. Allen V. Hershey’s 1967 vector fonts',story:'Hershey’s characters were digitized as coordinate strokes for vector devices at a U.S. government research lab in the 1960s. These OpenType conversions preserve the single-line plotter logic, making them natural for technical diagrams, pen plotters, CNC and drawing machines.',license:'CC0 / public-domain-compatible Hershey data lineage',faces:[{label:'Simplex Light',family:'AVHersheySL',url:'https://raw.githubusercontent.com/scruss/AVHershey-OTF/master/otf/AVHersheySimplexLight.otf',format:'opentype'},{label:'Simplex Medium',family:'AVHersheySM',url:'https://raw.githubusercontent.com/scruss/AVHershey-OTF/master/otf/AVHersheySimplexMedium.otf',format:'opentype'},{label:'Duplex Light',family:'AVHersheyDL',url:'https://raw.githubusercontent.com/scruss/AVHershey-OTF/master/otf/AVHersheyDuplexLight.otf',format:'opentype'},{label:'Complex Light',family:'AVHersheyCL',url:'https://raw.githubusercontent.com/scruss/AVHershey-OTF/master/otf/AVHersheyComplexLight.otf',format:'opentype'}],samples:[['PLOTTER','MOVE 10,20 · PEN DOWN · DRAW'],['TECHNICAL','N  E  S  W · ZENITH'],['DIAGRAM','SUN ——— EARTH ——— OBSERVER'],['LABEL','FIGURE 04 · SCALE 1:20']]},

{group:'DESIGNED FOR A SPECIFIC MEDIUM',id:'bitter',name:'Bitter',artist:'Sol Matas / Huerta Tipográfica',story:'A slab serif designed around reading on screens, especially where pixels and rendering make delicate details disappear. Its sturdy construction is a reminder that “book typography” and “screen typography” are different physical problems.',license:'SIL Open Font License 1.1',faces:[{label:'Light',family:'BitterVF',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/bitter/Bitter%5Bwght%5D.ttf',format:'truetype',variation:"'wght' 300"},{label:'Regular',family:'BitterVF',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/bitter/Bitter%5Bwght%5D.ttf',format:'truetype',variation:"'wght' 400"},{label:'Bold',family:'BitterVF',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/bitter/Bitter%5Bwght%5D.ttf',format:'truetype',variation:"'wght' 700"}],samples:[['SCREEN ARTICLE','What exactly was this universe, from here, at this moment?'],['BODY','A chart is both a calculation and a witness to one observer’s place in time.'],['CAPTION','Figure 12 · reconstructed horizon'],['LINK','READ THE EVIDENCE →']]},
{group:'DESIGNED FOR A SPECIFIC MEDIUM',id:'literata',name:'Literata',artist:'TypeTogether · originally for Google Play Books',story:'Commissioned for long-form digital reading, then expanded into a variable family with optical-size behavior. Its job was to make an ebook feel intentionally typeset across changing screens rather than like a paper face pasted onto a device.',license:'SIL Open Font License 1.1',faces:[{label:'Small text',family:'LiterataVF',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/literata/Literata%5Bopsz%2Cwght%5D.ttf',format:'truetype',variation:"'opsz' 7, 'wght' 400"},{label:'Book',family:'LiterataVF',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/literata/Literata%5Bopsz%2Cwght%5D.ttf',format:'truetype',variation:"'opsz' 12, 'wght' 400"},{label:'Display',family:'LiterataVF',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/literata/Literata%5Bopsz%2Cwght%5D.ttf',format:'truetype',variation:"'opsz' 72, 'wght' 650"}],samples:[['EBOOK','A RECONSTRUCTED ATLAS OF ONE MOMENT'],['BODY','The observer is not outside the universe being measured.'],['CHAPTER','III. Arriving Light'],['NOTE','Saved for later reading.']]},
{group:'DESIGNED FOR A SPECIFIC MEDIUM',id:'lexend',name:'Lexend',artist:'Bonnie Shaver-Troup + Thomas Jockin',story:'Lexend grew from research into how typographic spacing and form might affect reading performance. Whether or not one treats any single readability claim as universal, the project is valuable because it makes reading behavior itself the design brief.',license:'SIL Open Font License 1.1',faces:[{label:'Light',family:'LexendVF',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/lexend/Lexend%5Bwght%5D.ttf',format:'truetype',variation:"'wght' 300"},{label:'Regular',family:'LexendVF',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/lexend/Lexend%5Bwght%5D.ttf',format:'truetype',variation:"'wght' 400"},{label:'Bold',family:'LexendVF',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/lexend/Lexend%5Bwght%5D.ttf',format:'truetype',variation:"'wght' 700"}],samples:[['READ','The Moon was above the horizon at 5:57 PM.'],['INSTRUCTION','Choose a layer, then compare the evidence.'],['LABEL','OBSERVER LOCATION'],['DATA','34.1722° N · 103.3470° W']]},
{group:'DESIGNED FOR A SPECIFIC MEDIUM',id:'leaguegothic',name:'League Gothic',artist:'The League of Moveable Type · revival of Morris Fuller Benton’s Alternate Gothic',story:'A libre revival of early-twentieth-century jobbing/display type whose condensed proportions were made for headlines, posters and narrow spaces. It is a practical historical machine for fitting a lot of authority into very little width.',license:'SIL Open Font License 1.1',faces:[{label:'Condensed',family:'LeagueGothicVF',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/leaguegothic/LeagueGothic%5Bwdth%5D.ttf',format:'truetype',variation:"'wdth' 75"},{label:'Regular width',family:'LeagueGothicVF',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/leaguegothic/LeagueGothic%5Bwdth%5D.ttf',format:'truetype',variation:"'wdth' 100"}],samples:[['POSTER','THE SKY FROM HERE'],['HEADLINE','ONE PLACE · ONE TIME · ONE UNIVERSE'],['PRICE','$3 PDF · PRINTS SOON'],['OBJECT','INTERNATIONAL SPACE STATION']]},
{group:'DESIGNED FOR A SPECIFIC MEDIUM',id:'firacode',name:'Fira Code',artist:'Nikita Prokopov / tonsky',story:'A programming font that uses OpenType ligatures to turn multi-character operators into coherent symbols while preserving the underlying plain-text code. Its typography is therefore partly semantic: appearance changes to help a human parse a formal language.',license:'SIL Open Font License 1.1',features:['calt'],defaultFeatures:['calt'],faces:[{label:'Regular',family:'FiraCodeVF',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/firacode/FiraCode%5Bwght%5D.ttf',format:'truetype',variation:"'wght' 400"},{label:'Light',family:'FiraCodeVF',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/firacode/FiraCode%5Bwght%5D.ttf',format:'truetype',variation:"'wght' 300"},{label:'Bold',family:'FiraCodeVF',url:'https://raw.githubusercontent.com/google/fonts/main/ofl/firacode/FiraCode%5Bwght%5D.ttf',format:'truetype',variation:"'wght' 700"}],samples:[['OPERATORS','!= === => <= >= -> <- <=>'],['CODE','const observer = { lat: 34.1722, lon: -103.3470 };'],['LOGIC','exact && visible || reconstructed'],['COMMENT','// the type clarifies the language without changing the text']]}
