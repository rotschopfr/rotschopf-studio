<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ruthie Open Font Library — Batch 14</title><link rel="stylesheet" href="../app.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Truculenta&family=Grenze+Gotisch&family=MuseoModerno&family=Saira+Stencil+One&family=Rosario&family=BioRhyme&family=BioRhyme+Expanded&family=Bahiana&family=Bahianita&family=Barrio&family=Andada+Pro&family=Piazzolla&family=Gochi+Hand&display=swap">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Monoton&family=Monofett&family=Plaster&family=Oi&family=Ewert&family=Rye&family=Sancreek&family=Smokum&family=Diplomata&family=Diplomata+SC&family=Codystar&display=swap">
<style>.group-head{margin:28px 0 13px;padding:14px 4px 9px;border-bottom:1px solid var(--line)}.group-kicker{font:800 10px system-ui,-apple-system,sans-serif;letter-spacing:.16em;color:var(--blue)}.group-title{font:800 clamp(20px,5vw,32px) system-ui,-apple-system,sans-serif;margin-top:4px}.group-note{font:12px/1.45 system-ui,-apple-system,sans-serif;color:var(--muted);margin-top:5px;max-width:760px}.card{content-visibility:auto;contain-intrinsic-size:820px}.font-load.ok{color:#7ed9a3}.font-load.bad{color:#ff9a9a}</style></head>
<body><header><div class="kicker">RUTHIE OPEN FONT LIBRARY · BATCH 14</div><h1>Fifty words we hadn’t used yet</h1><div class="sub">50 candidates · fresh-vocabulary discovery pass · 166/250 already approved · all candidates commercially usable under OFL 1.1</div><nav class="nav" id="nav"></nav></header>
<div class="global"><div class="globalbox"><div class="control-label">THROW THE SAME TEXT AT ALL FIFTY</div><input id="global" type="text" placeholder="Type anything here…"><div class="range"><span>Display size</span><input id="size" type="range" min="22" max="76" value="34"><span id="sizeVal">34</span></div></div></div>
<main id="app"></main><pre id="exportBox" hidden></pre><div class="footer"><div class="footer-inner"><div class="status" id="status" aria-live="polite"></div><button class="copy" id="copy" type="button">COPY PICKS</button></div></div>
<script>
const G={A:'NEW FOUNDRY VEINS',B:'HUMAN SYSTEMS + PERSONAL ORIGINS',C:'VARIABLE / STRUCTURAL BEHAVIOR',D:'LAYERED + PROCESS LETTERING',E:'ECCENTRIC DISPLAY ARCHAEOLOGY'};
const groups={
[G.A]:{kicker:'FRESH SOURCE NAMES',note:'New source ecosystems reached with proper nouns and artifact vocabulary that had not been used in earlier search passes.'},
[G.B]:{kicker:'WHY DID THIS NEED TO EXIST?',note:'Language support, classroom use, handwriting, editorial constraints, and identity systems rather than a style checklist.'},
[G.C]:{kicker:'LETTERS AS SYSTEMS',note:'Families whose structure changes dramatically through width, geometry, modularity, or variable construction.'},
[G.D]:{kicker:'MATERIAL / PROCESS',note:'Fonts that expose outlines, shadowing, slicing, layering, holes, spray, or geometric construction as part of the drawing.'},
[G.E]:{kicker:'OLDER STRANGE DIGITAL SHELF',note:'Distinctive display families with strong visual fingerprints; useful as wildcard material rather than generic defaults.'}
};
const C=[
['A','truculenta','Truculenta','Ivan Castro + Eva Sanz · Omnibus-Type','Mid-century lettering pushed into an irregular three-axis superfamily; simultaneously period-adjacent and clearly contemporary.'],
['A','grenze-gotisch','Grenze Gotisch','Renata Polastri · Omnibus-Type','A deliberately peculiar Grenze branch that injects blackletter capitals and heightened dramatic details into a modern family.'],
['A','museomoderno','MuseoModerno','Marcela Romero + Héctor Gatti + Pablo Cosgaya','Built for the identity of Museo de Arte Moderno de Buenos Aires: a real institutional identity system rather than generic geometric styling.'],
['A','saira-stencil','Saira Stencil One','Héctor Gatti · Omnibus-Type','A stencil branch inside the immense Saira system; engineered as a separate construction rather than an effect slapped onto letters.'],
['A','rosario','Rosario','Héctor Gatti · Omnibus-Type','Classic proportions with unusually weak, soft endings; originally designed privately before growing into a publication-oriented family.'],
['A','biorhyme','BioRhyme','Aoife Mooney','A slab serif whose exaggerated width and generous spacing make rhythm and lettershape feel almost architectural.'],
['A','biorhyme-expanded','BioRhyme Expanded','Aoife Mooney','The widened sibling pushes BioRhyme into a much more environmental, sign-like register: same DNA, different physical footprint.'],
['A','bahiana','Bahiana','Omnibus-Type','A loose display face with hand-cut energy and irregularity; much closer to printed ephemera than a polished corporate alphabet.'],
['A','bahianita','Bahianita','Omnibus-Type','A thinner, more linear sibling of Bahiana that turns similar vernacular energy into a spindly, airy drawing system.'],
['A','barrio','Barrio','Sergio Jiménez + Omnibus-Type','An eccentric neighborhood-sign display face built from deliberately inconsistent forms and animated counters.'],

['B','andada-pro','Andada Pro','Carolina Giovagnoli · Huerta Tipográfica','Designed around Guaraní and other Indigenous-language needs in Latin America, including correct treatment of the saltillo/pusó as a real letter.'],
['B','piazzolla','Piazzolla','Juan Pablo del Peral · Huerta Tipográfica','Built to conserve space in press typography while keeping long text readable; compactness is part of the design problem, not a post-process squeeze.'],
['B','gochi-hand','Gochi Hand','Gochi Mendoza + Juan Pablo del Peral','A typographic interpretation of an ordinary teenage girl’s handwriting—specifically avoiding polished calligrapher mannerisms.'],
['B','alegreya-sans','Alegreya Sans','Juan Pablo del Peral · Huerta Tipográfica','The humanist sans sibling of a literary superfamily: designed to carry the rhythm and typographic depth of Alegreya into a sans construction.'],
['B','caladea','Caladea','Carolina Giovagnoli + Andrés Torresi','A compact friendly serif adapted from Cambo with new metrics and width—an example of a family being deliberately re-engineered for a different text environment.'],
['B','cambo','Cambo','Carolina Giovagnoli + Andrés Torresi','Latin lettering shaped by the contrast and ornament logic of Khmer writing, built specifically for Latin text appearing in Khmer contexts.'],
['B','epilogue','Epilogue','Tyler Finck · Etcetera Type Company','A variable grotesk with a broad practical range and distinctly authored terminals; useful enough for infrastructure without becoming anonymous.'],
['B','anybody','Anybody','Tyler Finck · Etcetera Type Company','A variable family whose width and weight extremes change the personality violently; it behaves more like a flexible drawing kit than a static workhorse.'],
['B','grandstander','Grandstander','Tyler Finck','A variable display family originally developed around expressive children’s-book lettering, retaining an illustrated voice at text scale.'],
['B','unbounded','Unbounded','NaN + Paratype team','A wide variable family with aggressively engineered curves and techno-cultural identity; useful when typography needs to occupy space rather than politely sit in it.'],

['C','bricolage','Bricolage Grotesque','Mathieu Triay','A variable grotesk assembled from disparate historical and contemporary influences—the name really does describe a construction method of recombination.'],
['C','syne','Syne','Lucas Descroix + Bonjour Monde','Originally commissioned for the Synesthésie art center; its family deliberately separates grotesque, mono, italic and extra display personalities.'],
['C','foldit','Foldit','Yifat Fischel + David Jonathan Ross','A variable display design built from folded ribbon-like layers; weight changes the apparent physical construction rather than just thickening strokes.'],
['C','kablammo','Kablammo','Vectro Type Foundry','A variable comic/explosive display system whose MORF axis changes the underlying skeleton and visual species of the letters.'],
['C','blaka','Blaka','Mans Greback / Arabic Type contributors','Dense modular display forms with hard internal geometry; more block system than conventional pen-derived alphabet.'],
['C','blaka-hollow','Blaka Hollow','Blaka project','The same broad construction turned into a hollow/layered system; excellent for cut paths, coloring, signs, and material experiments.'],
['C','blaka-ink','Blaka Ink','Blaka project','A rougher inked branch that makes fill behavior and texture part of the letterform itself.'],
['C','rubik-glitch','Rubik Glitch','NaN + Hubert & Fischer','Rubik rebuilt as signal failure: displaced fragments and broken continuity are encoded directly into each glyph.'],
['C','rubik-iso','Rubik Iso','NaN + Hubert & Fischer','An isometric construction branch that makes the alphabet read like tiny axonometric objects.'],
['C','rubik-maze','Rubik Maze','NaN + Hubert & Fischer','Letters redrawn as maze-like continuous structures; legibility becomes a path-finding problem.'],

['D','rubik-microbe','Rubik Microbe','NaN + Hubert & Fischer','A cellular/blob construction where counters and edges feel grown rather than drafted.'],
['D','rubik-pixels','Rubik Pixels','NaN + Hubert & Fischer','Rubik translated into a coarse pixel lattice while preserving surprising amounts of its original silhouette.'],
['D','rubik-spray','Rubik Spray Paint','NaN + Hubert & Fischer','Letterforms expressed as sprayed particle fields; a reproduction process becomes the drawing language.'],
['D','rubik-vinyl','Rubik Vinyl','NaN + Hubert & Fischer','Concentric groove-like structure turns each glyph into something halfway between lettering and a cut physical surface.'],
['D','rubik-burned','Rubik Burned','NaN + Hubert & Fischer','A scorched / open-edge treatment encoded as a family rather than a Photoshop texture.'],
['D','rubik-beastly','Rubik Beastly','NaN + Hubert & Fischer','An intentionally overgrown ornamental mutation of Rubik with dramatic contour events and unstable texture.'],
['D','londrina-outline','Londrina Outline','Marcelo Magalhães','Brazilian poster/sign energy reduced to contour only; immediately useful as a colorable or layered vector source.'],
['D','londrina-shadow','Londrina Shadow','Marcelo Magalhães','The same vernacular skeleton carrying its own offset depth/shadow construction.'],
['D','londrina-sketch','Londrina Sketch','Marcelo Magalhães','A deliberately rough hand-rendered branch where incomplete texture survives inside the digital family.'],
['D','monoton','Monoton','Vernon Adams','A multi-line display face inspired by metalpress / deco display construction; each glyph already behaves like layered tubing or routed channels.'],

['E','monofett','Monofett','Vernon Adams','Ultra-heavy connected display shapes whose internal counter logic is almost pictographic.'],
['E','plaster','Plaster','Sorkin Type','A hard geometric display alphabet with cutout forms that read like molded signage or routed panels.'],
['E','oi','Oi','Kostas Bartsokas','A huge reverse-contrast display face with deliberately absurd mass distribution; difficult to mistake for anything else at ten meters.'],
['E','ewert','Ewert','Johan Kallas + Mihkel Virkus','A decorative display design with strong carnival / mechanical ornament DNA and unusually shaped inline interruptions.'],
['E','rye','Rye','Nicole Fally','A poster-sized slab display family with exaggerated frontier-showbill structure; useful when the artifact needs to announce its historical fiction openly.'],
['E','sancreek','Sancreek','Vernon Adams','A narrow decorative display face built around bifurcation and wood-type-like detailing rather than ordinary stroke contrast.'],
['E','smokum','Smokum','Astigmatic','A compressed slab display face with extreme top/bottom detailing; more object-label than paragraph alphabet.'],
['E','diplomata','Diplomata','Eduardo Tunni','A high-contrast inline display face with ornamental separation baked into the strokes.'],
['E','diplomata-sc','Diplomata SC','Eduardo Tunni','The small-cap branch changes the texture into a dense field of monumental miniatures.'],
['E','codystar','Codystar','Neapolitan','An extremely light dotted display family that reads like bulbs, perforations, punched marks, or sparse illuminated points.']
];
const famMap={
'Truculenta':'Truculenta','Grenze Gotisch':'Grenze Gotisch','MuseoModerno':'MuseoModerno','Saira Stencil One':'Saira Stencil One','Rosario':'Rosario','BioRhyme':'BioRhyme','BioRhyme Expanded':'BioRhyme Expanded','Bahiana':'Bahiana','Bahianita':'Bahianita','Barrio':'Barrio','Andada Pro':'Andada Pro','Piazzolla':'Piazzolla','Gochi Hand':'Gochi Hand','Alegreya Sans':'Alegreya Sans','Caladea':'Caladea','Cambo':'Cambo','Epilogue':'Epilogue','Anybody':'Anybody','Grandstander':'Grandstander','Unbounded':'Unbounded','Bricolage Grotesque':'Bricolage Grotesque','Syne':'Syne','Foldit':'Foldit','Kablammo':'Kablammo','Blaka':'Blaka','Blaka Hollow':'Blaka Hollow','Blaka Ink':'Blaka Ink','Rubik Glitch':'Rubik Glitch','Rubik Iso':'Rubik Iso','Rubik Maze':'Rubik Maze','Rubik Microbe':'Rubik Microbe','Rubik Pixels':'Rubik Pixels','Rubik Spray Paint':'Rubik Spray Paint','Rubik Vinyl':'Rubik Vinyl','Rubik Burned':'Rubik Burned','Rubik Beastly':'Rubik Beastly','Londrina Outline':'Londrina Outline','Londrina Shadow':'Londrina Shadow','Londrina Sketch':'Londrina Sketch','Monoton':'Monoton','Monofett':'Monofett','Plaster':'Plaster','Oi':'Oi','Ewert':'Ewert','Rye':'Rye','Sancreek':'Sancreek','Smokum':'Smokum','Diplomata':'Diplomata','Diplomata SC':'Diplomata SC','Codystar':'Codystar'};
const samples=[['NAME','RUTHFUL JOSEF ROTSCHOPF'],['SPATIAL','Spatial Press — The sky. The vantage. The view.'],['DATA','N E S W · 34.1722° N · 103.3470° W · 05:57 PM'],['HISTORY','1873 · 1939 · 1965 · 1979 · 1994 · 2026'],['GLYPHS','ABCDEFGHIJKLM NOPQRSTUVWXYZ · abcdefghijklm nopqrstuvwxyz · 0123456789'],['BODY','A useful type library should hold both infrastructure and trouble. Some faces need to disappear into the work; others should make the material itself visible.']];
const KEY='ruthie-open-font-library-b14'; let state={}; try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const app=document.querySelector('#app'),nav=document.querySelector('#nav'),status=document.querySelector('#status'),exportBox=document.querySelector('#exportBox');
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));updateStatus()};
const ensure=(id,name)=>state[id]||(state[id]={vote:'',face:'Regular',features:[],notes:'',name});
function updateStatus(msg){if(msg){status.textContent=msg;return}const d=C.filter(x=>ensure(x[1],x[2]).vote).length;status.textContent=`${d}/50 decided · 166/250 already approved`;}
let last=''; C.forEach((x,i)=>{const [g,id,name,artist,story]=x;if(G[g]!==last){const m=groups[G[g]],h=document.createElement('div');h.className='group-head';h.innerHTML=`<div class="group-kicker">${m.kicker}</div><div class="group-title">${G[g]}</div><div class="group-note">${m.note}</div>`;app.append(h);last=G[g];}
const s=ensure(id,name),a=document.createElement('a');a.href='#'+id;a.textContent=`${String(i+1).padStart(2,'0')} ${name}`;nav.append(a);
const c=document.createElement('section');c.className='card';c.id=id;c.innerHTML=`<div class="head"><div class="num">${String(i+1).padStart(2,'0')}</div><div><h2>${esc(name)}</h2><div class="artist">${esc(artist)}</div></div></div><p class="story">${esc(story)}</p><div class="license">SIL Open Font License 1.1 · commercially usable · Google Fonts/upstream project</div><div class="controls"><div class="font-load" aria-live="polite">checking live type…</div></div><div class="samples"></div><textarea class="notes" placeholder="Optional note…">${esc(s.notes||'')}</textarea><div class="decision-wrap"><div class="decision-label">KEEP THIS IN THE LIBRARY?</div><div class="votes"></div></div>`;
const fam=famMap[name],box=c.querySelector('.samples');box.style.fontFamily=`'${fam}'`;samples.forEach(([lab,text])=>{const d=document.createElement('div');d.className='sample'+(lab==='BODY'?' body':'');d.innerHTML=`<div class="sample-label">${lab}</div><div class="sample-text" contenteditable="true" spellcheck="false">${esc(text)}</div>`;box.append(d)});
const badge=c.querySelector('.font-load');document.fonts.load(`32px "${fam}"`,'Spatial Press').then(r=>{badge.textContent=r.length?'font loaded ✓':'font failed to load';badge.className='font-load '+(r.length?'ok':'bad')}).catch(()=>{badge.textContent='font failed to load';badge.className='font-load bad'});
c.querySelector('.notes').addEventListener('input',e=>{s.notes=e.target.value;save()});const votes=c.querySelector('.votes');['YES','NO'].forEach(v=>{const b=document.createElement('button');b.type='button';b.className='pill'+(s.vote===v?' active':'');b.textContent=v;b.onclick=()=>{s.vote=v;votes.querySelectorAll('.pill').forEach(z=>z.classList.remove('active'));b.classList.add('active');save()};votes.append(b)});app.append(c)});
document.querySelector('#global').addEventListener('input',e=>{if(!e.target.value)return;document.querySelectorAll('.sample:not(.body) .sample-text').forEach(x=>x.textContent=e.target.value)});document.querySelector('#size').addEventListener('input',e=>{document.documentElement.style.setProperty('--size',e.target.value+'px');document.querySelector('#sizeVal').textContent=e.target.value});
document.querySelector('#copy').onclick=async()=>{document.querySelectorAll('.card').forEach(c=>ensure(c.id,c.querySelector('h2').textContent).notes=c.querySelector('.notes').value);save();const payload={batch:14,picks:C.map((x,i)=>{const s=ensure(x[1],x[2]);return{number:i+1,name:x[2],vote:s.vote,face:'Regular',features:[],notes:s.notes||''}})};const text=JSON.stringify(payload,null,2);exportBox.textContent=text;try{await navigator.clipboard.writeText(text);exportBox.hidden=true;updateStatus('Copied ✓');setTimeout(()=>updateStatus(),4500)}catch(e){exportBox.hidden=false;updateStatus('Copy blocked — payload shown below');exportBox.scrollIntoView({behavior:'smooth'})}};updateStatus();
</script></body></html>
