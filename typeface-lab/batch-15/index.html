<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ruthie Open Font Library — Batch 15</title><link rel="stylesheet" href="../app.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron&family=Space+Mono&family=Space+Grotesk&family=Geostar&family=Geostar+Fill&family=Stardos+Stencil&family=Astloch&family=Atomic+Age&family=Rubik+Moonrocks&family=Moon+Dance&family=Nova+Cut&family=Nova+Flat&family=Nova+Mono&family=Nova+Oval&family=Nova+Round&family=Nova+Script&family=Nova+Slim&family=Nova+Square&family=Audiowide&family=Michroma&family=Oxanium&family=Exo&family=Exo+2&family=Electrolize&family=Quantico&family=Rajdhani&family=Aldrich&family=Iceland&family=Syncopate&family=Jura&family=Tektur&family=Share+Tech&family=Share+Tech+Mono&family=Tomorrow&family=Turret+Road&family=Wallpoet&family=Black+Ops+One&family=Bruno+Ace&family=Bruno+Ace+SC&family=Goldman&family=Anta&family=Kode+Mono&family=Major+Mono+Display&family=Silkscreen&family=Press+Start+2P&family=Megrim&family=Rationale&family=Zen+Dots&family=Zen+Tokyo+Zoo&family=Chakra+Petch&display=swap"><style>.group-head{margin:28px 0 13px;padding:14px 4px 9px;border-bottom:1px solid var(--line)}.group-kicker{font:800 10px system-ui,-apple-system,sans-serif;letter-spacing:.16em;color:var(--blue)}.group-title{font:800 clamp(20px,5vw,32px) system-ui,-apple-system,sans-serif;margin-top:4px}.group-note{font:12px/1.45 system-ui,-apple-system,sans-serif;color:var(--muted);margin-top:5px;max-width:760px}.card{content-visibility:auto;contain-intrinsic-size:760px}.font-load.ok{color:#7ed9a3}.font-load.bad{color:#ff9a9a}</style></head><body><header><div class="kicker">RUTHIE OPEN FONT LIBRARY · BATCH 15</div><h1>Stars, sky, orbit, signal</h1><div class="sub">50 sky-specific candidates · 211/250 already approved · exceeding 250 is explicitly welcome · OFL/open-font review set</div><nav class="nav" id="nav"></nav></header><div class="global"><div class="globalbox"><div class="control-label">THROW THE SAME TEXT AT ALL FIFTY</div><input id="global" type="text" placeholder="Type anything here…"><div class="range"><span>Display size</span><input id="size" type="range" min="22" max="82" value="36"><span id="sizeVal">36</span></div></div></div><main id="app"></main><pre id="exportBox" hidden></pre><div class="footer"><div class="footer-inner"><div class="status" id="status" aria-live="polite"></div><button class="copy" id="copy" type="button">COPY PICKS</button></div></div><script>
const groups={
'DIRECT CELESTIAL':{k:'NAMES THAT ALREADY POINT UP',n:'Explicit stars, orbit, moon, nova, atomic-age and cosmic naming. Useful when the typography can be overtly celestial.'},
'MISSION + INSTRUMENT':{k:'TECHNICAL SKY',n:'Faces that feel at home on spacecraft labels, observatory controls, plotted coordinates, instrument readouts and mission documentation.'},
'SIGNAL + TELEMETRY':{k:'DATA IN MOTION',n:'Compressed, monospaced, modular and display-system voices for telemetry, ephemerides, tracking, acquisition and technical overlays.'},
'FUTURE SKY':{k:'SPECULATIVE CELESTIAL',n:'More expressive sci-fi and geometric faces for spacecraft names, generated labels, star maps and atmospheric product variants.'},
'NIGHT-SKY WILDCARDS':{k:'LESS LITERAL',n:'Faces that are not astronomy fonts by definition but produce useful star-map, nocturnal, luminous, or strange-sky energy.'}
};
const data=[
['DIRECT CELESTIAL','Orbitron','Orbital display geometry; almost impossible not to read as spacecraft, instruments or mission identity.'],['DIRECT CELESTIAL','Space Mono','Monospaced but soft enough for captions and coordinates rather than only code.'],['DIRECT CELESTIAL','Space Grotesk','A broad, practical space-named grotesk that can carry ordinary interface text without losing its project association.'],['DIRECT CELESTIAL','Geostar','Open starburst geometry built straight into the glyphs.'],['DIRECT CELESTIAL','Geostar Fill','The filled sibling turns the same star-cut construction into a much denser display object.'],['DIRECT CELESTIAL','Stardos Stencil','A literal star-named stencil family with strong technical-label potential.'],['DIRECT CELESTIAL','Astloch','Calligraphic blackletter weirdness with an astronomical name and occult-chart energy.'],['DIRECT CELESTIAL','Atomic Age','Mid-century atomic/futurist display language that sits beautifully beside space-race imagery.'],['DIRECT CELESTIAL','Rubik Moonrocks','A craggy lunar-surface mutation with obvious moon-product potential.'],['DIRECT CELESTIAL','Moon Dance','A loose handwritten counterpoint for poetic lunar copy.'],['DIRECT CELESTIAL','Nova Cut','One of the Nova family’s sharply cut constructions.'],['DIRECT CELESTIAL','Nova Flat','A flattened geometric Nova branch.'],['DIRECT CELESTIAL','Nova Mono','The technical monospaced Nova sibling.'],['DIRECT CELESTIAL','Nova Oval','An ovalized branch that reads like instrument-panel lettering.'],['DIRECT CELESTIAL','Nova Round','A softer rounded branch for friendlier celestial interfaces.'],['DIRECT CELESTIAL','Nova Script','The handwriting branch of the Nova family.'],['DIRECT CELESTIAL','Nova Slim','A narrow celestial-label voice.'],['DIRECT CELESTIAL','Nova Square','The most panel-like Nova sibling.'],
['MISSION + INSTRUMENT','Audiowide','Wide electronic forms suited to equipment names and spacecraft identifiers.'],['MISSION + INSTRUMENT','Michroma','An austere geometric display face with a very 20th-century-future silhouette.'],['MISSION + INSTRUMENT','Oxanium','Angular technical geometry with enough range for UI and labels.'],['MISSION + INSTRUMENT','Exo','A large techno family that can shift between text and spacecraft-display personality.'],['MISSION + INSTRUMENT','Exo 2','A more refined successor with excellent technical-interface utility.'],['MISSION + INSTRUMENT','Electrolize','Compact electronic-industrial proportions that work well for small labels.'],['MISSION + INSTRUMENT','Quantico','Military/technical construction with strong mission-document character.'],['MISSION + INSTRUMENT','Rajdhani','Condensed modular proportions useful for dense readout panels.'],['MISSION + INSTRUMENT','Aldrich','Squared, engineered forms that feel like molded instrument legends.'],['MISSION + INSTRUMENT','Iceland','Thin square geometry with vintage electronic-display energy.'],['MISSION + INSTRUMENT','Syncopate','Very wide caps with a polished aerospace-branding feel.'],['MISSION + INSTRUMENT','Jura','Humanized geometric technical text; useful where instrument labels still need warmth.'],
['SIGNAL + TELEMETRY','Tektur','A variable techno family with strong panel / telemetry texture.'],['SIGNAL + TELEMETRY','Share Tech','Purposefully technical but less anonymous than a default sans.'],['SIGNAL + TELEMETRY','Share Tech Mono','The monospaced companion for coordinates, timestamps and readouts.'],['SIGNAL + TELEMETRY','Tomorrow','A modular family that looks good in stacked data labels and near-future dashboards.'],['SIGNAL + TELEMETRY','Turret Road','Squared display forms with a hardware-panel cadence.'],['SIGNAL + TELEMETRY','Wallpoet','Segmented, stencil-like geometry that feels cut from an interface plate.'],['SIGNAL + TELEMETRY','Black Ops One','Heavy military-display forms for object IDs and mission marks.'],['SIGNAL + TELEMETRY','Bruno Ace','Wide futuristic lettering with strong vehicle-name energy.'],['SIGNAL + TELEMETRY','Bruno Ace SC','Small-cap companion for dense uppercase labeling systems.'],['SIGNAL + TELEMETRY','Goldman','Broad techno curves with clear display hierarchy.'],
['FUTURE SKY','Anta','An angular futuristic sans with unusually carved joins.'],['FUTURE SKY','Kode Mono','A modern mono that feels technical without cosplay.'],['FUTURE SKY','Major Mono Display','A sparse display mono with star-chart caption potential.'],['FUTURE SKY','Silkscreen','Pixel-grid lettering suited to tiny onboard-screen simulations.'],['FUTURE SKY','Press Start 2P','Hard bitmap structure for historical-digital sky interfaces.'],['FUTURE SKY','Megrim','Extremely thin geometric strokes; nearly diagrammatic at large sizes.'],['FUTURE SKY','Rationale','Rounded sci-fi geometry with a 1960s/70s speculative-future feel.'],['FUTURE SKY','Zen Dots','Dot-based modular display forms that can echo stars, pixels or tracking points.'],
['NIGHT-SKY WILDCARDS','Zen Tokyo Zoo','Dense vertical display construction with weird luminous-sign energy.'],['NIGHT-SKY WILDCARDS','Chakra Petch','Thai/Latin techno family with sharp terminals and excellent compact label behavior.']
];
const families=new Set(data.map(x=>x[1])); const app=document.querySelector('#app'),nav=document.querySelector('#nav'),status=document.querySelector('#status'),exportBox=document.querySelector('#exportBox');const KEY='ruthie-open-font-library-b15';let state={};try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function ensure(i){return state[i]||(state[i]={vote:'',face:'Regular',features:[],notes:''})}function save(){localStorage.setItem(KEY,JSON.stringify(state));update()}function update(msg){if(msg){status.textContent=msg;return}const d=data.filter((_,i)=>ensure(i).vote).length;status.textContent=`${d}/50 decided · 211 already approved · 250 is not a ceiling`}
let last='';data.forEach((o,i)=>{const [g,name,story]=o;if(g!==last){const h=document.createElement('div');h.className='group-head';h.innerHTML=`<div class="group-kicker">${groups[g].k}</div><div class="group-title">${g}</div><div class="group-note">${groups[g].n}</div>`;app.append(h);last=g}const a=document.createElement('a');a.href='#f'+i;a.textContent=`${String(i+1).padStart(2,'0')} ${name}`;nav.append(a);const s=ensure(i),c=document.createElement('section');c.className='card';c.id='f'+i;c.innerHTML=`<div class="head"><div class="num">${String(i+1).padStart(2,'0')}</div><div><h2>${esc(name)}</h2><div class="artist">Google Fonts / open-font source</div></div></div><p class="story">${esc(story)}</p><div class="license">SIL Open Font License 1.1</div><div class="font-load">checking type…</div><div class="samples" style="font-family:'${esc(name)}'"><div class="sample"><div class="sample-label">SKY</div><div class="sample-text" contenteditable="true">SPATIAL PRESS · LOCAL SKY · ARRIVING LIGHT</div></div><div class="sample"><div class="sample-label">COORDINATES</div><div class="sample-text" contenteditable="true">34.1722° N · 103.3470° W · 05:57 PM</div></div><div class="sample"><div class="sample-label">OBJECTS</div><div class="sample-text" contenteditable="true">SUN · MOON · MARS · VENUS · SATURN · ISS</div></div><div class="sample"><div class="sample-label">MISSION</div><div class="sample-text" contenteditable="true">ORBIT 07 · ACQUISITION · AZ 241.8° · ALT +32.4°</div></div></div><textarea class="notes" placeholder="Optional note…">${esc(s.notes||'')}</textarea><div class="decision-wrap"><div class="decision-label">KEEP THIS IN THE LIBRARY?</div><div class="votes"></div></div>`;document.fonts.load(`32px "${name}"`,'SPATIAL PRESS').then(found=>{const b=c.querySelector('.font-load'),ok=found&&found.length;b.textContent=ok?'font loaded ✓':'font failed to load';b.className='font-load '+(ok?'ok':'bad')});c.querySelector('.notes').oninput=e=>{s.notes=e.target.value;save()};['YES','NO'].forEach(v=>{const b=document.createElement('button');b.type='button';b.className='pill'+(s.vote===v?' active':'');b.textContent=v;b.onclick=()=>{s.vote=v;c.querySelectorAll('.votes .pill').forEach(x=>x.classList.remove('active'));b.classList.add('active');save()};c.querySelector('.votes').append(b)});app.append(c)});
document.querySelector('#global').oninput=e=>{if(e.target.value)document.querySelectorAll('.sample-text').forEach(x=>x.textContent=e.target.value)};document.querySelector('#size').oninput=e=>{document.documentElement.style.setProperty('--size',e.target.value+'px');document.querySelector('#sizeVal').textContent=e.target.value};document.querySelector('#copy').onclick=async()=>{document.querySelectorAll('.card').forEach((c,i)=>ensure(i).notes=c.querySelector('.notes').value);save();const payload={batch:15,picks:data.map((o,i)=>({number:i+1,name:o[1],vote:ensure(i).vote,face:'Regular',features:[],notes:ensure(i).notes||''}))};const text=JSON.stringify(payload,null,2);exportBox.textContent=text;try{await navigator.clipboard.writeText(text);exportBox.hidden=true;update('Copied ✓');setTimeout(()=>update(),4000)}catch(e){exportBox.hidden=false;update('Copy blocked — payload shown below')}};update();
</script></body></html>
