<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ruthie Font Library — Parametric Weirdness Lab</title><style>:root{--bg:#071122;--panel:#0c1930;--ink:#f4f7ff;--muted:#92a6c7;--line:#263e63;--blue:#b8d5ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif}header{position:sticky;top:0;z-index:5;padding:16px;background:#071122f2;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}h1{margin:2px 0 5px;font-size:24px}.k{font:800 10px system-ui;letter-spacing:.15em;color:var(--blue)}.sub{font:12px/1.45 system-ui;color:var(--muted)}main{max-width:1050px;margin:auto;padding:15px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:18px}h2{font-size:27px;margin:0}.story{font:12px/1.45 system-ui;color:var(--muted);margin:6px 0 12px}.live{background:#061222;border:1px solid #1e3455;border-radius:12px;padding:12px;font-size:clamp(34px,9vw,82px);line-height:1.05;min-height:112px;overflow-wrap:anywhere}.axes{display:grid;gap:8px;margin-top:12px}.axis{display:grid;grid-template-columns:88px 1fr 55px;gap:8px;align-items:center;font:10px system-ui;color:var(--muted)}input[type=range]{width:100%}.presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.presets button{background:#10223d;color:var(--ink);border:1px solid #304b70;border-radius:999px;padding:7px 9px}.status{font:10px system-ui;color:var(--muted);margin-top:8px}.ok{color:#9be9b1}.bad{color:#ff9aa5}.edit{width:100%;margin-top:9px;background:#061222;border:1px solid var(--line);color:var(--ink);padding:8px;border-radius:9px}
@font-face{font-family:Wavefont;src:url('https://raw.githubusercontent.com/dy/wavefont/master/fonts/Wavefont%5BROND%2CYELA%2Cwght%5D.woff2')}@font-face{font-family:Recursive;src:url('https://raw.githubusercontent.com/google/fonts/main/ofl/recursive/Recursive%5BCASL%2CCRSV%2CMONO%2Cslnt%2Cwght%5D.ttf')}@font-face{font-family:Fraunces;src:url('https://raw.githubusercontent.com/google/fonts/main/ofl/fraunces/Fraunces%5BSOFT%2CWONK%2Copsz%2Cwght%5D.ttf')}@font-face{font-family:TiltWarp;src:url('https://raw.githubusercontent.com/google/fonts/main/ofl/tiltwarp/TiltWarp%5BXROT%2CYROT%5D.ttf')}@font-face{font-family:SixtyfourC;src:url('https://raw.githubusercontent.com/jenskutilek/homecomputer-fonts/main/Sixtyfour/fonts/variable/SixtyfourConvergence%5BBLED%2CSCAN%2CXELA%2CYELA%5D.ttf')}@font-face{font-family:Workbench;src:url('https://raw.githubusercontent.com/jenskutilek/homecomputer-fonts/main/Workbench/fonts/variable/Workbench%5BBLED%2CSCAN%5D.ttf')}@font-face{font-family:Handjet;src:url('https://raw.githubusercontent.com/rosettatype/handjet/master/fonts/Handjet%5BELGR%2CELSH%2Cwght%5D.woff2')}@font-face{font-family:Tiny5;src:url('https://raw.githubusercontent.com/Gissio/font_Tiny5/main/fonts/variable/Tiny5%5BBLED%2CJITT%2CROND%2Cwdth%2Cwght%5D.ttf')}@font-face{font-family:Nabla;src:url('https://raw.githubusercontent.com/google/fonts/main/ofl/nabla/Nabla%5BEDPT%2CEHLT%5D.ttf')}@font-face{font-family:Honk;src:url('https://raw.githubusercontent.com/google/fonts/main/ofl/honk/Honk%5BMORF%2CSHLN%5D.ttf')}@font-face{font-family:Kablammo;src:url('https://raw.githubusercontent.com/Vectro-Type-Foundry/kablammo/main/fonts/variable/Kablammo%5BMORF%5D.ttf')}@font-face{font-family:Kalnia;src:url('https://raw.githubusercontent.com/fridamedrano/Kalnia-Glaze/main/fonts/variable/KalniaGlaze%5Bwdth%2Cwght%5D.ttf')}</style></head><body><header><div class=k>RUTHIE OPEN FONT LIBRARY · WEIRD FONT LAB 02</div><h1>Fonts with knobs</h1><div class=sub>Approved fonts whose letterforms mutate through real variable axes. Every slider edits <code>font-variation-settings</code> directly. Presets are intentionally extreme so the design space is obvious.</div></header><main id=app></main><script>
const F=[
{name:'Wavefont',family:'Wavefont',text:'abcdefGHIJKLMNOPQRSTUVWXYZ',story:'Data bars are glyphs; weight changes bar width, ROND changes the bar geometry, YELA moves the baseline/alignment.',axes:[['wght',1,1000,400,1],['ROND',0,100,100,1],['YELA',-100,100,-100,1]],p:[['Hard bottom',{'wght':350,'ROND':0,'YELA':-100}],['Round center',{'wght':500,'ROND':100,'YELA':0}],['Heavy top',{'wght':850,'ROND':20,'YELA':100}]]},
{name:'Recursive',family:'Recursive',text:'observer = { sky: true }',story:'Proportional↔mono, linear↔casual, weight, slant and cursive behavior coexist in one design space.',axes:[['MONO',0,1,0,.01],['CASL',0,1,0,.01],['wght',300,1000,400,10],['slnt',-15,0,0,.5],['CRSV',0,1,.5,.5]],p:[['Linear sans',{'MONO':0,'CASL':0,'wght':400,'slnt':0,'CRSV':0}],['Casual mono',{'MONO':1,'CASL':1,'wght':650,'slnt':-12,'CRSV':1}]]},
{name:'Fraunces',family:'Fraunces',text:'Arriving Light',story:'SOFT and WONK are unusually semantic-feeling axes layered on weight and optical size.',axes:[['SOFT',0,100,0,1],['WONK',0,1,0,1],['opsz',9,144,72,1],['wght',100,900,500,10]],p:[['Sharp text',{'SOFT':0,'WONK':0,'opsz':9,'wght':400}],['Soft display',{'SOFT':100,'WONK':0,'opsz':144,'wght':650}],['Maximum wonk',{'SOFT':75,'WONK':1,'opsz':144,'wght':750}]]},
{name:'Tilt Warp',family:'TiltWarp',text:'SPATIAL PRESS',story:'The font literally rotates dimensional sign forms around X and Y axes.',axes:[['XROT',-45,45,0,1],['YROT',-45,45,0,1]],p:[['Front',{'XROT':0,'YROT':0}],['Peel left',{'XROT':-40,'YROT':18}],['Peel up',{'XROT':15,'YROT':42}]]},
{name:'Sixtyfour Convergence',family:'SixtyfourC',text:'READY 17:57',story:'CRT physics as font axes: pixel bleed, scanlines, and RGB element misalignment.',axes:[['BLED',0,100,15,1],['SCAN',-53,100,0,1],['XELA',-100,100,0,1],['YELA',-100,100,0,1]],p:[['Clean',{'BLED':0,'SCAN':0,'XELA':0,'YELA':0}],['Soft CRT',{'BLED':60,'SCAN':-30,'XELA':0,'YELA':0}],['Broken convergence',{'BLED':40,'SCAN':-10,'XELA':70,'YELA':-55}]]},
{name:'Workbench',family:'Workbench',text:'SKYDATA.DAT',story:'Amiga interface memory with phosphor bleed and scanline-height controls.',axes:[['BLED',0,100,10,1],['SCAN',-53,100,0,1]],p:[['Crisp',{'BLED':0,'SCAN':0}],['Thin scanlines',{'BLED':10,'SCAN':-50}],['Phosphor smear',{'BLED':90,'SCAN':0}]]},
{name:'Handjet',family:'Handjet',text:'ORBITER 07',story:'Element size, 23 interpolating element shapes, and single-versus-2×2 element grids.',axes:[['wght',100,900,500,10],['ELSH',0,16,2,.05],['ELGR',1,2,1,.01]],p:[['Triangle',{'wght':500,'ELSH':1,'ELGR':1}],['Circle',{'wght':600,'ELSH':8,'ELGR':1}],['Flower',{'wght':600,'ELSH':13,'ELGR':1}],['Star double',{'wght':700,'ELSH':14,'ELGR':2}],['Heart',{'wght':650,'ELSH':16,'ELGR':1}]]},
{name:'Tiny5',family:'Tiny5',text:'ALT +17.4',story:'A five-pixel system with display failure modes exposed as design axes.',axes:[['BLED',0,100,0,1],['JITT',0,100,0,1],['ROND',0,100,0,1],['wdth',75,125,100,1],['wght',100,900,500,10]],p:[['LCD',{'BLED':0,'JITT':0,'ROND':0,'wdth':100,'wght':500}],['CRT',{'BLED':90,'JITT':0,'ROND':30,'wdth':100,'wght':650}],['Bad printer',{'BLED':20,'JITT':100,'ROND':0,'wdth':90,'wght':500}]]},
{name:'Nabla',family:'Nabla',text:'PROJECTED',story:'Isometric color letters with independent extrusion depth and edge highlight.',axes:[['EDPT',0,200,100,1],['EHLT',0,24,12,1]],p:[['Flat',{'EDPT':0,'EHLT':0}],['Deep',{'EDPT':200,'EHLT':8}],['Bright edge',{'EDPT':160,'EHLT':24}]]},
{name:'Honk',family:'Honk',text:'SUN MOON STAR',story:'MORF reshapes the body while SHLN changes the built-in dimensional shadow.',axes:[['MORF',0,45,10,1],['SHLN',0,100,20,1]],p:[['Compact',{'MORF':0,'SHLN':0}],['Morph',{'MORF':25,'SHLN':25}],['Long shadow',{'MORF':45,'SHLN':100}]]},
{name:'Kablammo',family:'Kablammo',text:'STAR STAR STAR',story:'One MORF axis moves decorative pieces through the glyph architecture; contextual alternates can make repeats diverge.',axes:[['MORF',0,60,0,1]],p:[['0',{'MORF':0}],['20',{'MORF':20}],['40',{'MORF':40}],['60',{'MORF':60}]]},
{name:'Kalnia Glaze',family:'Kalnia',text:'GLAZED LIGHT',story:'Width and weight reshape a layered color/glass construction.',axes:[['wdth',75,125,100,1],['wght',100,900,500,10]],p:[['Condensed light',{'wdth':75,'wght':300}],['Regular',{'wdth':100,'wght':500}],['Wide heavy',{'wdth':125,'wght':800}]]}
];
function css(v){return Object.entries(v).map(([k,x])=>`'${k}' ${x}`).join(',')}function make(f){let c=document.createElement('section');c.className='card';let v={};f.axes.forEach(a=>v[a[0]]=a[3]);c.innerHTML=`<h2>${f.name}</h2><div class=story>${f.story}</div><div class=live contenteditable=true spellcheck=false>${f.text}</div><input class=edit value="${f.text.replace(/"/g,'&quot;')}"><div class=axes></div><div class=presets></div><div class=status>checking font…</div>`;let live=c.querySelector('.live');live.style.fontFamily=f.family;live.style.fontVariationSettings=css(v);let edit=c.querySelector('.edit');edit.oninput=()=>live.textContent=edit.value;let ax=c.querySelector('.axes');f.axes.forEach(a=>{let d=document.createElement('div');d.className='axis';d.innerHTML=`<b>${a[0]}</b><input type=range min=${a[1]} max=${a[2]} step=${a[4]} value=${a[3]}><span>${a[3]}</span>`;let r=d.querySelector('input'),s=d.querySelector('span');r.oninput=()=>{v[a[0]]=r.value;s.textContent=r.value;live.style.fontVariationSettings=css(v)};ax.append(d)});let ps=c.querySelector('.presets');f.p.forEach(([n,x])=>{let b=document.createElement('button');b.textContent=n;b.onclick=()=>{Object.assign(v,x);live.style.fontVariationSettings=css(v);[...ax.children].forEach((d,i)=>{let a=f.axes[i],r=d.querySelector('input'),s=d.querySelector('span');if(v[a[0]]!==undefined){r.value=v[a[0]];s.textContent=v[a[0]]}})};ps.append(b)});let st=c.querySelector('.status');document.fonts.load(`32px ${f.family}`).then(x=>{st.textContent=x.length?'font loaded ✓':'font failed to load';st.classList.add(x.length?'ok':'bad')}).catch(()=>{st.textContent='font failed to load';st.classList.add('bad')});return c}F.forEach(f=>app.append(make(f)));
</script></body></html>
